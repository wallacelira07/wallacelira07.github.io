name: Executar Tudo (SAJ + Cotações + Pluggy + Mercado Pago)
# ORQUESTRADOR - criado 03/08/2026 como parte da migração pra abandonar "schedule"
# do GitHub Actions (nunca disparava sozinho neste repositório, apesar de tudo
# validado: YAML correto, branch main, repo público, execução manual funcionando).
#
# Disparo: EXCLUSIVAMENTE externo, via cron-job.org chamando a API do GitHub
# (workflow_dispatch). Ver AUTOMACAO_README.md pra configuração completa do
# cron-job.org (URL, headers, body, horários).
#
# Ordem de execução: SAJ -> Cotações -> Pluggy -> Mercado Pago, sequencial (cada um só
# começa depois que o anterior TERMINA - não precisa ter dado certo, ver decisão abaixo).
#
# DECISÃO DE DESIGN: uso "if: always()" nos jobs 2, 3 e 4 pra que uma falha no SAJ,
# por exemplo, não impeça as cotações, o Pluggy e o Mercado Pago de rodarem - são 4
# automações financeiras independentes, uma falhar não deveria travar as outras 3. O
# resultado final (job "resumo") sempre reporta o status dos 4, mesmo que algum
# tenha falhado - "erros tratados com logs claros", não silenciosamente ignorados.
on:
  workflow_dispatch: {}
# NOVO 15/08/2026 (achado da auditoria de 43 especialistas): sem concurrency, 2 disparos do
# orquestrador completo (ex: retry do webhook do cron-job.org) podiam rodar em paralelo,
# duplicando as 4 sincronizações. cancel-in-progress:false enfileira em vez de cancelar.
concurrency:
  group: executar-tudo
  cancel-in-progress: false
jobs:
  seguranca_views:
    name: "0/7 - Verificar Segurança (views endurecidas)"
    uses: ./.github/workflows/verificar_seguranca_views.yml
    secrets: inherit
  saj:
    name: "1/7 - Atualizar Geração Solar (SAJ)"
    uses: ./.github/workflows/atualizar_geracao_saj.yml
    secrets: inherit
  cotacoes:
    name: "2/7 - Atualizar Cotações de Ações"
    needs: saj
    if: always()
    uses: ./.github/workflows/atualizar_cotacoes_acoes.yml
    secrets: inherit
  cotacoes_opcoes:
    name: "3/8 - Atualizar Cotações de Opções (PETR4)"
    needs: cotacoes
    if: always()
    uses: ./.github/workflows/atualizar_cotacoes_opcoes.yml
    secrets: inherit
  medidor_tuya:
    name: "4/8 - Atualizar Medidor de Energia (Tuya)"
    needs: cotacoes_opcoes
    if: always()
    uses: ./.github/workflows/atualizar_medidor_tuya.yml
    secrets: inherit
  pluggy:
    name: "5/8 - Sincronizar Pluggy"
    needs: medidor_tuya
    if: always()
    uses: ./.github/workflows/sincronizar_pluggy.yml
    secrets: inherit
  mercadopago:
    name: "6/8 - Sincronizar Mercado Pago"
    needs: pluggy
    if: always()
    uses: ./.github/workflows/mercadopago_sync.yml
    secrets: inherit
  backup_externo:
    name: "7/8 - Backup Externo Criptografado"
    needs: mercadopago
    if: always()
    uses: ./.github/workflows/backup_externo.yml
    secrets: inherit
  resumo:
    name: "Resumo da execução"
    needs: [seguranca_views, saj, cotacoes, cotacoes_opcoes, medidor_tuya, pluggy, mercadopago, backup_externo]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Reportar status de cada etapa
        run: |
          echo "===== RESUMO DA EXECUÇÃO ====="
          echo "0/8 Verificar segurança:     ${{ needs.seguranca_views.result }}"
          echo "1/8 SAJ (geração solar):     ${{ needs.saj.result }}"
          echo "2/8 Cotações de ações:       ${{ needs.cotacoes.result }}"
          echo "3/8 Cotações de opções:      ${{ needs.cotacoes_opcoes.result }}"
          echo "4/8 Medidor de energia:      ${{ needs.medidor_tuya.result }}"
          echo "5/8 Pluggy (bancos):         ${{ needs.pluggy.result }}"
          echo "6/8 Mercado Pago:            ${{ needs.mercadopago.result }}"
          echo "7/8 Backup externo:          ${{ needs.backup_externo.result }}"
          echo "==============================="
          if [ "${{ needs.seguranca_views.result }}" != "success" ] || [ "${{ needs.saj.result }}" != "success" ] || [ "${{ needs.cotacoes.result }}" != "success" ] || [ "${{ needs.cotacoes_opcoes.result }}" != "success" ] || [ "${{ needs.medidor_tuya.result }}" != "success" ] || [ "${{ needs.pluggy.result }}" != "success" ] || [ "${{ needs.mercadopago.result }}" != "success" ] || [ "${{ needs.backup_externo.result }}" != "success" ]; then
            echo "::warning::Pelo menos uma etapa não terminou com sucesso - confira os logs de cada job acima."
            exit 1
          fi
          echo "Todas as 8 etapas rodaram com sucesso."
