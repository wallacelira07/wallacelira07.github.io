name: Executar Tudo (SAJ + Cotações + Pluggy + Mercado Pago)
# ORQUESTRADOR - criado 03/08/2026 como parte da migração pra abandonar "schedule"
# do GitHub Actions (nunca disparava sozinho neste repositório, apesar de tudo
# validado: YAML correto, branch main, repo público, execução manual funcionando).
#
# Disparo: EXCLUSIVAMENTE externo, via cron-job.org chamando a API do GitHub
# (workflow_dispatch). Ver AUTOMACAO_README.md pra configuração completa do
# cron-job.org (URL, headers, body, horários).
#
# Ordem de execução: SAJ -> Cotações -> Pluggy -> Mercado Pago, sequencial (cada um só
# começa depois que o anterior TERMINA - não precisa ter dado certo, ver decisão abaixo).
#
# DECISÃO DE DESIGN: uso "if: always()" nos jobs 2, 3 e 4 pra que uma falha no SAJ,
# por exemplo, não impeça as cotações, o Pluggy e o Mercado Pago de rodarem - são 4
# automações financeiras independentes, uma falhar não deveria travar as outras 3. O
# resultado final (job "resumo") sempre reporta o status dos 4, mesmo que algum
# tenha falhado - "erros tratados com logs claros", não silenciosamente ignorados.
on:
  workflow_dispatch: {}
jobs:
  seguranca_views:
    name: "0/6 - Verificar Segurança (views endurecidas)"
    uses: ./.github/workflows/verificar_seguranca_views.yml
    secrets: inherit
  saj:
    name: "1/6 - Atualizar Geração Solar (SAJ)"
    uses: ./.github/workflows/atualizar_geracao_saj.yml
    secrets: inherit
  cotacoes:
    name: "2/6 - Atualizar Cotações de Ações"
    needs: saj
    if: always()
    uses: ./.github/workflows/atualizar_cotacoes_acoes.yml
    secrets: inherit
  pluggy:
    name: "3/6 - Sincronizar Pluggy"
    needs: cotacoes
    if: always()
    uses: ./.github/workflows/sincronizar_pluggy.yml
    secrets: inherit
  mercadopago:
    name: "4/6 - Sincronizar Mercado Pago"
    needs: pluggy
    if: always()
    uses: ./.github/workflows/mercadopago_sync.yml
    secrets: inherit
  backup_externo:
    name: "5/6 - Backup Externo Criptografado"
    needs: mercadopago
    if: always()
    uses: ./.github/workflows/backup_externo.yml
    secrets: inherit
  resumo:
    name: "Resumo da execução"
    needs: [seguranca_views, saj, cotacoes, pluggy, mercadopago, backup_externo]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Reportar status de cada etapa
        run: |
          echo "===== RESUMO DA EXECUÇÃO ====="
          echo "0/6 Verificar segurança:     ${{ needs.seguranca_views.result }}"
          echo "1/6 SAJ (geração solar):     ${{ needs.saj.result }}"
          echo "2/6 Cotações de ações:       ${{ needs.cotacoes.result }}"
          echo "3/6 Pluggy (bancos):         ${{ needs.pluggy.result }}"
          echo "4/6 Mercado Pago:            ${{ needs.mercadopago.result }}"
          echo "5/6 Backup externo:          ${{ needs.backup_externo.result }}"
          echo "==============================="
          if [ "${{ needs.seguranca_views.result }}" != "success" ] || [ "${{ needs.saj.result }}" != "success" ] || [ "${{ needs.cotacoes.result }}" != "success" ] || [ "${{ needs.pluggy.result }}" != "success" ] || [ "${{ needs.mercadopago.result }}" != "success" ] || [ "${{ needs.backup_externo.result }}" != "success" ]; then
            echo "::warning::Pelo menos uma etapa não terminou com sucesso - confira os logs de cada job acima."
            exit 1
          fi
          echo "Todas as 6 etapas rodaram com sucesso."
