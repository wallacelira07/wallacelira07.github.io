name: Mercado Pago Sync

on:
  workflow_call:
  workflow_dispatch:

# NOVO 15/08/2026 (achado da auditoria de 43 especialistas): sem concurrency, um disparo manual
# podia sobrepor o disparo automático via executar_tudo.yml. cancel-in-progress:false enfileira
# em vez de cancelar - nunca interrompe uma sincronização financeira no meio.
concurrency:
  group: mercadopago-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Rodar mercadopago_sync.py
        env:
          MERCADO_PAGO_ACCESS_TOKEN: ${{ secrets.MERCADO_PAGO_ACCESS_TOKEN }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
        run: python3 scripts/sync/mercadopago_sync.py
