name: Atualizar Cotações de Ações (PETR4/ITUB4)
# Roda 2x por dia útil - abertura (10h) e fechamento (17h) da B3, horário de Brasília.
# Horários deslocados da hora cheia (:12/:17 em vez de :00) - mesma razão do script solar:
# agendamentos exatamente na hora cheia têm mais chance de atrasar/não disparar no GitHub Actions.
on:
  schedule:
    - cron: '12 13 * * 1-5'   # seg-sex, 13:12 UTC = 10:12 Brasília (abertura B3)
    - cron: '17 20 * * 1-5'   # seg-sex, 20:17 UTC = 17:17 Brasília (fechamento B3)
  workflow_dispatch: {}
jobs:
  atualizar-cotacoes:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar o código do repositório
        uses: actions/checkout@v4
      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Rodar script de atualização
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
          BRAPI_TOKEN: ${{ secrets.BRAPI_TOKEN }}
        run: python3 atualizar_cotacoes_acoes.py
