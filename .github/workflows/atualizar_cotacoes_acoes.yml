name: Atualizar Cotações de Ações (PETR4/ITUB4)
# MIGRADO 03/08/2026: ver nota completa em atualizar_geracao_saj.yml - "schedule"
# abandonado neste repositório (nunca disparou sozinho, mesmo com tudo correto).
# Disparo agora é externo via cron-job.org -> API do GitHub -> executar_tudo.yml.
# Continua reutilizável (workflow_call) e também disparável sozinho (workflow_dispatch),
# útil pra testar só as cotações sem rodar solar/Pluggy junto.
# PETR4/ITUB4/VALE3/MGLU3 não precisam de token; os demais tickers
# (ITSA4/BBDC4/BBAS3/WEGE3/ABEV3/B3SA3) exigem o BRAPI_TOKEN.
on:
  workflow_dispatch: {}
  workflow_call: {}
jobs:
  atualizar-cotacoes:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar o código do repositório
        uses: actions/checkout@v4
      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Rodar script de atualização
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
          BRAPI_TOKEN: ${{ secrets.BRAPI_TOKEN }}
        run: python3 atualizar_cotacoes_acoes.py
