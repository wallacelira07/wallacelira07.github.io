name: Teste Cron

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

# Prevent overlapping runs
concurrency:
  group: teste-cron
  cancel-in-progress: true

permissions:
  contents: read
  actions: write

jobs:
  teste:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Show environment and date
        run: |
          echo "Cron funcionando"
          echo "UTC date:"
          date -u
          echo "Local date:"
          date
          echo "GITHUB_EVENT_NAME=$GITHUB_EVENT_NAME"
          echo "GITHUB_REF=$GITHUB_REF"

      - name: Create test artifact
        run: |
          echo "run at $(date -u)" > cron_run.txt
          ls -la

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: cron-log
          path: cron_run.txt
