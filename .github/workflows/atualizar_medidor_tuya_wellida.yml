name: Atualizar Medidor de Energia (Tuya/Smart Life) — Casa da Wellida

# NOVO 18/08/2026, ATUALIZADO no mesmo dia com o Device ID real: o medidor da Wellida já foi
# instalado e vinculado ao app Smart Life dela (mesmo projeto Cloud Tuya do Wallace, conta
# wallace.termica@gmail.com, Western America Data Center) — Device ID `ebf0d04e88180e1474o2is`,
# Product Category "zndb" (智能电表 = "smart meter"), Status Online desde 18/08/2026 12:33.
#
# Schema de DPs CONFIRMADO diferente do medidor do Wallace (ver
# docs/decisions/COMO_CONFIGURAR_NOVO_MEDIDOR_TUYA.md) — esse aparelho só expõe
# forward_energy_total/reverse_energy_total (energia importada/exportada, kWh), sem tensão/
# corrente/potência/estado. Por isso TUYA_MODELO=bidirecional_ab abaixo (scripts/sync/
# atualizar_medidor_tuya.py já sabe extrair esse formato — ver função
# _extrair_leitura_bidirecional_ab).
#
# Os 4 secrets *_WELLIDA abaixo AINDA NÃO EXISTEM no GitHub — precisam ser criados (Settings >
# Secrets and variables > Actions) com os valores reais:
#   TUYA_ACCESS_ID_WELLIDA / TUYA_ACCESS_SECRET_WELLIDA — mesmas credenciais Cloud Project já
#     usadas no medidor do Wallace (é o mesmo projeto Tuya IoT, só o Device ID muda).
#   TUYA_DEVICE_ID_WELLIDA — ebf0d04e88180e1474o2is (confirmado no painel Tuya 18/08/2026).
#   TUYA_API_REGION_WELLIDA — us-e (Western America, mesma região do Wallace).
# Até os secrets existirem, este workflow falha com "variáveis de ambiente faltando" se disparado —
# comportamento esperado e seguro, não quebra nada do resto do sistema (workflow isolado, próprio
# concurrency group).
#
# Cron dedicado: criar tarefa própria no cron-job.org (mesmo padrão da tarefa do Wallace, ver
# ESTADO_ATUAL.md regra 18 — executar_tudo.yml sozinho não dispara isso) só depois que os secrets
# existirem e o primeiro workflow_dispatch manual confirmar que está lendo dado real.
on:
  workflow_dispatch: {}
  workflow_call: {}
concurrency:
  group: atualizar-medidor-tuya-wellida
  cancel-in-progress: false
jobs:
  atualizar:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar o código do repositório
        uses: actions/checkout@v4
      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Instalar dependências
        run: pip install tinytuya
      - name: Rodar atualização
        env:
          TUYA_ACCESS_ID: ${{ secrets.TUYA_ACCESS_ID_WELLIDA }}
          TUYA_ACCESS_SECRET: ${{ secrets.TUYA_ACCESS_SECRET_WELLIDA }}
          TUYA_DEVICE_ID: ${{ secrets.TUYA_DEVICE_ID_WELLIDA }}
          TUYA_API_REGION: ${{ secrets.TUYA_API_REGION_WELLIDA }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
          CASA: wellida
          TUYA_MODELO: bidirecional_ab
        run: python3 scripts/sync/atualizar_medidor_tuya.py
