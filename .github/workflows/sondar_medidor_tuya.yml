name: Sondar Medidor de Energia (Tuya/Smart Life) — só leitura, Fase 1

# NOVO 17/08/2026 (pedido do usuário: "de um jeito de fazer" — integrar um medidor de energia
# monitorado hoje pelo app Smart Life). Mesmo padrão de sondar_medidor_saj.yml (DDSU666): workflow
# separado do robô de produção, DE PROPÓSITO — só lê e imprime a resposta real da Tuya Cloud API,
# nunca escreve no Supabase. Existe pra descobrir o formato exato dos campos (voltage/current/power/
# energia) antes de desenhar a tabela/robô de produção — ver scripts/sync/sondar_medidor_tuya.py
# pro passo a passo completo de como o usuário obtém as credenciais (conta Tuya IoT Platform,
# precisa ser feito por ele — não é algo que um agente consiga fazer em nome dele).
#
# SÓ FUNCIONA depois que os secrets TUYA_ACCESS_ID / TUYA_ACCESS_SECRET / TUYA_DEVICE_ID existirem
# no repositório (Settings > Secrets and variables > Actions) — sem isso, o job falha rápido com uma
# mensagem clara dizendo o que falta, não silenciosamente.
on:
  workflow_dispatch: {}
jobs:
  sondar:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar o código do repositório
        uses: actions/checkout@v4
      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Instalar dependências
        run: pip install tinytuya
      - name: Rodar sondagem (só leitura, nenhuma escrita no Supabase)
        env:
          TUYA_ACCESS_ID: ${{ secrets.TUYA_ACCESS_ID }}
          TUYA_ACCESS_SECRET: ${{ secrets.TUYA_ACCESS_SECRET }}
          TUYA_DEVICE_ID: ${{ secrets.TUYA_DEVICE_ID }}
          TUYA_API_REGION: ${{ secrets.TUYA_API_REGION }}
        run: python3 scripts/sync/sondar_medidor_tuya.py
