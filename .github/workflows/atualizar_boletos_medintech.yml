name: Atualizar Faturas de Consumo (Água/Gás/Energia via Gmail)

# NOVO 19/08/2026, AMPLIADO 19/08/2026 (Energisa) — ver scripts/sync/atualizar_boletos_medintech.py.
# Nome de exibição atualizado (arquivo/nome interno continuam iguais, cron-job.org não precisa
# mudar nada). Mesmo padrão dos outros robôs
# deste sistema: workflow reutilizável (workflow_call) chamado pelo orquestrador executar_tudo.yml,
# com workflow_dispatch também disponível pra rodar manualmente pela aba Actions. SEM "on: schedule"
# de propósito — confirmado (achado de 03/08/2026, ver atualizar_geracao_saj.yml) que o schedule do
# GitHub Actions nunca dispara sozinho neste repositório; precisa de tarefa dedicada no
# cron-job.org chamando a API do GitHub (workflow_dispatch), mesmo mecanismo dos outros jobs.
on:
  workflow_dispatch: {}
  workflow_call: {}
concurrency:
  group: atualizar-boletos-medintech
  cancel-in-progress: false
jobs:
  atualizar:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar o código do repositório
        uses: actions/checkout@v4
      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Instalar dependências
        run: pip install pdfplumber
      - name: Rodar atualização
        env:
          GMAIL_CLIENT_ID: ${{ secrets.GMAIL_CLIENT_ID }}
          GMAIL_CLIENT_SECRET: ${{ secrets.GMAIL_CLIENT_SECRET }}
          GMAIL_REFRESH_TOKEN: ${{ secrets.GMAIL_REFRESH_TOKEN }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
        run: python3 scripts/sync/atualizar_boletos_medintech.py
