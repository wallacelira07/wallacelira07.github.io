name: Atualizar Faturas Energia/Água/Gás/Consórcio/Condomínio (via Gmail)

# NOVO 19/08/2026, AMPLIADO 19/08/2026 (Energisa) — ver scripts/sync/atualizar_boletos_medintech.py.
# Nome de exibição atualizado (arquivo/nome interno continuam iguais, cron-job.org não precisa
# mudar nada). Mesmo padrão dos outros robôs
# deste sistema: workflow reutilizável (workflow_call) chamado pelo orquestrador executar_tudo.yml,
# com workflow_dispatch também disponível pra rodar manualmente pela aba Actions. SEM "on: schedule"
# de propósito — confirmado (achado de 03/08/2026, ver atualizar_geracao_saj.yml) que o schedule do
# GitHub Actions nunca dispara sozinho neste repositório; precisa de tarefa dedicada no
# cron-job.org chamando a API do GitHub (workflow_dispatch), mesmo mecanismo dos outros jobs.
# AMPLIADO 20/08/2026 (pedido do usuário: "não pode usar o mesmo?", em vez de criar uma tarefa nova
# no cron-job.org pro robô de consórcio Porto): passo extra rodando
# scripts/sync/atualizar_consorcio_porto.py dentro do MESMO workflow — reaproveita a tarefa de
# cron-job.org já existente ("Atualizar Faturas Energia (Energisa) e Água/Gás (Medintech) - 12hs",
# roda 1x/dia às 12h), zero configuração nova pro usuário. atualizar_consorcio_porto.yml continua existindo
# à parte só pra permitir rodar/testar o robô do consórcio sozinho pela aba Actions, se precisar.
# AMPLIADO 20/08/2026 (mesmo dia, mesmo pedido) — passo extra rodando
# scripts/sync/atualizar_boleto_condominio.py: e-mail da administradora (Condomob, "Nova Mais") traz
# o valor no corpo do e-mail, texto plano, sem PDF. Achado real na validação: o e-mail mostra o
# valor NOMINAL, sem o desconto de pontualidade (R$10,00 fixo, confirmado pelo usuário) — o script
# já desconta antes de gravar (ver docs/decisions/AUTOMACAO_CONDOMINIO_GMAIL.md). O usuário também
# reconfigurou esta tarefa no cron-job.org pra rodar 4x/dia (0h/8h/14h/20h) em vez de 1x/dia —
# todos os passos deste job se beneficiam da frequência maior automaticamente.
on:
  workflow_dispatch: {}
  workflow_call: {}
concurrency:
  group: atualizar-boletos-medintech
  cancel-in-progress: false
jobs:
  atualizar:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar o código do repositório
        uses: actions/checkout@v4
      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Instalar dependências
        run: pip install pdfplumber
      - name: Rodar atualização (Água/Gás/Energia)
        env:
          GMAIL_CLIENT_ID: ${{ secrets.GMAIL_CLIENT_ID }}
          GMAIL_CLIENT_SECRET: ${{ secrets.GMAIL_CLIENT_SECRET }}
          GMAIL_REFRESH_TOKEN: ${{ secrets.GMAIL_REFRESH_TOKEN }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
        run: python3 scripts/sync/atualizar_boletos_medintech.py
      - name: Rodar atualização (Consórcio Porto)
        if: always()
        env:
          GMAIL_CLIENT_ID: ${{ secrets.GMAIL_CLIENT_ID }}
          GMAIL_CLIENT_SECRET: ${{ secrets.GMAIL_CLIENT_SECRET }}
          GMAIL_REFRESH_TOKEN: ${{ secrets.GMAIL_REFRESH_TOKEN }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
        run: python3 scripts/sync/atualizar_consorcio_porto.py
      - name: Rodar atualização (Condomínio Bellagio)
        if: always()
        env:
          GMAIL_CLIENT_ID: ${{ secrets.GMAIL_CLIENT_ID }}
          GMAIL_CLIENT_SECRET: ${{ secrets.GMAIL_CLIENT_SECRET }}
          GMAIL_REFRESH_TOKEN: ${{ secrets.GMAIL_REFRESH_TOKEN }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
        run: python3 scripts/sync/atualizar_boleto_condominio.py
