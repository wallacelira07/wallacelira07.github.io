name: Atualizar Geração Solar (SAJ → Supabase)
# MIGRADO 03/08/2026: o evento "schedule" do GitHub Actions nunca disparou sozinho
# neste repositório, mesmo com YAML válido, branch main, repo público e execução
# manual funcionando perfeitamente - testado exaustivamente. Migrado para disparo
# externo via cron-job.org, que chama a API do GitHub (workflow_dispatch) no
# orquestrador "executar_tudo.yml". Este arquivo agora é REUTILIZÁVEL
# (workflow_call) e continua podendo ser rodado sozinho, manualmente, quando quiser
# (workflow_dispatch) - útil pra testar/debugar só este script sem rodar os outros 2.
on:
  workflow_dispatch: {}
  workflow_call: {}
# NOVO 15/08/2026 (achado da auditoria de 43 especialistas): sem concurrency, um disparo manual
# podia sobrepor o disparo automático via executar_tudo.yml. cancel-in-progress:false enfileira
# em vez de cancelar - nunca interrompe uma sincronização no meio.
concurrency:
  group: atualizar-geracao-saj
  cancel-in-progress: false
jobs:
  atualizar-geracao:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar o código do repositório
        uses: actions/checkout@v4
      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Instalar dependências
        run: pip install cryptography
      - name: Rodar script de atualização
        env:
          SAJ_USERNAME: ${{ secrets.SAJ_USERNAME }}
          SAJ_PASSWORD: ${{ secrets.SAJ_PASSWORD }}
          SAJ_PLANT_UID: ${{ secrets.SAJ_PLANT_UID }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
        run: python3 scripts/sync/atualizar_geracao_saj.py
