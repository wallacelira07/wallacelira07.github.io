name: Sincronizar Pluggy (Bancos → Supabase)
# Roda 1x por dia, de graça, via GitHub Actions (mesma automação já usada pra
# geração solar e cotações de ações). Pode rodar manual pelo botão "Run workflow".
# Horário deslocado da hora cheia (:12 em vez de :00) - mesma razão do script solar.
on:
  schedule:
    - cron: '12 11 * * *'  # todo dia às 11:12 UTC (08:12 horário de Brasília)
  workflow_dispatch: {}

jobs:
  sincronizar-pluggy:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar o código do repositório
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Rodar script de sincronização
        env:
          PLUGGY_CLIENT_ID: ${{ secrets.PLUGGY_CLIENT_ID }}
          PLUGGY_CLIENT_SECRET: ${{ secrets.PLUGGY_CLIENT_SECRET }}
          PLUGGY_ITEM_IDS: ${{ secrets.PLUGGY_ITEM_IDS }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
          EMAIL_FROM: ${{ secrets.EMAIL_FROM }}
          EMAIL_PASSWORD: ${{ secrets.EMAIL_PASSWORD }}
          EMAIL_TO: ${{ secrets.EMAIL_TO }}
        run: python3 sincronizar_pluggy.py
