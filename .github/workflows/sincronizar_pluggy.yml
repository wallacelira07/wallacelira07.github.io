name: Sincronizar Pluggy (Bancos → Supabase)
# MIGRADO 03/08/2026: ver nota completa em atualizar_geracao_saj.yml - "schedule"
# abandonado neste repositório (nunca disparou sozinho, mesmo com tudo correto).
# Disparo agora é externo via cron-job.org -> API do GitHub -> executar_tudo.yml.
# Continua reutilizável (workflow_call) e também disparável sozinho (workflow_dispatch).
on:
  workflow_dispatch: {}
  workflow_call: {}

jobs:
  sincronizar-pluggy:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar o código do repositório
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Rodar script de sincronização
        env:
          PLUGGY_CLIENT_ID: ${{ secrets.PLUGGY_CLIENT_ID }}
          PLUGGY_CLIENT_SECRET: ${{ secrets.PLUGGY_CLIENT_SECRET }}
          PLUGGY_ITEM_IDS: ${{ secrets.PLUGGY_ITEM_IDS }}
          PLUGGY_WEBHOOK_SECRET: ${{ secrets.PLUGGY_WEBHOOK_SECRET }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
          EMAIL_FROM: ${{ secrets.EMAIL_FROM }}
          EMAIL_PASSWORD: ${{ secrets.EMAIL_PASSWORD }}
          EMAIL_TO: ${{ secrets.EMAIL_TO }}
        run: python3 scripts/sync/sincronizar_pluggy.py
