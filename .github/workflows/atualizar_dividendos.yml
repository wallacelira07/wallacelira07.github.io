name: Atualizar Dividendos de Ações
# Mesmo padrão de atualizar_cotacoes_acoes.yml: workflow_dispatch + workflow_call,
# disparável isolado pra teste e reutilizável de dentro de executar_tudo.yml.
# Dividendos mudam raramente (poucas vezes por trimestre), então além do disparo
# manual/externo também roda sozinho 1x por dia (não precisa de tempo real).
# PETR4/ITUB4/VALE3/MGLU3 não precisam de token; os demais tickers
# (ITSA4/BBDC4/BBAS3/WEGE3/ABEV3/B3SA3) exigem o BRAPI_TOKEN.
on:
  workflow_dispatch: {}
  workflow_call: {}
  schedule:
    - cron: '0 9 * * *'
# Sem concurrency, um disparo manual podia sobrepor um disparo automático.
# cancel-in-progress:false enfileira em vez de cancelar - nunca interrompe
# uma sincronização no meio (mesmo padrão de atualizar_cotacoes_acoes.yml).
concurrency:
  group: atualizar-dividendos
  cancel-in-progress: false
jobs:
  atualizar-dividendos:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar o código do repositório
        uses: actions/checkout@v4
      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Rodar script de atualização
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
          BRAPI_TOKEN: ${{ secrets.BRAPI_TOKEN }}
        run: python3 scripts/sync/atualizar_dividendos.py
