name: Backup Externo (Supabase -> GitHub)
# NOVO 11/08/2026 - fecha o ultimo ponto unico de falha da auditoria de
# continuidade de negocio: sem isto, TODAS as copias de backup viviam dentro
# da mesma instancia Supabase e nao sobreviveriam a perda total do projeto.
# Grava 2 copias independentes dentro deste mesmo repositorio GitHub
# (infraestrutura totalmente separada da Supabase):
#   1. DADOS - snapshot de todas as linhas de todas as tabelas, criptografado
#      (Fernet/AES) porque o repositorio e PUBLICO.
#   2. SCHEMA - estrutura (tabelas, funcoes, RLS, triggers, indices) via
#      pg_dump --schema-only, em texto puro (nao contem dado sensivel, so
#      estrutura - mesmo padrao de qualquer codigo ja publico neste repo).
# Sem as duas juntas, um projeto Supabase recriado do zero nao teria como
# reconstruir nem a estrutura nem o conteudo. Ver
# docs/decisions/CONTINUIDADE_NEGOCIO_DR.md para o procedimento completo.
on:
  workflow_dispatch: {}
  workflow_call: {}
# NOVO 15/08/2026 (achado da auditoria de 43 especialistas): sem concurrency, um disparo manual
# podia sobrepor o disparo automático. cancel-in-progress:false enfileira em vez de cancelar.
concurrency:
  group: backup-externo
  cancel-in-progress: false
permissions:
  contents: write
jobs:
  backup-externo:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar o código do repositório
        uses: actions/checkout@v4
      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Instalar dependências Python
        run: pip install cryptography
      - name: Backup de DADOS (criptografado)
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
          BACKUP_ENCRYPTION_KEY: ${{ secrets.BACKUP_ENCRYPTION_KEY }}
        run: python3 scripts/sync/backup_externo_criptografado.py
      - name: Instalar cliente PostgreSQL (pg_dump)
        # O runner do GitHub vem só com postgresql-client 16, mas o servidor
        # do Supabase roda Postgres 17 - pg_dump recusa dumpar de um servidor
        # mais novo que a própria versão (descoberto na primeira execução
        # real, 11/08/2026). Adiciona o repositório oficial PGDG pra
        # instalar o client 17. NOTA (2ª tentativa, mesmo dia): instalar o
        # pacote não troca o /usr/bin/pg_dump do PATH sozinho no runner do
        # GitHub - o passo seguinte chama o binário versionado direto
        # (/usr/lib/postgresql/17/bin/pg_dump) pra não depender disso.
        run: |
          sudo install -d /usr/share/postgresql-common/pgdg
          sudo curl -o /usr/share/postgresql-common/pgdg/apt.postgresql.org.asc --fail https://www.postgresql.org/media/keys/ACCC4CF8.asc
          sudo sh -c 'echo "deb [signed-by=/usr/share/postgresql-common/pgdg/apt.postgresql.org.asc] https://apt.postgresql.org/pub/repos/apt $(. /etc/os-release && echo $VERSION_CODENAME)-pgdg main" > /etc/apt/sources.list.d/pgdg.list'
          sudo apt-get update -qq
          sudo apt-get install -y -qq postgresql-client-17
          /usr/lib/postgresql/17/bin/pg_dump --version
      - name: Backup de SCHEMA (estrutura, texto puro)
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: |
          mkdir -p backups_externos
          if [ -z "$SUPABASE_DB_URL" ]; then
            echo "::warning::SUPABASE_DB_URL não configurado - pulando backup de schema (só dados foi salvo)."
          else
            TIMESTAMP=$(date -u +%Y%m%d_%H%M%S)
            /usr/lib/postgresql/17/bin/pg_dump "$SUPABASE_DB_URL" --schema-only --no-owner --no-privileges \
              --schema=public \
              -f "backups_externos/wallace_schema_${TIMESTAMP}.sql"
            echo "Schema salvo: backups_externos/wallace_schema_${TIMESTAMP}.sql"
            python3 scripts/sync/podar_backups_externos.py --prefixo wallace_schema_ --sufixo .sql --dias 30
          fi
      - name: Commitar e enviar os backups pro repositório
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add backups_externos/
          if git diff --cached --quiet; then
            echo "Nada novo pra commitar (backup idêntico ao anterior ou etapa anterior falhou)."
          else
            git commit -m "Backup externo automático (dados + schema)"
            git push
          fi
