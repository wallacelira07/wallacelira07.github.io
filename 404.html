<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<!-- ADICIONADO 15/08/2026 (quick win da auditoria de 43 especialistas): página utilitária de
     redirect/erro, nunca deve aparecer em buscador. -->
<meta name="robots" content="noindex, nofollow">
<title>Página não encontrada — Sistema Wallace Lira</title>
<!-- CORRIGIDO 14/08/2026 (achado do usuário: "o ícone da aba nunca fica certo num link novo" —
     links /solar/<token> passam por ESTE arquivo antes do redirect JS abaixo (comentário logo
     adiante explica o porquê). Faltava o ícone SVG aqui (só tinha os 2 PNG) — diferente de
     index.html/solar-compartilhado.html, que declaram o SVG primeiro. O navegador gruda no favicon
     que existia no instante do redirect e não recarrega depois; com o conjunto de ícones incompleto/
     diferente aqui, ficava mostrando o globo genérico em vez do logo. Mesmos 3 links, mesma ordem,
     dos outros 2 arquivos — agora idêntico, não importa em qual dos 3 o navegador "gruda". -->
<link rel="icon" type="image/svg+xml" href="/assets/images/favicon.svg">
<link rel="icon" type="image/png" sizes="32x32" href="/assets/images/favicon-32.png">
<link rel="icon" type="image/png" sizes="192x192" href="/assets/images/favicon-192.png">
<link rel="apple-touch-icon" href="/assets/images/apple-touch-icon.png">
<!-- GitHub Pages não faz rewrite/redirect de servidor (confirmado: header "Server: GitHub.com", sem
     suporte a _headers/_redirects). Esse 404.html é o único jeito de dar suporte a URL bonita
     (12/08/2026, pedido do usuário: "esses links devem ser amigáveis... algo mais profissional") —
     GH Pages serve este arquivo pra qualquer caminho que não exista fisicamente no repo. Se o caminho
     for /solar/<token>, redireciona (client-side) pra solar-compartilhado.html?token=<token>, que por
     sua vez troca a URL visível de volta pra /solar/<token> via history.replaceState (ver comentário
     lá). Qualquer outro caminho cai na mensagem genérica de "não encontrado" abaixo. -->
<style>
  :root{ --bg:#0f1113; --panel:#16181b; --border:#2a2d31; --text:#e8e6df; --text-dim:#a9a79f; --blue:#3987e5; }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,'Segoe UI',Roboto,sans-serif;padding:1.2rem;max-width:520px;margin-inline:auto;min-height:100vh;display:flex;align-items:center;justify-content:center}
  .card{background:var(--panel);border:1px solid var(--border);border-radius:12px;padding:2rem 1.6rem;text-align:center}
  h1{font-size:1.1rem;margin:0 0 0.6rem}
  p{font-size:0.85rem;color:var(--text-dim);line-height:1.5;margin:0 0 1.2rem}
  a{color:var(--blue);text-decoration:none;font-weight:600}
</style>
</head>
<body>
  <div class="card" id="app">
    <h1>🔍 Página não encontrada</h1>
    <p>Esse endereço não existe ou o link está incompleto.</p>
    <a href="/">Voltar para o início</a>
  </div>
<script>
(function(){
  var m = location.pathname.match(/^\/solar\/([^\/]+)\/?$/);
  if(m && m[1]){
    location.replace('/solar-compartilhado.html?token=' + encodeURIComponent(m[1]));
  }
})();
</script>
</body>
</html>
