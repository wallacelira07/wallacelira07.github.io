<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Expires" content="0">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sistema Wallace Lira - Login</title>

    <!-- ATUALIZADO 12/08/2026 (pedido do usuário: "troque esse ícone... pelo que você usou na tela de
         login") - SVG primeiro (badge gradiente + barras, mesmo desenho do login-brand-icon/brand-icon)
         é o que a maioria dos navegadores usa hoje; PNGs antigos ficam só de fallback pra Safari/iOS,
         que ainda não escolhe favicon SVG sozinho. -->
    <link rel="icon" type="image/svg+xml" href="assets/images/favicon.svg">
    <link rel="icon" type="image/png" sizes="32x32" href="assets/images/favicon-32.png">
    <link rel="icon" type="image/png" sizes="192x192" href="assets/images/favicon-192.png">
    <link rel="apple-touch-icon" href="assets/images/apple-touch-icon.png">
    
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html, body {
            height: 100%;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            background:
                radial-gradient(560px 420px at 18% 8%, rgba(57,135,229,0.14), transparent 60%),
                radial-gradient(620px 480px at 88% 92%, rgba(144,133,233,0.12), transparent 60%),
                #0b0c0e;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
            overflow: hidden;
        }
        /* CORRIGIDO 12/08/2026 (achado do usuário: "barra de fora feia, deixe só a interna bonita") —
           o padding:20px acima existe só pra centralizar o card de login pequeno; depois do login,
           #dashboardScreen (height:100vh) + esse padding somavam mais que 100vh de conteúdo, forçando
           o <body> externo a criar seu PRÓPRIO scrollbar nativo (sem o estilo customizado que já existe
           em assets/css/styles.css, só aplicado dentro do painel/iframe) — 2 barras visíveis ao mesmo
           tempo. Classe alternada por showDashboard()/showLoginScreen() (abaixo) zera o padding/gutter
           só quando o painel está ativo; a tela de login continua centralizada como sempre. */
        body.dashboard-active {
            padding: 0;
            align-items: stretch;
            justify-content: stretch;
        }

        /* MODERNIZADO 12/08/2026 (pedido do usuário): mesma linguagem visual do cabeçalho do painel
           (brand-icon em gradiente, linha de acento no topo do card, botões com lift no hover) -
           antes era um card genérico sem nenhuma relação com o resto do produto. Zero mudança de
           IDs/estrutura que o JS de login depende (email/password/loginBtn/errorMessage intactos). */
        #loginScreen {
            position: relative;
            background: linear-gradient(180deg, #17191d 0%, #131518 100%);
            border: 1px solid rgba(255,255,255,0.08);
            border-radius: 16px;
            box-shadow: 0 24px 70px rgba(0, 0, 0, 0.55), inset 0 1px 0 rgba(255,255,255,0.04);
            padding: 38px 36px 34px;
            max-width: 380px;
            width: 100%;
            overflow: hidden;
            animation: loginCardIn 0.5s cubic-bezier(0.16, 1, 0.3, 1);
        }
        #loginScreen::before {
            content: '';
            position: absolute;
            left: 0; right: 0; top: 0;
            height: 1px;
            background: linear-gradient(90deg, rgba(57,135,229,0) 0%, rgba(57,135,229,0.7) 25%, rgba(144,133,233,0.6) 55%, rgba(57,135,229,0) 100%);
        }
        @media (prefers-reduced-motion: reduce) {
            #loginScreen { animation: none; }
        }
        @keyframes loginCardIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .login-brand {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 14px;
            margin-bottom: 30px;
            text-align: center;
        }
        .login-brand-icon {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            width: 52px;
            height: 52px;
            border-radius: 14px;
            background: linear-gradient(135deg, rgba(57,135,229,0.28), rgba(144,133,233,0.2));
            border: 1px solid rgba(255,255,255,0.1);
            box-shadow: inset 0 1px 0 rgba(255,255,255,0.08);
            color: #8ab4f8;
        }
        #loginScreen h1 {
            color: #f3f1ec;
            font-size: 19px;
            font-weight: 700;
            letter-spacing: 0.1px;
            line-height: 1.3;
        }
        .login-brand-sub {
            font-size: 10.5px;
            font-weight: 600;
            letter-spacing: 0.7px;
            text-transform: uppercase;
            color: #6f9bd8;
        }

        .form-group {
            margin-bottom: 18px;
        }

        .form-group label {
            display: block;
            margin-bottom: 7px;
            color: #a9a79f;
            font-weight: 500;
            font-size: 13px;
        }

        .form-group .input-wrap {
            position: relative;
            display: flex;
            align-items: center;
        }
        .form-group .input-wrap svg {
            position: absolute;
            left: 13px;
            color: #6f9bd8;
            pointer-events: none;
            flex-shrink: 0;
        }

        .form-group input {
            width: 100%;
            padding: 12px 12px 12px 38px;
            background: rgba(255,255,255,0.03);
            border: 1px solid #2a2d31;
            border-radius: 9px;
            color: #e8e6df;
            /* CORRIGIDO (mobile perf): 14px < 16px dispara zoom automatico do iOS Safari ao focar
               o campo de login (bug conhecido do WebKit) - 16px é o minimo que evita o zoom. */
            font-size: 16px;
            font-family: inherit;
            transition: border-color 0.15s ease, background-color 0.15s ease, box-shadow 0.15s ease;
        }

        .form-group input::placeholder {
            color: #6f6d66;
        }

        .form-group input:focus {
            outline: none;
            border-color: #3987e5;
            background: rgba(57,135,229,0.06);
            box-shadow: 0 0 0 3px rgba(57, 135, 229, 0.15);
        }

        /* NOVO 01/08/2026: botao de esconder valores - antes era emoji fixo que nunca trocava
           (bug estrutural: a funcao que trocava o icone rodava dentro do iframe, nao alcancava
           este botao que mora aqui fora). Agora 2 icones SVG (olho aberto/fechado, mesmo traco
           do botao Sair ao lado) com transicao suave de opacidade+escala+rotacao. */
        .eye-toggle-btn {
            position: relative;
            background: rgba(255,255,255,0.03);
            border: 1px solid rgba(255,255,255,0.12);
            border-radius: 50%;
            width: 34px;
            height: 34px;
            cursor: pointer;
            color: #a9a79f;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            transition: border-color 0.2s ease, background-color 0.2s ease, transform 0.15s ease, color 0.2s ease, box-shadow 0.2s ease;
        }
        .eye-toggle-btn:hover {
            border-color: rgba(57, 135, 229, 0.55);
            background: rgba(57, 135, 229, 0.1);
            color: #8ab4f8;
            transform: translateY(-1px);
            box-shadow: 0 4px 14px rgba(57, 135, 229, 0.18);
        }
        .eye-toggle-btn:active {
            transform: translateY(0) scale(0.94);
        }
        /* NOVO 14/08/2026 (achado de auditoria, mesma rodada de refino de estados interativos que já
           cobriu todo o styles.css do painel interno): botões redondos do cabeçalho/login tinham
           :hover/:active mas nenhum :focus-visible próprio — navegação por teclado (Tab) caía no anel
           padrão do navegador, que em botão circular sobre fundo escuro fica com "cantos" quadrados
           destoando do resto do site. Mesmo azul de marca (#3987e5) já usado no anel de foco dos campos
           de login (linha ~167) e no botão de busca (linha ~484), só reaproveitado. */
        .eye-toggle-btn:focus-visible {
            outline: none;
            box-shadow: 0 0 0 3px rgba(57, 135, 229, 0.35);
        }
        .eye-toggle-btn.ativo {
            background: rgba(57, 135, 229, 0.16);
            border-color: #3987e5;
            color: #3987e5;
        }
        .eye-icon {
            position: absolute;
            transition: opacity 0.25s ease, transform 0.25s ease;
        }
        .eye-open {
            opacity: 1;
            transform: scale(1) rotate(0deg);
        }
        .eye-closed {
            opacity: 0;
            transform: scale(0.4) rotate(-25deg);
        }
        .eye-toggle-btn.ativo .eye-open {
            opacity: 0;
            transform: scale(0.4) rotate(25deg);
        }
        .eye-toggle-btn.ativo .eye-closed {
            opacity: 1;
            transform: scale(1) rotate(0deg);
        }

        /* Escopado só em #loginBtn (era o seletor genérico `button`, que por sorte nunca colidia com
           os outros botões da página porque todos ou têm classe própria com mais especificidade ou
           style inline - mas escopar explícito é mais seguro que depender dessa coincidência). */
        #loginBtn {
            position: relative;
            width: 100%;
            padding: 13px;
            margin-top: 6px;
            background: linear-gradient(135deg, #3987e5, #7c6fe0);
            color: white;
            border: none;
            border-radius: 9px;
            font-size: 15px;
            font-weight: 600;
            font-family: inherit;
            letter-spacing: 0.2px;
            cursor: pointer;
            transition: transform 0.15s ease, box-shadow 0.2s ease, filter 0.15s ease;
            box-shadow: 0 8px 20px rgba(57, 135, 229, 0.28);
        }

        #loginBtn:hover:not(:disabled) {
            transform: translateY(-1px);
            filter: brightness(1.06);
            box-shadow: 0 10px 26px rgba(57, 135, 229, 0.36);
        }
        #loginBtn:active:not(:disabled) {
            transform: translateY(0) scale(0.99);
        }
        #loginBtn:focus-visible {
            outline: none;
            box-shadow: 0 8px 20px rgba(57, 135, 229, 0.28), 0 0 0 3px rgba(57, 135, 229, 0.35);
        }

        #loginBtn:disabled {
            background: #2a2d31;
            color: #6f6d66;
            cursor: not-allowed;
            box-shadow: none;
            padding-right: 34px;
        }
        /* Spinner CSS-puro - o JS só troca textContent ('Entrar' <-> 'Entrando...'), nunca innerHTML,
           então um filho real seria apagado a cada troca; ::after sobrevive porque não é filho do DOM. */
        #loginBtn:disabled::after {
            content: '';
            position: absolute;
            right: 13px;
            top: 50%;
            width: 14px;
            height: 14px;
            margin-top: -7px;
            border: 2px solid rgba(255,255,255,0.25);
            border-top-color: #a9a79f;
            border-radius: 50%;
            animation: loginSpin 0.7s linear infinite;
        }
        @media (prefers-reduced-motion: reduce) {
            #loginBtn:disabled::after { animation: none; }
        }
        @keyframes loginSpin {
            to { transform: rotate(360deg); }
        }

        .error-message {
            color: #ff8783;
            font-size: 13.5px;
            margin-top: 16px;
            padding: 10px 12px;
            background: rgba(226, 85, 79, 0.12);
            border: 1px solid rgba(226, 85, 79, 0.3);
            border-radius: 8px;
            display: none;
            text-align: center;
            animation: loginErrorIn 0.2s ease;
        }
        @keyframes loginErrorIn {
            from { opacity: 0; transform: translateY(-4px); }
            to { opacity: 1; transform: translateY(0); }
        }

        #dashboardScreen {
            display: none;
            width: 100%;
            height: 100vh;
            flex-direction: column;
        }

        #dashboardScreen header {
            background: linear-gradient(180deg, #15171c 0%, #0e1013 100%);
            color: #eceae4;
            padding: 11px 24px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid rgba(255,255,255,0.06);
            position: relative;
            min-height: 56px;
            box-shadow: 0 1px 0 rgba(0,0,0,0.4);
        }

        #dashboardScreen header::after {
            content: '';
            position: absolute;
            left: 0; right: 0; bottom: -1px;
            height: 1px;
            background: linear-gradient(90deg, rgba(57,135,229,0.55) 0%, rgba(144,133,233,0.4) 45%, rgba(57,135,229,0) 100%);
        }

        #dashboardScreen header .brand {
            display: flex;
            align-items: center;
            gap: 11px;
            cursor: pointer;
            border-radius: 8px;
            transition: opacity .15s ease;
        }
        #dashboardScreen header .brand:hover {
            opacity: 0.82;
        }

        #dashboardScreen header .brand-icon {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            width: 36px;
            height: 36px;
            font-size: 18px;
            border-radius: 10px;
            background: linear-gradient(135deg, rgba(57,135,229,0.22), rgba(144,133,233,0.16));
            border: 1px solid rgba(255,255,255,0.09);
            box-shadow: inset 0 1px 0 rgba(255,255,255,0.06);
            color: #8ab4f8;
            flex-shrink: 0;
        }

        #dashboardScreen header .brand-text {
            display: flex;
            flex-direction: column;
            gap: 1px;
            line-height: 1.15;
        }

        #dashboardScreen header h1 {
            font-size: 15.5px;
            font-weight: 700;
            letter-spacing: 0.2px;
            color: #f3f1ec;
        }
        #dashboardScreen header .brand-name-full {
            display: none;
        }
        #dashboardScreen header .brand-name-short {
            display: inline;
        }

        #dashboardScreen header .brand-sub {
            font-size: 10px;
            font-weight: 600;
            letter-spacing: 0.6px;
            text-transform: uppercase;
            color: #6f9bd8;
        }

        #dashboardScreen header .user-info {
            display: flex;
            gap: 12px;
            align-items: center;
        }

        /* NOVO 10/08/2026 (pedido do usuário: "mais destaque nos botões, pode reorganizar"):
           agrupa busca+chip+ações como 1 bloco à direita — header vira só 2 filhos (.brand e este
           grupo), garante alinhamento/gap consistentes em qualquer largura, sem depender de
           justify-content:space-between espalhar 4 filhos de forma instável. */
        #dashboardScreen header .header-actions-group {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        #dashboardScreen header .header-search-wrap {
            position: relative;
            flex: 0 1 320px;
            min-width: 120px;
            display: flex;
            align-items: center;
        }
        #dashboardScreen header .header-search-icon {
            position: absolute;
            left: 11px;
            top: 50%;
            transform: translateY(-50%);
            color: #6f9bd8;
            pointer-events: none;
        }
        #dashboardScreen header .header-search-input {
            width: 100%;
            background: rgba(57,135,229,0.07);
            border: 1px solid rgba(57,135,229,0.25);
            color: #eceae4;
            /* CORRIGIDO (mobile perf): abaixo de 16px o iOS Safari da zoom automatico ao focar -
               este campo abre em overlay no mobile (max-width:780px), entao o toque é comum. */
            font-size: 16px;
            padding: 7px 10px 7px 30px;
            border-radius: 999px;
            outline: none;
            font-family: inherit;
            transition: border-color .15s ease, background-color .15s ease;
        }
        #dashboardScreen header .header-search-input:focus {
            border-color: rgba(57,135,229,0.55);
            background: rgba(255,255,255,0.08);
        }
        #dashboardScreen header .header-search-resultados {
            position: absolute;
            top: calc(100% + 6px);
            left: 0;
            width: 100%;
            min-width: 280px;
            background: #1d2024;
            border: 1px solid rgba(255,255,255,0.12);
            border-radius: 10px;
            overflow: hidden;
            box-shadow: 0 8px 24px rgba(0,0,0,0.4);
            z-index: 50;
        }
        #dashboardScreen header .header-search-item {
            padding: 8px 12px;
            font-size: 12.5px;
            color: #c8c6bf;
            cursor: pointer;
            border-bottom: 1px solid rgba(255,255,255,0.06);
        }
        #dashboardScreen header .header-search-item:last-child { border-bottom: none; }
        #dashboardScreen header .header-search-item:hover { background: rgba(57,135,229,0.12); color: #eceae4; }
        #dashboardScreen header .header-search-item .hs-sub {
            display: block;
            font-size: 10.5px;
            color: #8b8a84;
            margin-top: 2px;
        }
        #dashboardScreen header .header-search-vazio {
            padding: 10px 12px;
            font-size: 12px;
            color: #8b8a84;
        }
        /* CORRIGIDO 10/08/2026 (pedido do usuário: "o de pesquisa precisa ser um pouco mais
           pronunciado que os outros") - tom de acento (mesmo azul da marca) já em repouso, não só
           no hover, pra se diferenciar visualmente de olho/sair (ghost buttons neutros). */
        #dashboardScreen header .header-search-toggle-btn {
            display: none;
            align-items: center;
            justify-content: center;
            width: 34px;
            height: 34px;
            border-radius: 999px;
            background: rgba(57,135,229,0.16);
            border: 1px solid rgba(57,135,229,0.45);
            color: #8ab4f8;
            cursor: pointer;
            flex-shrink: 0;
            transition: border-color 0.2s ease, background-color 0.2s ease, transform 0.15s ease, box-shadow 0.2s ease;
        }
        #dashboardScreen header .header-search-toggle-btn:hover {
            background: rgba(57,135,229,0.26);
            border-color: rgba(57,135,229,0.7);
            transform: translateY(-1px);
            box-shadow: 0 4px 14px rgba(57,135,229,0.22);
        }
        #dashboardScreen header .header-search-toggle-btn:active {
            transform: translateY(0) scale(0.94);
        }
        #dashboardScreen header .header-search-toggle-btn:focus-visible {
            outline: none;
            box-shadow: 0 0 0 3px rgba(57, 135, 229, 0.35);
        }
        /* .brand tem role="button" tabindex="0" (é navegável por Tab de verdade, não só clicável de
           mouse) mas só tinha feedback de :hover (opacidade) — sem nenhum indicador de foco por
           teclado, único elemento do cabeçalho realmente focável sem anel próprio. */
        #dashboardScreen header .brand:focus-visible {
            outline: none;
            box-shadow: 0 0 0 3px rgba(57, 135, 229, 0.35);
        }
        @media (max-width: 780px) {
            #dashboardScreen header .header-search-wrap { display: none; }
            #dashboardScreen header .header-search-toggle-btn { display: flex; }
            /* CORRIGIDO 10/08/2026 (2ª ocorrência do mesmo achado: "lupa parece um ponto, não dá pra
               ver" — desta vez em janela desktop estreita, faixa 560-780px, que só herdava a versão de
               baixo contraste porque a correção de contraste morava só no bloco max-width:560px. Botão
               vira círculo (visível) já em 780px — o contraste forte precisa valer na mesma faixa. */
            #dashboardScreen header .header-search-toggle-btn {
                background: rgba(57,135,229,0.32);
                border-color: rgba(57,135,229,0.75);
                color: #ffffff;
            }
            #dashboardScreen header .header-search-wrap.mobile-open {
                display: flex;
                position: absolute;
                top: 100%;
                left: 0;
                right: 0;
                margin: 0;
                padding: 8px 14px;
                background: #15171c;
                border-bottom: 1px solid rgba(255,255,255,0.1);
                box-shadow: 0 6px 14px rgba(0,0,0,0.35);
                z-index: 60;
                flex: none;
            }
            /* CORRIGIDO 10/08/2026 (pedido do usuário: "quando abre o campo pra pesquisa a lupa fica
               torta") - causa raiz: o wrap ganha padding:8px 14px só no overlay mobile, mas o ícone
               (position:absolute) usa o mesmo left:11px de sempre, relativo à borda do wrap — sem
               contar esse padding novo, o ícone ficava perto da própria borda/curva do pill em vez de
               centrado dentro do campo. Ajustado só pra este contexto (14px do padding + 11px original). */
            #dashboardScreen header .header-search-wrap.mobile-open .header-search-icon {
                left: 25px;
            }
        }

        #dashboardScreen header .user-chip {
            position: relative;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 0;
            border-radius: 50%;
            cursor: pointer;
        }
        /* NOVO 10/08/2026 (pedido do usuário: "quando passar o mouse ou clicar sobre a letra com a
           inicial, pode identificar que está logado com o email, bem sutil") - pill discreto que some
           sozinho, alternativa ao title="" (que não é confiável em toque no mobile). */
        #dashboardScreen header .user-email-tooltip {
            position: absolute;
            top: calc(100% + 8px);
            right: 0;
            background: #1d2024;
            border: 1px solid rgba(255,255,255,0.12);
            color: #c8c6bf;
            font-size: 11px;
            font-weight: 500;
            white-space: nowrap;
            padding: 5px 10px;
            border-radius: 7px;
            box-shadow: 0 4px 14px rgba(0,0,0,0.35);
            opacity: 0;
            pointer-events: none;
            transform: translateY(-3px);
            transition: opacity 0.15s ease, transform 0.15s ease;
            z-index: 70;
        }
        #dashboardScreen header .user-email-tooltip.visivel {
            opacity: 1;
            transform: translateY(0);
        }
        /* NOVO 10/08/2026 (pedido do usuário: avatar só com a inicial, "como sites modernos") -
           mesmo diâmetro (34px) dos outros botões circulares do cabeçalho (busca/olho/sair), pra
           ficar tudo alinhado na mesma "fileira de ícones" em vez do chip alongado com email inteiro. */
        #dashboardScreen header .user-avatar-initial {
            display: flex;
            align-items: center;
            justify-content: center;
            width: 34px;
            height: 34px;
            border-radius: 50%;
            background: linear-gradient(135deg, #3987e5, #9085e9);
            color: #fff;
            font-size: 13px;
            font-weight: 700;
            letter-spacing: 0;
            flex-shrink: 0;
        }

        #dashboardScreen header .header-divider {
            width: 1px;
            height: 28px;
            background: rgba(255,255,255,0.1);
        }

        #dashboardScreen header .header-actions {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        #dashboardScreen header .logout-btn {
            width: 34px;
            height: 34px;
            padding: 0;
            border-radius: 50%;
            background: rgba(255,255,255,0.03);
            border: 1px solid rgba(255,255,255,0.12);
            color: #a9a79f;
            font-size: 13px;
            line-height: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: border-color 0.2s ease, background-color 0.2s ease, transform 0.15s ease, color 0.2s ease, box-shadow 0.2s ease;
        }

        #dashboardScreen header .logout-btn:hover {
            background: rgba(226, 85, 79, 0.12);
            border-color: rgba(226, 85, 79, 0.55);
            color: #ff8783;

    <script>
        // NOVO 01/08/2026 (V252, pedido do usuario): botao de esconder valores movido pra barra
        // superior fixa (fora do iframe) - fica acessivel ANTES de rolar/ver qualquer valor, em vez
        // de estar dentro do painel (so aparecia depois de carregar o conteudo sensivel).
        // AJUSTADO 04/08/2026 (parte 76, pedido do usuario: "quando o olho de nublar for ativado, so
        // consegue desativar via senha"): ATIVAR o blur continua instantaneo (sem atrito - precisa ser
        // rapido pra esconder valores na hora que alguem chega perto). DESATIVAR agora exige reautenticar
        // com a senha real da conta (mesmo endpoint Firebase do login, signInWithPassword) - nao um PIN
        // novo/paralelo, que seria mais uma senha pra lembrar e mais facil de descobrir por tentativa.
        // Usa window.authObj.email (ja setado no login) + reusa firebaseAuth() ja existente.
        // NOVO 14/08/2026 (pedido do usuário: "botão de link pra baixar relatório em PDF com um
        // resumo e fechamento de tudo" — escopo definido com o usuário: Resumo Executivo +
        // Obrigações Operacionais (Total Operacional/Cartões/MP) + Todas as Caixas + Balanço
        // Patrimonial/Patrimônio Financeiro + Reembolsos Wärtsilä). jsPDF carregado sob demanda, só
        // no 1º clique — mesmo padrão de carregarHtml2CanvasSobDemanda() (ui-componentes-visuais.js,
        // dentro do iframe), nunca baixa no boot pra quem nunca usa. Os dados vêm de
        // coletarDadosRelatorioFechamento() (src/relatorio/coletar-dados-relatorio.js, dentro do
        // iframe) — lê o texto já renderizado dos cards, nunca recalcula nada (fonte única, mesmo
        // valor que a tela mostra, não pode dessincronizar).
        var _promiseJsPDF = null;
        function _carregarJsPdfSobDemanda() {
            if (window.jspdf && window.jspdf.jsPDF) return Promise.resolve();
            if (_promiseJsPDF) return _promiseJsPDF;
            _promiseJsPDF = new Promise(function (resolve, reject) {
                const script = document.createElement('script');
                script.src = 'https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js';
                script.onload = function () { resolve(); };
                script.onerror = function () { _promiseJsPDF = null; reject(new Error('falha ao carregar jsPDF')); };
                document.head.appendChild(script);
            });
            return _promiseJsPDF;
        }

        // REESCRITO 14/08/2026, 2ª vez no mesmo dia (achado do usuário: "eu quero idêntico ao primeiro
        // que você fez, esses estão horríveis" — as duas tentativas anteriores desenhavam o PDF com
        // primitivas do jsPDF (rect/text), e por mais que a paleta batesse, tipografia/espaçamento/
        // proporção NUNCA ficam idênticos a um HTML/CSS de verdade só copiando cor por cor). Mudança de
        // abordagem: monta o relatório como HTML real (mesmas classes/paleta do artefato "Tactical
        // Wealth Report" aprovado), injeta fora da tela, rasteriza com html2canvas (mesma lib já usada
        // pelo botão de "baixar seção como JPEG" dentro do iframe) e fatia o resultado em páginas do
        // jsPDF. Isso garante fidelidade visual real — é literalmente o mesmo CSS, não uma imitação.
        var _promiseHtml2CanvasHeader = null;
        function _carregarHtml2CanvasHeaderSobDemanda() {
            if (typeof html2canvas !== 'undefined') return Promise.resolve();
            if (_promiseHtml2CanvasHeader) return _promiseHtml2CanvasHeader;
            _promiseHtml2CanvasHeader = new Promise(function (resolve, reject) {
                const script = document.createElement('script');
                script.src = 'https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js';
                script.onload = function () { resolve(); };
                script.onerror = function () { _promiseHtml2CanvasHeader = null; reject(new Error('falha ao carregar html2canvas')); };
                document.head.appendChild(script);
            });
            return _promiseHtml2CanvasHeader;
        }

        function _wwiRelEsc(s) {
            if (s == null) return '';
            return String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
        }

        // Procura uma linha específica (por label) dentro de uma seção coletada — não recalcula nada,
        // só reaproveita o mesmo par label/valor que coletarDadosRelatorioFechamento() já leu do DOM.
        function pdfPegarKpi(secoes, tituloSecao, labelLinha) {
            const secao = secoes.find(function (s) { return s.titulo === tituloSecao; });
            if (!secao) return null;
            const linha = secao.linhas.find(function (l) { return l.label === labelLinha; });
            return linha ? linha.valor : null;
        }

        // CSS VERBATIM copiado do artefato aprovado (mesmo arquivo fonte usado pra publicar o
        // "Tactical Wealth Report" original) — só o bloco de tema claro (:root), sem @media dark nem

        // independente do tema do sistema operacional de quem gerar. Nenhuma classe renomeada, nenhuma
        // cor "aproximada" — é a mesma folha de estilo, caractere por caractere onde possível.
        const WWI_CSS_ARTEFATO = '' +
            ':root{--bg:#F1F1EB;--surface:#FFFFFF;--surface-2:#F7F6F0;--ink:#161A22;--ink-soft:#525968;--ink-faint:#8B8F98;--line:#DEDCD1;--accent:#8C6D2F;--accent-strong:#6B4F1E;--accent-soft:#EFE6D0;--good:#2E7D5B;--good-soft:#E3F0EA;--warn:#B4791F;--warn-soft:#F6EBD8;--bad:#B14338;--bad-soft:#F8E7E4;--font-display:"Iowan Old Style","Sitka Text","Palatino Linotype",Palatino,Georgia,serif;--font-body:Seravek,"Segoe UI",-apple-system,"Avenir Next",Avenir,sans-serif;}' +
            '.wwi-scope{max-width:1040px;margin:0 auto;background:var(--bg);color:var(--ink);font-family:var(--font-body);font-size:16px;line-height:1.6;}' +
            '.wwi-scope *{box-sizing:border-box;}' +
            '.wwi-scope h1,.wwi-scope h2,.wwi-scope h3{font-family:var(--font-display);font-weight:600;margin:0;}' +
            '.wwi-scope .cover{background:radial-gradient(ellipse at 15% -10%, rgba(203,169,104,.10), transparent 55%),linear-gradient(180deg,#0C1017 0%, #10141D 60%, #12161F 100%);color:#ECEAE0;padding:3.2rem 2.6rem 3.4rem;position:relative;overflow:hidden;}' +
            '.wwi-scope .cover::after{content:"";position:absolute;inset:14px;border:1px solid rgba(203,169,104,.28);pointer-events:none;}' +
            '.wwi-scope .cover-top{display:flex;justify-content:space-between;align-items:flex-start;gap:1rem;margin-bottom:3.5rem;}' +
            '.wwi-scope .cover-mark{font-family:var(--font-display);font-size:.95rem;letter-spacing:.14em;text-transform:uppercase;color:#CBA968;}' +
            '.wwi-scope .cover-mark span{display:block;font-family:var(--font-body);font-size:.68rem;letter-spacing:.18em;color:#8A93A8;margin-top:.3rem;}' +
            '.wwi-scope .classification{border:1px solid #CBA968;color:#E4C989;font-size:.68rem;letter-spacing:.18em;text-transform:uppercase;padding:.42rem .85rem;white-space:nowrap;font-family:var(--font-body);}' +
            '.wwi-scope .cover-title{font-size:2.6rem;line-height:1.04;margin-bottom:.9rem;max-width:16ch;}' +
            '.wwi-scope .cover-title em{font-style:italic;color:#CBA968;}' +
            '.wwi-scope .cover-sub{font-size:1.05rem;color:#B9BFCE;max-width:38ch;font-family:var(--font-body);font-weight:300;margin-bottom:2.6rem;}' +
            '.wwi-scope .cover-rule{height:1px;background:linear-gradient(90deg,#CBA968,transparent 75%);margin-bottom:1.6rem;}' +

        // Monta 1 bloco de lista (Pontos Fortes/Fracos/Riscos/Oportunidades) reaproveitando a EXATA
        // classe `.rank` do artefato — cada item usa a borda lateral colorida (risk-baixo=verde,
        // risk-alto=vermelho) que o CSS acima já define, mesmo padrão visual do "Ranking de risco"
        // da seção 4 do artefato original. Bloco vazio = omitido (nunca mostra card "sem dados").
        function _wwiRelLista(itens, corTipo) {
            if (!itens || !itens.length) return '';
            const cls = corTipo === 'bom' ? 'risk-baixo' : corTipo === 'ruim' ? 'risk-alto' : 'risk-medio';
            return '<ul class="rank">' +
                itens.map(function (t) { return '<li class="' + cls + '"><span class="rk-desc">' + _wwiRelEsc(t) + '</span></li>'; }).join('') +
                '</ul>';
        }

        // Monta 1 seção genérica do coletor (dados.secoes) como tabela — EXATA classe `.tbl-wrap table`
        // do artefato (mesma usada nas seções "Análise de Patrimônio"/"Oportunidades de Aceleração").
        function _wwiRelTabelaSecao(secao) {
            if (!secao.linhas.length) {
                return '<p class="foot-note">' + _wwiRelEsc(secao.erro || 'Sem dados.') + '</p>';
            }
            return '<div class="tbl-wrap"><table><tbody>' +
                secao.linhas.map(function (l) {
                    return '<tr><td>' + _wwiRelEsc(l.label) + '</td><td class="num">' + _wwiRelEsc(l.valor) + '</td></tr>';
                }).join('') +
                '</tbody></table></div>';
        }

        function _wwiRelTituloSemEmoji(titulo) {
            return titulo.replace(/[\u{1F000}-\u{1FFFF}\u{2190}-\u{21FF}\u{2300}-\u{27BF}\u{2B00}-\u{2BFF}️‍]/gu, '').trim();
        }

        // Monta o HTML completo do relatório reaproveitando o CSS VERBATIM (WWI_CSS_ARTEFATO) e as
        // classes exatas do artefato "Tactical Wealth Report" aprovado — capa, TOC, eyebrow+sec-title,
        // kpi-grid, gauge, rank, tbl-wrap, final-verdict. Numeração de seções dinâmica (a quantidade
        // real de seções varia com o que o coletor encontrou naquele ciclo).
        function construirHtmlRelatorioWWI(dados, narrativa, indicadores, comparativo) {
            const score = indicadores && indicadores.wealthScore != null ? indicadores.wealthScore : null;
            const nivel = score === null ? null : score >= 90 ? 'ELITE' : score >= 75 ? 'AVANÇADO' : score >= 55 ? 'ESTÁVEL' : 'ATENÇÃO';
            const circunferencia = 263.9;
            const offset = score === null ? circunferencia : circunferencia - (circunferencia * Math.min(100, Math.max(0, score)) / 100);

            const kpis = [
                { lbl: 'Patrimônio Líquido', val: pdfPegarKpi(dados.secoes, 'Resumo executivo', 'Patrimônio Líquido'), chip: null },
                { lbl: 'Total Obrigações', val: pdfPegarKpi(dados.secoes, '🔄 Obrigações Operacionais', 'Total obrigações'), chip: null },
                { lbl: 'Modo Operacional', val: pdfPegarKpi(dados.secoes, 'Resumo executivo', 'Modo operacional'), chip: null },
                { lbl: 'Meta do Milhão', val: pdfPegarKpi(dados.secoes, 'Resumo executivo', 'Meta do Milhão'), chip: null },
            ].filter(function (k) { return k.val; });

            const subscoresHtml = (indicadores && indicadores.subscores) ? Object.keys(indicadores.subscores)
                .filter(function (k) { return indicadores.subscores[k] !== null; })
                .map(function (k) {
                    const v = Math.round(indicadores.subscores[k]);
                    return '<div class="score-row"><span class="sr-label">' + _wwiRelEsc(k) + '</span>' +
                        '<div class="sr-track"><div class="sr-fill" style="width:' + v + '%"></div></div>' +
                        '<span class="sr-val">' + v + '</span></div>';
                }).join('') : '';

            // Numera as seções dinamicamente (mesmo padrão "01/02/03..." do eyebrow do artefato).
            let numSecao = 0;
            function proximoNum() { numSecao++; return numSecao < 10 ? '0' + numSecao : '' + numSecao; }
            function secaoEyebrowTitulo(titulo, h2) {
                return '<div class="eyebrow"><span class="num">' + proximoNum() + '</span> ' + _wwiRelEsc(titulo) + '</div>' +
                    (h2 ? '<h2 class="sec-title">' + _wwiRelEsc(h2) + '</h2>' : '');
            }

            const blocos = [];

            // 1. Resumo do CFO
            if (narrativa && narrativa.parecerFinalTexto) {
                blocos.push('<section>' + secaoEyebrowTitulo('Resumo do CFO', 'Leitura executiva do ciclo') +
                    '<div class="prose"><p>' + _wwiRelEsc(narrativa.parecerFinalTexto) + '</p></div></section>');
            }

            // 2. Painel Executivo
            if (kpis.length || score !== null) {
                blocos.push('<section>' + secaoEyebrowTitulo('Painel Executivo', 'Números que resumem o ciclo') +
                    (kpis.length ? '<div class="kpi-grid">' + kpis.map(function (k) {
                        return '<div class="kpi"><div class="kpi-label">' + _wwiRelEsc(k.lbl) + '</div><div class="kpi-val">' + _wwiRelEsc(k.val) + '</div></div>';
                    }).join('') + '</div>' : '') +
                    '</section>');
            }

            // 3. Pontos Fortes
            if (narrativa && narrativa.pontosFortesTexto && narrativa.pontosFortesTexto.length) {
                blocos.push('<section>' + secaoEyebrowTitulo('Pontos Fortes', 'O que está funcionando bem') +
                    _wwiRelLista(narrativa.pontosFortesTexto, 'bom') + '</section>');
            }

            // 4. Pontos Fracos
            if (narrativa && narrativa.pontosFracosTexto && narrativa.pontosFracosTexto.length) {
                blocos.push('<section>' + secaoEyebrowTitulo('Pontos Fracos', 'O que merece atenção') +
                    _wwiRelLista(narrativa.pontosFracosTexto, 'ruim') + '</section>');
            }

            // 5. Evolução Patrimonial
            const temHistorico = comparativo && comparativo.temHistorico && comparativo.frases.length;
            blocos.push('<section>' + secaoEyebrowTitulo('Evolução Patrimonial', 'Comparação com ciclos anteriores') +
                (temHistorico ? _wwiRelLista(comparativo.frases, 'neutro') :
                    '<p class="lede">Este é o primeiro relatório WWI desta série — comparativos históricos aparecerão a partir do próximo ciclo.</p>') +
                '</section>');

            // 6+. Dados do sistema, 1 seção por bloco coletado
            dados.secoes.forEach(function (secao) {
                blocos.push('<section>' + secaoEyebrowTitulo(_wwiRelTituloSemEmoji(secao.titulo), null) +
                    _wwiRelTabelaSecao(secao) + '</section>');
            });

            // Oportunidades de Crescimento
            const oportunidades = narrativa ? (narrativa.oportunidadesTexto || []).concat(narrativa.recomendacoesTexto || []) : [];
            if (oportunidades.length) {
                blocos.push('<section>' + secaoEyebrowTitulo('Oportunidades de Crescimento', 'Onde o capital pode trabalhar mais') +
                    _wwiRelLista(oportunidades, 'bom') + '</section>');
            }

            // Matriz de Riscos
            if (narrativa && narrativa.riscosTexto && narrativa.riscosTexto.length) {
                blocos.push('<section>' + secaoEyebrowTitulo('Matriz de Riscos', 'Pontos de atenção monitorados') +
                    _wwiRelLista(narrativa.riscosTexto, 'ruim') + '</section>');
            }

            // Wealth Score (gauge — mesma classe do artefato)
            if (score !== null) {
                blocos.push('<section>' + secaoEyebrowTitulo('Wealth Score', 'Nota consolidada do ciclo') +
                    '<div class="score-wrap"><div class="gauge"><svg viewBox="0 0 100 100">' +
                    '<circle cx="50" cy="50" r="42" fill="none" stroke="var(--surface-2)" stroke-width="10"/>' +
                    '<circle cx="50" cy="50" r="42" fill="none" stroke="var(--accent)" stroke-width="10" stroke-linecap="round" stroke-dasharray="' + circunferencia + '" stroke-dashoffset="' + offset + '"/>' +
                    '</svg><div class="gauge-num"><b>' + score + '</b><span>de 100 &middot; ' + nivel + '</span></div></div>' +
                    '<div class="score-list">' + subscoresHtml + '</div></div></section>');
            }

            // Parecer Final (mesma classe .final-verdict do artefato)
            if (narrativa && narrativa.parecerFinalTexto) {
                blocos.push('<section>' + secaoEyebrowTitulo('Parecer Final', 'Leitura de encerramento') +
                    '<div class="final-verdict"><div class="fv-q">Parecer</div><p>' + _wwiRelEsc(narrativa.parecerFinalTexto) + '</p></div>' +
                    (score !== null ? '<div class="cover-grade" style="margin-top:2rem;border-color:var(--accent);"><b style="color:var(--ink)">' + score + '/100 &mdash; ' + nivel + '</b></div>' : '') +
                    '</section>');
            }

            return '<style>' + WWI_CSS_ARTEFATO + '</style>' +
                '<div class="wwi-scope">' +
                '<header class="cover">' +
                '<div class="cover-top">' +
                '<div class="cover-mark">Sistema Wallace Lira<span>Wallace Wealth Intelligence</span></div>' +
                '<div class="classification">Uso Restrito &middot; Pessoal</div>' +
                '</div>' +
                '<h1 class="cover-title">Tactical Wealth <em>Report</em></h1>' +
                '<p class="cover-sub">Gestão Patrimonial, Liquidez e Construção de Capital &mdash; leitura executiva do sistema financeiro pessoal.</p>' +
                '<div class="cover-rule"></div>' +
                '<div class="cover-foot">' +
                '<div><strong>Wallace Lira</strong>Executivo Industrial</div>' +
                '<div><strong>Ciclo de referência</strong>' + _wwiRelEsc(dados.cicloAtual) + '</div>' +
                '<div><strong>Gerado em</strong>' + _wwiRelEsc(dados.geradoEm) + '</div>' +
                '</div>' +
                (score !== null ? '<div class="cover-grade"><b>' + nivel + '</b><span>Wealth Score ' + score + '/100 &mdash; ver detalhamento completo por eixo neste relatório.</span></div>' : '') +
                '</header>' +
                blocos.join('') +
                '<footer class="report-foot">Tactical Wealth Report &middot; Sistema Wallace Lira &middot; gerado automaticamente pelo módulo WWI &middot; documento de uso pessoal.</footer>' +
                '</div>';
        }

        // Rasteriza o HTML montado acima e fatia em páginas A4 do jsPDF — técnica padrão
        // html2canvas+jsPDF (1 canvas alto, recortado por página via offset Y negativo). Só assim o
        // resultado é de fato o MESMO CSS do artefato aprovado, não uma reconstrução aproximada.
        function gerarPdfRelatorioFechamento(dados, narrativa, indicadores, comparativo) {
            const container = document.createElement('div');
            container.style.cssText = 'position:absolute;left:-9999px;top:0;background:#F1F1EB;';
            container.innerHTML = construirHtmlRelatorioWWI(dados, narrativa, indicadores, comparativo);
            document.body.appendChild(container);

            return html2canvas(container, { scale: 2, backgroundColor: '#F1F1EB', useCORS: true }).then(function (canvas) {
                document.body.removeChild(container);
                const jsPDF = window.jspdf.jsPDF;
                const doc = new jsPDF({ unit: 'pt', format: 'a4' });
                const pageWidth = doc.internal.pageSize.getWidth();
                const pageHeight = doc.internal.pageSize.getHeight();
                const imgWidth = pageWidth;
                const imgHeight = canvas.height * imgWidth / canvas.width;
                const imgData = canvas.toDataURL('image/jpeg', 0.94);
                let heightLeft = imgHeight;
                let position = 0;
                doc.addImage(imgData, 'JPEG', 0, position, imgWidth, imgHeight);
                heightLeft -= pageHeight;
                while (heightLeft > 0) {
                    position = heightLeft - imgHeight;
                    doc.addPage();
                    doc.addImage(imgData, 'JPEG', 0, position, imgWidth, imgHeight);
                    heightLeft -= pageHeight;
                }
                const nomeArquivo = 'tactical-wealth-report-wallace-lira-' + new Date().toISOString().slice(0, 10) + '.pdf';
                doc.save(nomeArquivo);
            }).catch(function (err) {
                if (container.parentNode) document.body.removeChild(container);
                throw err;
            });
        }

        // REESCRITO 14/08/2026 (WWI — Wallace Wealth Intelligence). Fluxo (ver
        // docs/decisions/WWI_RELATORIO_EXECUTIVO_INTELIGENCIA.md):
        //   1. coletarDadosRelatorioFechamento() — reaproveitado, sem mudança de assinatura.
        //   2. calcularIndicadoresEScores(dados) — Wealth Score + 4 índices, dentro do iframe.
        //   3. wwiBuscarHistoricoRelatorios(competencia) — lê historico_relatorios (leitura pública,
        //      chave anon — a ESCRITA continua exclusiva do job mensal com service_role, nunca daqui).
        //   4. SE já existe relatório desta competência: reaproveita a narrativa salva (analise_ia) —
        //      requisito do usuário "narrativa igual durante o mês". SENÃO: gera na hora só pra EXIBIR
        //      no PDF (gerarAnaliseFinanceira) — não persiste; quem persiste de verdade é o job mensal.
        //   5. compararComHistorico() — frases de evolução vs. ciclo(s) anterior(es), degrada sem
        //      histórico (1º relatório da série).
        //   6. construirHtmlRelatorioWWI() + html2canvas + jsPDF — ver comentário acima.
        function gerarRelatorioFechamentoPDF() {
            const btn = document.getElementById('btnRelatorioPdfHeader');
            const iframe = document.getElementById('mainIframe');
            if (!iframe || !iframe.contentWindow || typeof iframe.contentWindow.coletarDadosRelatorioFechamento !== 'function') {
                alert('O painel ainda não terminou de carregar — espera alguns segundos e tenta de novo.');
                return;
            }
            if (btn) btn.disabled = true;
            Promise.all([_carregarJsPdfSobDemanda(), _carregarHtml2CanvasHeaderSobDemanda()]).then(function () {
                const win = iframe.contentWindow;
                const dados = win.coletarDadosRelatorioFechamento();
                const indicadores = (typeof win.calcularIndicadoresEScores === 'function') ? win.calcularIndicadoresEScores(dados) : null;
                const promessaHistorico = (typeof win.wwiBuscarHistoricoRelatorios === 'function' && dados.competencia)
                    ? win.wwiBuscarHistoricoRelatorios(dados.competencia)
                    : Promise.resolve({ atual: null, anteriores: [] });
                return promessaHistorico.then(function (historico) {
                    let narrativa = null;
                    if (historico.atual && historico.atual.analise_ia) {
                        narrativa = historico.atual.analise_ia; // reutiliza — mesma narrativa da criação da competência
                    } else if (typeof win.gerarAnaliseFinanceira === 'function') {
                        narrativa = win.gerarAnaliseFinanceira(dados); // gerada na hora só pra exibir, não persiste
                    }
                    const comparativo = (typeof win.compararComHistorico === 'function')
                        ? win.compararComHistorico(indicadores, historico.anteriores)
                        : { frases: [], temHistorico: false };
                    return gerarPdfRelatorioFechamento(dados, narrativa, indicadores, comparativo);
                });
            }).catch(function (err) {
                console.error('gerarRelatorioFechamentoPDF: falha ao gerar PDF.', err);
                alert('Não consegui gerar o relatório — confere sua conexão e tenta de novo.');
            }).finally(function () {
                if (btn) btn.disabled = false;
            });
        }

        function toggleEsconderValoresHeader() {
            const iframe = document.getElementById('mainIframe');
            const btn = document.getElementById('btnEsconderValoresHeader');
            if (!iframe || !iframe.contentWindow) return;
            const estaAtivoAgora = btn && btn.classList.contains('ativo');
            if (estaAtivoAgora) {
                abrirModalSenhaEsconderValores();
                return;
            }
            try {
                const ativo = iframe.contentWindow.toggleEsconderValores();
                if (btn) btn.classList.toggle('ativo', !!ativo);
            } catch (e) {
                console.error('Nao foi possivel alternar valores no painel:', e);
            }
        }

        function abrirModalSenhaEsconderValores() {
            const modal = document.getElementById('modalSenhaEsconderValores');
            const input = document.getElementById('senhaEsconderValoresInput');
            const erro = document.getElementById('senhaEsconderValoresErro');
            if (!modal) return;
            erro.style.display = 'none';
            input.value = '';
            modal.style.display = 'flex';
            setTimeout(() => input.focus(), 50);
        }

        // AJUSTADO 04/08/2026 (parte 77, pedido do usuario: "crie o pin 1322 para desbloquear o
        // nublado" - troca a reautenticacao por senha completa da parte 76 por um PIN numerico
        // dedicado, mais rapido de digitar quando alguem esta querendo ver o painel rapido).

        // NOVO 01/08/2026: sincroniza o icone do botao com a preferencia ja salva - localStorage e

        function onDomPronto2(fn){

        // NOVO 09/08/2026 (pedido do usuario: busca na barra fixa de fora do iframe, sempre visivel).
        // Mesmo padrao ja usado em toggleEsconderValoresHeader() acima - chama funcoes expostas dentro

        // dashboard-navegacao.js) reaproveitam 100% do indice/match/ordenacao da busca original - aqui
        // so desenha o dropdown (que precisa viver FORA do iframe, porque position:fixed/absolute
        // dentro do iframe nunca pinta por cima da barra externa) e repassa cliques de volta.
        let _headerSearchDebounce = null;
        let _headerSearchUltimo = null; // guarda o ultimo {secoes,transacoes} pra saber o que o clique de cada item significa
        function headerSearchInput(valor){
            clearTimeout(_headerSearchDebounce);
            _headerSearchDebounce = setTimeout(() => headerSearchExecutar(valor), 200);
        }
        // NOVO 09/08/2026 (achado do usuario: "nao pesquisa mais nada", ficava preso em "Painel ainda
        // carregando..." mesmo com o painel ja de pe): dashboard-navegacao.js e um dos ULTIMOS arquivos
        // numa cadeia longa de scripts em sequencia dentro do iframe (app.js -> energia-solar.js ->
        // promocoes-financeengine.js -> so ENTAO os 6 modulos finais, dashboard-navegacao.js entre
        // eles) - pode terminar de carregar segundos DEPOIS dos badges "SISTEMA INTEGRO"/"V2 ATIVA"
        // aparecerem (esses vem de uma parte bem mais cedo do boot). Antes, um unico "nao esta pronto"
        // desistia na hora. Agora tenta de novo sozinho (ate 6s, a cada 400ms) e reexecuta a busca com
        // o que estiver no campo assim que a funcao aparecer - autocura, sem exigir que o usuario
        // retype.
        let _headerSearchAguardando = false;
        function _headerSearchIframeProntO(){
            const iframe = document.getElementById('mainIframe');
            return iframe && iframe.contentWindow && typeof iframe.contentWindow.buscaGlobalDados === 'function' ? iframe : null;
        }
        function _headerSearchEsperarEReexecutar(tentativasRestantes){
            const iframe = _headerSearchIframeProntO();
            if(iframe){
                _headerSearchAguardando = false;
                const input = document.getElementById('headerSearchInput');
                if(input && input.value.trim()) headerSearchExecutar(input.value);
                return;
            }
            if(tentativasRestantes <= 0){
                _headerSearchAguardando = false;
                const wrap = document.getElementById('headerSearchResultados');
                if(wrap) wrap.innerHTML = '<div class="header-search-vazio">Painel demorou demais pra carregar — tenta recarregar a página.</div>';
                console.error('headerSearch: buscaGlobalDados nunca ficou disponível no iframe depois de 6s de espera.');
                return;
            }
            setTimeout(() => _headerSearchEsperarEReexecutar(tentativasRestantes - 1), 400);
        }
        function headerSearchExecutar(valor){
            const termo = (valor || '').trim();
            const wrap = document.getElementById('headerSearchResultados');
            if(!wrap) return;
            if(!termo){ wrap.style.display = 'none'; wrap.innerHTML = ''; return; }
            const iframe = _headerSearchIframeProntO();
            if(!iframe){
                wrap.innerHTML = '<div class="header-search-vazio">Painel ainda carregando…</div>';
                wrap.style.display = 'block';
                if(!_headerSearchAguardando){
                    _headerSearchAguardando = true;
                    _headerSearchEsperarEReexecutar(15); // 15 x 400ms = ate 6s de espera
                }
                return;
            }
            let resultado;
            try { resultado = iframe.contentWindow.buscaGlobalDados(termo); }
            catch(e){ console.error('headerSearchExecutar: falha ao consultar busca do painel', e); return; }
            _headerSearchUltimo = resultado;
            const { secoes = [], transacoes = [] } = resultado || {};
            if(secoes.length === 0 && transacoes.length === 0){
                wrap.innerHTML = '<div class="header-search-vazio">Nada encontrado</div>';
                wrap.style.display = 'block';
                return;
            }
            wrap.innerHTML = secoes.map(s =>
                `<div class="header-search-item" onclick="headerSearchNavegar('secao',${s.idx})">${s.rotulo}</div>`
            ).join('') + transacoes.map(t =>
                `<div class="header-search-item" onclick="headerSearchNavegar('transacao',${t.idx})">`
                + `<strong>${t.tx}</strong> · ${t.nome} · <strong>${t.valor}</strong>`
                + `<span class="hs-sub">${t.data || ''} — ${t.livro}${t.obs ? ' — ' + t.obs : ''}</span></div>`
            ).join('');
            wrap.style.display = 'block';
        }
        function headerSearchNavegar(tipo, idx){
            const iframe = document.getElementById('mainIframe');
            if(iframe && iframe.contentWindow && typeof iframe.contentWindow.buscaGlobalNavegar === 'function'){
                try { iframe.contentWindow.buscaGlobalNavegar(tipo, idx); } catch(e){ console.error('headerSearchNavegar: falha ao navegar no painel', e); }
            }
            const wrap = document.getElementById('headerSearchResultados');
            const input = document.getElementById('headerSearchInput');
            if(wrap) wrap.style.display = 'none';
            if(input) input.value = '';
        }
        // CORRIGIDO 09/08/2026 (achado do usuário: "no mobile falta a lupa de pesquisa") - toggle
        // do botão só-ícone que aparece <780px; abre o mesmo #headerSearchWrap como overlay.
        function toggleHeaderSearchMobile(){
            const wrap = document.getElementById('headerSearchWrap');
            if(!wrap) return;
            const abrindo = !wrap.classList.contains('mobile-open');
            wrap.classList.toggle('mobile-open', abrindo);
            if(abrindo){
                const input = document.getElementById('headerSearchInput');
                if(input) setTimeout(() => input.focus(), 0);
            }
        }
        onDomPronto2(function(){
            const input = document.getElementById('headerSearchInput');
            if(input) input.addEventListener('input', (e) => headerSearchInput(e.target.value));
            document.addEventListener('click', (e) => {
                if(!e.target.closest('#headerSearchWrap') && !e.target.closest('#headerSearchToggleBtn')){
                    const wrap = document.getElementById('headerSearchResultados');
                    if(wrap) wrap.style.display = 'none';
                    const searchWrap = document.getElementById('headerSearchWrap');
                    if(searchWrap) searchWrap.classList.remove('mobile-open');
                }
            });
        });

    <!-- CARREGAMENTO DIRETO DO FIREBASE SCRIPT GLOBAL -->
    <script>
        // Sem módulos ES6, usando callbacks diretos
        window.firebaseConfig = {
            apiKey: "AIzaSyCvXsD2v_AGx3vN3kM2z_uIllkRO-Lr2pc",
            authDomain: "sistema-wallace-lira.firebaseapp.com",
            projectId: "sistema-wallace-lira",
            storageBucket: "sistema-wallace-lira.firebasestorage.app",
            messagingSenderId: "648799873363",
            appId: "1:648799873363:web:28e6796ee70afc3a4b99a6"
        };

        window.authObj = null;

        // Função auxiliar para fazer fetch
        function firebaseAuth(email, password) {
            const url = "https://identitytoolkit.googleapis.com/v1/accounts:signInWithPassword?key=" + window.firebaseConfig.apiKey;
            
            return fetch(url, {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({
                    email: email,
                    password: password,
                    returnSecureToken: true
                })
            })
            .then(response => response.json())
            .then(data => {
                if (data.error) {
                    throw new Error(data.error.message);
                }
                return data;
            });
        }

        // NOVO 14/08/2026 (achado do usuário: botão "Compartilhar" do Solar falhando com "Não
        // consegui criar o link" em sessão de várias horas) - o idToken do Firebase expira em ~1h e
        // login() nunca implementou renovação (é REST puro, não o SDK oficial, que faria isso sozinho).
        // O RPC do Supabase (criar_compartilhamento_solar) valida o JWT e rejeita silenciosamente um
        // token vencido como "não autenticado", mesmo com sessionStorage.auth ainda presente - dava a
        // entender que era só um erro de rede. A resposta de signInWithPassword TAMBÉM traz um
        // refreshToken (sempre foi salvo, só nunca foi usado) - de vida muito mais longa, serve pra
        // pedir um idToken novo sem precisar da senha de novo. Endpoint oficial do Google Identity
        // Platform pra isso: securetoken.googleapis.com/v1/token (formato de resposta é snake_case,
        // diferente do signInWithPassword - normaliza pros mesmos campos camelCase que o resto do
        // código já espera em sessionStorage.auth, pra obterTokenAuthSupabase() em app.js nem perceber
        // a diferença).
        function renovarTokenFirebase() {
            let auth;
            try { auth = JSON.parse(sessionStorage.getItem('auth') || 'null'); } catch (e) { auth = null; }
            if (!auth || !auth.refreshToken) return Promise.resolve(false);

            const url = "https://securetoken.googleapis.com/v1/token?key=" + window.firebaseConfig.apiKey;
            return fetch(url, {
                method: "POST",
                headers: { "Content-Type": "application/x-www-form-urlencoded" },
                body: "grant_type=refresh_token&refresh_token=" + encodeURIComponent(auth.refreshToken)
            })
            .then(response => response.json())
            .then(data => {
                if (data.error) throw new Error(data.error.message);
                auth.idToken = data.id_token;
                auth.refreshToken = data.refresh_token;
                auth.expiresIn = data.expires_in;
                sessionStorage.setItem('auth', JSON.stringify(auth));
                window.authObj = auth;
                console.log('🔄 Token Firebase renovado.');
                return true;
            })
            .catch(error => {
                // refreshToken também vencido/revogado (ex: senha trocada, sessão revogada no
                // console) - não dá pra renovar, só relogar mesmo. Não força logout aqui pra não
                // interromper o usuário no meio do que está fazendo; próxima chamada autenticada que
                // falhar mostra o erro real e ele reloga quando quiser.
                console.warn('Não foi possível renovar o token Firebase:', error.message);
                return false;
            });
        }
        window.renovarTokenFirebase = renovarTokenFirebase;

        // Renova de forma proativa a cada 45min (token expira em ~60min) enquanto o painel estiver
        // aberto, e também logo ao entrar/retomar sessão (cobre o caso de reload de página com um
        // idToken já vencido guardado no sessionStorage de uma aba esquecida aberta por horas).
        const INTERVALO_RENOVACAO_TOKEN_MS = 45 * 60 * 1000;
        let __renovacaoTokenTimer = null;
        function iniciarRenovacaoTokenPeriodica() {
            renovarTokenFirebase();
            if (__renovacaoTokenTimer) clearInterval(__renovacaoTokenTimer);
            __renovacaoTokenTimer = setInterval(renovarTokenFirebase, INTERVALO_RENOVACAO_TOKEN_MS);
        }
        function pararRenovacaoTokenPeriodica() {
            if (__renovacaoTokenTimer) clearInterval(__renovacaoTokenTimer);
            __renovacaoTokenTimer = null;
        }

        // LOGIN
        function login() {
            const email = document.getElementById('email').value.trim();
            const password = document.getElementById('password').value;
            const btn = document.getElementById('loginBtn');
            const errorDiv = document.getElementById('errorMessage');

            errorDiv.style.display = 'none';

            if (!email || !password) {
                showError('Preencha email e senha');
                return;
            }

            btn.disabled = true;
            btn.textContent = 'Entrando...';

            firebaseAuth(email, password)
                .then(response => {
                    console.log('✅ Login bem-sucedido');
                    window.authObj = response;
                    sessionStorage.setItem('auth', JSON.stringify(response));
                    showDashboard(email);
                })
                .catch(error => {
                    btn.disabled = false;
                    btn.textContent = 'Entrar';
                    
                    let msg = error.message || 'Erro ao fazer login';
                    if (msg.includes('INVALID_LOGIN_CREDENTIALS')) msg = 'Email ou senha incorretos';
                    if (msg.includes('USER_DISABLED')) msg = 'Usuário desativado';
                    
                    showError(msg);
                });
        }

        // MOSTRAR PAINEL
        function showDashboard(email) {
            document.getElementById('loginScreen').style.display = 'none';
            document.getElementById('dashboardScreen').style.display = 'flex';
            document.body.classList.add('dashboard-active');
            // CORRIGIDO 10/08/2026 (pedido do usuário: avatar só com a inicial, email completo só no
            // hover/long-press via title) - inicial vem do e-mail (nunca há nome cadastrado à parte).
            const inicial = (email || '?').trim().charAt(0).toUpperCase();
            document.getElementById('userAvatarInitial').textContent = inicial;
            document.getElementById('userChip').title = email || '';
            document.getElementById('userEmailTooltip').textContent = email || '';
            loadDashboard();
            iniciarMonitorInatividade();
            iniciarRenovacaoTokenPeriodica();
        }

        // NOVO 10/08/2026 (pedido do usuário: "quando passar o mouse ou clicar sobre a letra com a
        // inicial, pode identificar que está logado com o email, bem sutil") - clique/toque alterna o
        // tooltip (funciona em qualquer dispositivo, ao contrário de title=""); fecha sozinho depois de
        // alguns segundos ou ao tocar fora, mesmo padrão já usado no dropdown de busca.
        (function(){
            const chip = document.getElementById('userChip');
            const tooltip = document.getElementById('userEmailTooltip');
            if(!chip || !tooltip) return;
            let timerFechar = null;
            const fechar = () => tooltip.classList.remove('visivel');
            chip.addEventListener('click', (ev) => {
                ev.stopPropagation();
                const abrindo = !tooltip.classList.contains('visivel');
                tooltip.classList.toggle('visivel', abrindo);
                clearTimeout(timerFechar);
                if(abrindo) timerFechar = setTimeout(fechar, 3000);
            });
            document.addEventListener('click', (ev) => { if(!chip.contains(ev.target)) fechar(); });
        })();

        // NOVO 07/08/2026 (pedido do usuário: "quero que o site bloqueie por inatividade... não
        // ficando aberto em algum computador"): desloga sozinho depois de 15min sem nenhuma
        // interação (mouse/teclado/toque/rolagem) - dado financeiro real, não pode ficar logado
        // pra sempre numa máquina compartilhada/esquecida. Reinicia o contador a cada evento;
        // dispara só uma vez (guarda __inatividadeTimer pra nunca empilhar timers duplicados).
        const TEMPO_INATIVIDADE_MS = 15 * 60 * 1000; // 15 minutos
        let __inatividadeTimer = null;
        let __monitorInatividadeAtivo = false;
        function resetarTimerInatividade() {
            if (__inatividadeTimer) clearTimeout(__inatividadeTimer);
            __inatividadeTimer = setTimeout(() => {
                console.log('Sessão encerrada por inatividade (15min sem uso).');
                logout();
            }, TEMPO_INATIVIDADE_MS);
        }
        function iniciarMonitorInatividade() {
            if (__monitorInatividadeAtivo) { resetarTimerInatividade(); return; }
            __monitorInatividadeAtivo = true;
            ['mousemove', 'mousedown', 'keydown', 'scroll', 'touchstart', 'wheel'].forEach(evento => {
                document.addEventListener(evento, resetarTimerInatividade, { passive: true });
            });
            resetarTimerInatividade();
        }
        function pararMonitorInatividade() {
            if (__inatividadeTimer) clearTimeout(__inatividadeTimer);
            __inatividadeTimer = null;
        }

        // MOSTRAR LOGIN
        function showLoginScreen() {
            document.getElementById('loginScreen').style.display = 'block';
            document.getElementById('dashboardScreen').style.display = 'none';
            document.body.classList.remove('dashboard-active');
            document.getElementById('email').value = '';
            document.getElementById('password').value = '';
            // CORREÇÃO: reseta o botão de login, que ficava travado em "Entrando..." / disabled
            // após um login bem-sucedido anterior — isso impedia clicar em "Entrar" de novo depois do logout.
            const loginBtn = document.getElementById('loginBtn');
            loginBtn.disabled = false;
            loginBtn.textContent = 'Entrar';
            document.getElementById('errorMessage').style.display = 'none';
        }

        // CARREGAR PAINEL HTML (via iframe - preserva scripts, Chart.js e datas dinâmicas)
        function loadDashboard() {
            const content = document.getElementById('dashboardContent');
            content.innerHTML = '<p style="padding: 20px; text-align: center;">⏳ Carregando painel...</p>';

            const cacheBust = Date.now();
            // NOVO 09/08/2026 (pedido do usuario: "compartilhar link de uma aba especifica, ex.
            // solar"): repassa ?aba=... da URL externa (index.html) pro iframe interno, que le esse
            // mesmo parametro no proprio boot e chama showMaster() - ver Sistema_Wallace_Lira_Completo.html.
            const abaAlvo = new URLSearchParams(location.search).get('aba');
            let iframeSrc = 'Sistema_Wallace_Lira_Completo.html?v=' + cacheBust;
            if(abaAlvo) iframeSrc += '&aba=' + encodeURIComponent(abaAlvo);
            fetch('Sistema_Wallace_Lira_Completo.html?v=' + cacheBust, { method: 'HEAD', cache: 'no-store' })
                .then(r => {
                    if (!r.ok) throw new Error('Arquivo não encontrado (status ' + r.status + ')');
                    const iframe = document.createElement('iframe');
                    iframe.id = 'mainIframe';
                    iframe.src = iframeSrc;
                    iframe.title = 'Sistema Wallace Lira - Painel';
                    content.innerHTML = '';
                    content.appendChild(iframe);
                    console.log('✅ Painel carregado via iframe (scripts e datas dinâmicas ativos)');
                })
                .catch(error => {
                    console.error('❌ Erro:', error);
                    content.innerHTML = '<div style="padding: 40px; text-align: center; color: #e74c3c;"><h2>⚠️ Erro</h2><p>Arquivo "Sistema_Wallace_Lira_Completo.html" não encontrado</p></div>';
                });
        }

        // LOGOUT
        function logout() {
            pararMonitorInatividade();
            pararRenovacaoTokenPeriodica();
            sessionStorage.removeItem('auth');
            window.authObj = null;
            document.getElementById('dashboardContent').innerHTML = '';
            showLoginScreen();
        }

        // ERRO
        function showError(msg) {
            const errorDiv = document.getElementById('errorMessage');
            errorDiv.textContent = msg;
            errorDiv.style.display = 'block';
            console.error('❌', msg);
        }

        // EVENTOS
        document.getElementById('loginBtn').addEventListener('click', login);
        document.getElementById('logoutBtn').addEventListener('click', logout);

        // NOVO 07/08/2026 (pedido do usuario: clicar na logo "Sistema Wallace Lira / Painel
        // Financeiro" volta pro topo do painel): o painel real mora dentro do #mainIframe (a pagina
        // externa/index.html nao rola, so o iframe rola por dentro - ver #dashboardContent{overflow:hidden}
        // acima) - por isso o scroll precisa ser feito no contentWindow do iframe, nao em window/document
        // daqui de fora. CONFIRMADO por inspecao: dentro do painel quem rola de verdade e o <body>
        // (overflow-y:auto), nao o <html>/window - contentWindow.scrollTo() sozinho nao move a tela
        // visivel. Seta os 3 alvos possiveis (scrollTo do window + scrollTop de html e body) pra
        // cobrir qualquer um que seja o container real, sem depender de qual exatamente é.
        // ATUALIZADO 09/08/2026 (pedido do usuario: home vira tela exclusiva, "pra voltar pode usar o
        // ponto que ja tem hoje que retorna pro icone painel de controle"): antes so rolava a pagina
        // pro topo (o conteudo da aba atual continuava visivel logo abaixo do resumo). Agora chama
        // irParaPrimeiraSecao('home') dentro do iframe - mesma funcao que ja troca de aba pros outros
        // 5 destinos (showMaster + scroll), reaproveitada aqui pra "voltar" tambem trocar de pane de
        // verdade, escondendo o conteudo da aba anterior, nao so rolar por cima dele. Fallback pro
        // scroll antigo se a funcao ainda nao existir (HTML em cache antigo, deploy no meio do caminho).
        function scrollPainelParaTopo(){
            const iframe = document.getElementById('mainIframe');
            if(!iframe || !iframe.contentWindow) return;
            const win = iframe.contentWindow;
            if(typeof win.irParaPrimeiraSecao === 'function'){
                win.irParaPrimeiraSecao('home');
                return;
            }
            const doc = win.document;
            if(doc && doc.body && doc.body.scrollTo){ doc.body.scrollTo({ top: 0, behavior: 'smooth' }); }
            if(doc && doc.body) doc.body.scrollTop = 0;
            if(doc && doc.documentElement) doc.documentElement.scrollTop = 0;
            win.scrollTo({ top: 0, behavior: 'smooth' });
        }
        const brandLogo = document.getElementById('brandLogo');
        if(brandLogo){
            brandLogo.addEventListener('click', scrollPainelParaTopo);
            brandLogo.addEventListener('keydown', e => {
                if(e.key === 'Enter' || e.key === ' '){ e.preventDefault(); scrollPainelParaTopo(); }
            });
        }

        document.getElementById('email').addEventListener('keypress', e => {
            if (e.key === 'Enter') login();
        });
        document.getElementById('password').addEventListener('keypress', e => {
            if (e.key === 'Enter') login();
        });

        // VERIFICAR SE JÁ ESTÁ LOGADO
        window.addEventListener('load', () => {
            const auth = sessionStorage.getItem('auth');
            if (auth) {
                try {
                    window.authObj = JSON.parse(auth);
                    const email = window.authObj.email || 'usuário';
                    showDashboard(email);
                } catch (e) {
                    showLoginScreen();
                }
            }
        });
