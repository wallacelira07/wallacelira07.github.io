<head>

    <!-- ADICIONADO 15/08/2026 (quick win da auditoria de 43 especialistas: site inteiro indexável por
         padrão, sem meta robots nem robots.txt) - painel privado, nunca deve aparecer em buscador. -->
    <meta name="robots" content="noindex, nofollow">
    <title>Sistema Wallace Lira - Login</title>

    <!-- ATUALIZADO 12/08/2026 (pedido do usuário: "troque esse ícone... pelo que você usou na tela de
         login") - SVG primeiro (badge gradiente + barras, mesmo desenho do login-brand-icon/brand-icon)
         é o que a maioria dos navegadores usa hoje; PNGs antigos ficam só de fallback pra Safari/iOS,
         que ainda não escolhe favicon SVG sozinho. -->
    <link rel="icon" type="image/svg+xml" href="assets/images/favicon.svg">
    <link rel="icon" type="image/png" sizes="32x32" href="assets/images/favicon-32.png">
    <link rel="icon" type="image/png" sizes="192x192" href="assets/images/favicon-192.png">
    <link rel="apple-touch-icon" href="assets/images/apple-touch-icon.png">

    <!-- ADICIONADO 14/08/2026 (correção de arquitetura de auditoria: index.html duplicava valores de
         cor/raio/sombra do design system sem carregar assets/css/styles.css). Link vem ANTES do
         <style> inline abaixo de propósito: qualquer regra deste arquivo que colida em especificidade
         igual com uma regra de styles.css (mesmo seletor, ex: `body`) é declarada DEPOIS no documento,
         então continua vencendo a cascata normalmente - nada muda visualmente só por causa do link.
         Conferido por grep que nenhuma classe/id usada aqui (.login-brand, #loginScreen, .form-group,
         etc.) colide com nenhum seletor genérico de styles.css (que só define .card/.kpi/.tab/.row/
         etc., todos nomes usados exclusivamente DENTRO do painel) - a única sobreposição real é o
         seletor de elemento `body`, inofensiva pelo motivo acima. -->
    <!-- CORRIGIDO 20/08/2026: mesmo cache-buster estático nunca bumpado, ver comentário completo em
         Sistema_Wallace_Lira_Completo.html junto deste mesmo link. Action agora bumpa os dois. -->
    <link rel="stylesheet" href="assets/css/styles.css?v=20260822-0546-380894a">

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html, body {
            height: 100%;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            /* ADICIONADO 14/08/2026 (junto do link de styles.css acima): color/line-height explícitos
               pra este `body` continuar 100% independente do `body{}` de styles.css (que define
               color:var(--text) e line-height:var(--lh-normal)) - mesma especificidade, este vence por
               vir depois no documento, mas declarar explícito documenta a intenção e blinda contra
               qualquer reordenação futura do <link>/<style>. Nenhum texto real herda a cor daqui (todo
               elemento visível do login/cabeçalho já define a própria cor) - é só reforço redundante. */
            color: initial;
            line-height: normal;
            background:
                radial-gradient(560px 420px at 18% 8%, rgba(76,142,242,0.14), transparent 60%),
                radial-gradient(620px 480px at 88% 92%, rgba(144,133,233,0.12), transparent 60%),
                var(--bg, #0a0b10);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
            overflow: hidden;
        }
        /* CORRIGIDO 12/08/2026 (achado do usuário: "barra de fora feia, deixe só a interna bonita") —
           o padding:20px acima existe só pra centralizar o card de login pequeno; depois do login,
           #dashboardScreen (height:100vh) + esse padding somavam mais que 100vh de conteúdo, forçando
           o <body> externo a criar seu PRÓPRIO scrollbar nativo (sem o estilo customizado que já existe
           em assets/css/styles.css, só aplicado dentro do painel/iframe) — 2 barras visíveis ao mesmo
           tempo. Classe alternada por showDashboard()/showLoginScreen() (abaixo) zera o padding/gutter
           só quando o painel está ativo; a tela de login continua centralizada como sempre. */
        body.dashboard-active {
            padding: 0;
            align-items: stretch;
            justify-content: stretch;
        }

        /* MODERNIZADO 12/08/2026 (pedido do usuário): mesma linguagem visual do cabeçalho do painel
           (brand-icon em gradiente, linha de acento no topo do card, botões com lift no hover) -
           antes era um card genérico sem nenhuma relação com o resto do produto. Zero mudança de
           IDs/estrutura que o JS de login depende (email/password/loginBtn/errorMessage intactos). */
        #loginScreen {
            position: relative;
            background: linear-gradient(180deg, #17191d 0%, #131518 100%);
            border: 1px solid rgba(255,255,255,0.08);
            border-radius: var(--radius-3xl, 14px);
            box-shadow: 0 24px 70px rgba(0, 0, 0, 0.55), inset 0 1px 0 rgba(255,255,255,0.04);
            padding: 38px 36px 34px;
            max-width: 380px;
            width: 100%;
            overflow: hidden;
            animation: loginCardIn 0.5s cubic-bezier(0.16, 1, 0.3, 1);
        }
        #loginScreen::before {
            content: '';
            position: absolute;
            left: 0; right: 0; top: 0;
            height: 1px;
            background: linear-gradient(90deg, rgba(76,142,242,0) 0%, rgba(76,142,242,0.7) 25%, rgba(144,133,233,0.6) 55%, rgba(76,142,242,0) 100%);
        }
        @media (prefers-reduced-motion: reduce) {
            #loginScreen { animation: none; }
        }
        @keyframes loginCardIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .login-brand {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 14px;
            margin-bottom: 30px;
            text-align: center;
        }
        .login-brand-icon {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            width: 52px;
            height: 52px;
            border-radius: var(--radius-3xl, 14px);
            background: linear-gradient(135deg, rgba(76,142,242,0.28), rgba(144,133,233,0.2));
            border: 1px solid rgba(255,255,255,0.1);
            box-shadow: inset 0 1px 0 rgba(255,255,255,0.08);
            color: #8ab4f8;
        }
        #loginScreen h1 {
            color: #f3f1ec;
            font-size: 19px;
            font-weight: 700;
            letter-spacing: 0.1px;
            line-height: 1.3;
        }
        .login-brand-sub {
            font-size: 10px;
            font-weight: 600;
            letter-spacing: 0.7px;
            text-transform: uppercase;
            color: #6f9bd8;
        }

        .form-group {
            margin-bottom: 18px;
        }

        .form-group label {
            display: block;
            margin-bottom: 7px;
            color: #a9a79f;
            font-weight: 500;
            font-size: 13px;
        }

        .form-group .input-wrap {
            position: relative;
            display: flex;
            align-items: center;
        }
        .form-group .input-wrap svg {
            position: absolute;
            left: 13px;
            color: #6f9bd8;
            pointer-events: none;
            flex-shrink: 0;
        }

        .form-group input {
            width: 100%;
            padding: 12px 12px 12px 38px;
            background: rgba(255,255,255,0.03);
            border: 1px solid #2a2d31;
            border-radius: var(--radius-xl, 10px);
            color: #e8e6df;
            /* CORRIGIDO (mobile perf): 14px < 16px dispara zoom automatico do iOS Safari ao focar
               o campo de login (bug conhecido do WebKit) - 16px é o minimo que evita o zoom. */
            font-size: 16px;
            font-family: inherit;
            transition: border-color 0.15s ease, background-color 0.15s ease, box-shadow 0.15s ease;
        }

        .form-group input::placeholder {
            /* CORRIGIDO 15/08/2026 (achado de Acessibilidade da auditoria de 43 especialistas):
               #6f6d66 sobre o fundo escuro do card de login ficava abaixo de 4,5:1 (WCAG AA) —
               tom mais claro mantém a hierarquia visual (ainda mais apagado que o texto real
               #e8e6df) mas com contraste suficiente pra leitura. */
            color: #8c8a82;
        }

        .form-group input:focus {
            outline: none;
            border-color: var(--accent, #4c8ef2);
            background: rgba(76,142,242,0.06);
            box-shadow: 0 0 0 3px rgba(76,142,242, 0.15);
        }

        /* NOVO 01/08/2026: botao de esconder valores - antes era emoji fixo que nunca trocava
           (bug estrutural: a funcao que trocava o icone rodava dentro do iframe, nao alcancava
           este botao que mora aqui fora). Agora 2 icones SVG (olho aberto/fechado, mesmo traco
           do botao Sair ao lado) com transicao suave de opacidade+escala+rotacao. */
        .eye-toggle-btn {
            position: relative;
            background: rgba(255,255,255,0.03);
            border: 1px solid rgba(255,255,255,0.12);
            border-radius: 50%;
            width: 34px;
            height: 34px;
            cursor: pointer;
            color: #a9a79f;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            transition: border-color 0.2s ease, background-color 0.2s ease, transform 0.15s ease, color 0.2s ease, box-shadow 0.2s ease;
        }
        .eye-toggle-btn:hover {
            border-color: rgba(76,142,242, 0.55);
            background: rgba(76,142,242, 0.1);
            color: #8ab4f8;
            transform: translateY(-1px);
            box-shadow: 0 4px 14px rgba(76,142,242, 0.18);
        }
        .eye-toggle-btn:active {
            transform: translateY(0) scale(0.94);
        }
        /* NOVO 14/08/2026 (achado de auditoria, mesma rodada de refino de estados interativos que já
           cobriu todo o styles.css do painel interno): botões redondos do cabeçalho/login tinham
           :hover/:active mas nenhum :focus-visible próprio — navegação por teclado (Tab) caía no anel
           padrão do navegador, que em botão circular sobre fundo escuro fica com "cantos" quadrados
           destoando do resto do site. Mesmo azul de marca (#4c8ef2) já usado no anel de foco dos campos
           de login (linha ~167) e no botão de busca (linha ~484), só reaproveitado. */
        .eye-toggle-btn:focus-visible {
            outline: none;
            box-shadow: 0 0 0 3px rgba(76,142,242, 0.35);
        }
        .eye-toggle-btn.ativo {
            background: rgba(76,142,242, 0.16);
            border-color: var(--accent, #4c8ef2);
            color: var(--accent, #4c8ef2);
        }
        .eye-icon {
            position: absolute;
            transition: opacity 0.25s ease, transform 0.25s ease;
        }
        .eye-open {
            opacity: 1;
            transform: scale(1) rotate(0deg);
        }
        .eye-closed {
            opacity: 0;
            transform: scale(0.4) rotate(-25deg);
        }
        .eye-toggle-btn.ativo .eye-open {
            opacity: 0;
            transform: scale(0.4) rotate(25deg);
        }
        .eye-toggle-btn.ativo .eye-closed {
            opacity: 1;
            transform: scale(1) rotate(0deg);
        }

        /* Escopado só em #loginBtn (era o seletor genérico `button`, que por sorte nunca colidia com
           os outros botões da página porque todos ou têm classe própria com mais especificidade ou
           style inline - mas escopar explícito é mais seguro que depender dessa coincidência). */
        #loginBtn {
            position: relative;
            width: 100%;
            padding: 13px;
            margin-top: 6px;
            background: linear-gradient(135deg, var(--accent, #4c8ef2), #7c6fe0);
            color: white;
            border: none;
            border-radius: var(--radius-xl, 10px);
            font-size: 15px;
            font-weight: 600;
            font-family: inherit;
            letter-spacing: 0.2px;
            cursor: pointer;
            transition: transform 0.15s ease, box-shadow 0.2s ease, filter 0.15s ease;
            box-shadow: 0 8px 20px rgba(76,142,242, 0.28);
        }

        #loginBtn:hover:not(:disabled) {
            transform: translateY(-1px);
            filter: brightness(1.06);
            box-shadow: 0 10px 26px rgba(76,142,242, 0.36);
        }
        #loginBtn:active:not(:disabled) {
            transform: translateY(0) scale(0.99);
        }
        #loginBtn:focus-visible {
            outline: none;
            box-shadow: 0 8px 20px rgba(76,142,242, 0.28), 0 0 0 3px rgba(76,142,242, 0.35);
        }

        #loginBtn:disabled {
            background: #2a2d31;
            color: #6f6d66;
            cursor: not-allowed;
            box-shadow: none;
            padding-right: 34px;
        }
        /* Spinner CSS-puro - o JS só troca textContent ('Entrar' <-> 'Entrando...'), nunca innerHTML,
           então um filho real seria apagado a cada troca; ::after sobrevive porque não é filho do DOM. */
        #loginBtn:disabled::after {
            content: '';
            position: absolute;
            right: 13px;
            top: 50%;
            width: 14px;
            height: 14px;
            margin-top: -7px;
            border: 2px solid rgba(255,255,255,0.25);
            border-top-color: #a9a79f;
            border-radius: 50%;
            animation: loginSpin 0.7s linear infinite;
        }
        @media (prefers-reduced-motion: reduce) {
            #loginBtn:disabled::after { animation: none; }
        }
        @keyframes loginSpin {
            to { transform: rotate(360deg); }
        }

        .error-message {
            color: var(--red, #ef5b56);
            font-size: 13px;
            margin-top: 16px;
            padding: 10px 12px;
            background: rgba(239,91,86, 0.12);
            border: 1px solid rgba(239,91,86, 0.3);
            border-radius: var(--radius-lg, 8px);
            display: none;
            text-align: center;
            animation: loginErrorIn 0.2s ease;
        }
        @keyframes loginErrorIn {
            from { opacity: 0; transform: translateY(-4px); }
            to { opacity: 1; transform: translateY(0); }
        }

        #dashboardScreen {
            display: none;
            width: 100%;
            height: 100vh;
            flex-direction: column;
        }

        #dashboardScreen header {
            background: linear-gradient(180deg, #15171c 0%, #0e1013 100%);
            color: #eceae4;
            padding: 11px 24px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid rgba(255,255,255,0.06);
            position: relative;
            min-height: 56px;
            box-shadow: 0 1px 0 rgba(0,0,0,0.4);
        }

        #dashboardScreen header::after {
            content: '';
            position: absolute;
            left: 0; right: 0; bottom: -1px;
            height: 1px;
            background: linear-gradient(90deg, rgba(76,142,242,0.55) 0%, rgba(144,133,233,0.4) 45%, rgba(76,142,242,0) 100%);
        }

        #dashboardScreen header .brand {
            display: flex;
            align-items: center;
            gap: 11px;
            cursor: pointer;
            border-radius: 8px;
            transition: opacity .15s ease;
        }
        #dashboardScreen header .brand:hover {
            opacity: 0.82;
        }

        #dashboardScreen header .brand-icon {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            width: 36px;
            height: 36px;
            font-size: 18px;
            border-radius: var(--radius-xl, 10px);
            background: linear-gradient(135deg, rgba(76,142,242,0.22), rgba(144,133,233,0.16));
            border: 1px solid rgba(255,255,255,0.09);
            box-shadow: inset 0 1px 0 rgba(255,255,255,0.06);
            color: #8ab4f8;
            flex-shrink: 0;
        }

        #dashboardScreen header .brand-text {
            display: flex;
            flex-direction: column;
            gap: 1px;
            line-height: 1.15;
        }

        #dashboardScreen header h1 {
            font-size: 15px;
            font-weight: 700;
            letter-spacing: 0.2px;
            color: #f3f1ec;
        }
        #dashboardScreen header .brand-name-full {
            display: none;
        }
        #dashboardScreen header .brand-name-short {
            display: inline;
        }

        #dashboardScreen header .brand-sub {
            font-size: 10px;
            font-weight: 600;
            letter-spacing: 0.6px;
            text-transform: uppercase;
            color: #6f9bd8;
        }

        #dashboardScreen header .user-info {
            display: flex;
            gap: 12px;
            align-items: center;
        }

        /* NOVO 10/08/2026 (pedido do usuário: "mais destaque nos botões, pode reorganizar"):
           agrupa busca+chip+ações como 1 bloco à direita — header vira só 2 filhos (.brand e este
           grupo), garante alinhamento/gap consistentes em qualquer largura, sem depender de
           justify-content:space-between espalhar 4 filhos de forma instável. */
        #dashboardScreen header .header-actions-group {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        #dashboardScreen header .header-search-wrap {
            position: relative;
            flex: 0 1 320px;
            min-width: 120px;
            display: flex;
            align-items: center;
        }
        #dashboardScreen header .header-search-icon {
            position: absolute;
            left: 11px;
            top: 50%;
            transform: translateY(-50%);
            color: #6f9bd8;
            pointer-events: none;
        }
        #dashboardScreen header .header-search-input {
            width: 100%;
            background: rgba(76,142,242,0.07);
            border: 1px solid rgba(76,142,242,0.25);
            color: #eceae4;
            /* CORRIGIDO (mobile perf): abaixo de 16px o iOS Safari da zoom automatico ao focar -
               este campo abre em overlay no mobile (max-width:780px), entao o toque é comum. */
            font-size: 16px;
            padding: 7px 10px 7px 30px;
            border-radius: 999px;
            outline: none;
            font-family: inherit;
            transition: border-color .15s ease, background-color .15s ease;
        }
        #dashboardScreen header .header-search-input:focus {
            border-color: rgba(76,142,242,0.55);
            background: rgba(255,255,255,0.08);
        }
        #dashboardScreen header .header-search-resultados {
            position: absolute;
            top: calc(100% + 6px);
            left: 0;
            width: 100%;
            min-width: 280px;
            background: #1d2024;
            border: 1px solid rgba(255,255,255,0.12);
            border-radius: var(--radius-xl, 10px);
            overflow: hidden;
            box-shadow: var(--shadow-card, 0 1px 2px rgba(0,0,0,0.22), 0 8px 20px -6px rgba(0,0,0,0.34));
            z-index: 50;
        }
        #dashboardScreen header .header-search-item {
            /* CORRIGIDO 15/08/2026 (achado de auditoria: era <div onclick>, inacessível por teclado —
               virou <button> real, que ganha foco/Enter/Espaço de graça do navegador; reset dos
               estilos padrão de <button> pra manter exatamente a mesma aparência de antes). */
            display: block;
            width: 100%;
            background: none;
            border: none;
            font-family: inherit;
            text-align: left;
            padding: 8px 12px;
            font-size: 12px;
            color: #c8c6bf;
            cursor: pointer;
            border-bottom: 1px solid rgba(255,255,255,0.06);
        }
        #dashboardScreen header .header-search-item:focus-visible {
            outline: none;
            box-shadow: inset 0 0 0 2px rgba(76,142,242,0.5);
        }
        #dashboardScreen header .header-search-item:last-child { border-bottom: none; }
        #dashboardScreen header .header-search-item:hover { background: rgba(76,142,242,0.12); color: #eceae4; }
        #dashboardScreen header .header-search-item .hs-sub {
            display: block;
            font-size: 10px;
            color: #8b8a84;
            margin-top: 2px;
        }
        #dashboardScreen header .header-search-vazio {
            padding: 10px 12px;
            font-size: 12px;
            color: #8b8a84;
        }
        /* CORRIGIDO 10/08/2026 (pedido do usuário: "o de pesquisa precisa ser um pouco mais
           pronunciado que os outros") - tom de acento (mesmo azul da marca) já em repouso, não só
           no hover, pra se diferenciar visualmente de olho/sair (ghost buttons neutros). */
        #dashboardScreen header .header-search-toggle-btn {
            display: none;
            align-items: center;
            justify-content: center;
            width: 34px;
            height: 34px;
            border-radius: 999px;
            background: rgba(76,142,242,0.16);
            border: 1px solid rgba(76,142,242,0.45);
            color: #8ab4f8;
            cursor: pointer;
            flex-shrink: 0;
            transition: border-color 0.2s ease, background-color 0.2s ease, transform 0.15s ease, box-shadow 0.2s ease;
        }
        #dashboardScreen header .header-search-toggle-btn:hover {
            background: rgba(76,142,242,0.26);
            border-color: rgba(76,142,242,0.7);
            transform: translateY(-1px);
            box-shadow: 0 4px 14px rgba(76,142,242,0.22);
        }
        #dashboardScreen header .header-search-toggle-btn:active {
            transform: translateY(0) scale(0.94);
        }
        #dashboardScreen header .header-search-toggle-btn:focus-visible {
            outline: none;
            box-shadow: 0 0 0 3px rgba(76,142,242, 0.35);
        }
        /* .brand tem role="button" tabindex="0" (é navegável por Tab de verdade, não só clicável de
           mouse) mas só tinha feedback de :hover (opacidade) — sem nenhum indicador de foco por
           teclado, único elemento do cabeçalho realmente focável sem anel próprio. */
        #dashboardScreen header .brand:focus-visible {
            outline: none;
            box-shadow: 0 0 0 3px rgba(76,142,242, 0.35);
        }
        @media (max-width: 780px) {
            #dashboardScreen header .header-search-wrap { display: none; }
            #dashboardScreen header .header-search-toggle-btn { display: flex; }
            /* CORRIGIDO 10/08/2026 (2ª ocorrência do mesmo achado: "lupa parece um ponto, não dá pra
               ver" — desta vez em janela desktop estreita, faixa 560-780px, que só herdava a versão de
               baixo contraste porque a correção de contraste morava só no bloco max-width:560px. Botão
               vira círculo (visível) já em 780px — o contraste forte precisa valer na mesma faixa. */
            #dashboardScreen header .header-search-toggle-btn {
                background: rgba(76,142,242,0.32);
                border-color: rgba(76,142,242,0.75);
                color: #ffffff;
            }
            #dashboardScreen header .header-search-wrap.mobile-open {
                display: flex;
                position: absolute;
                top: 100%;
                left: 0;
                right: 0;
                margin: 0;
                padding: 8px 14px;
                background: #15171c;
                border-bottom: 1px solid rgba(255,255,255,0.1);
                box-shadow: 0 6px 14px rgba(0,0,0,0.35);
                z-index: 60;
                flex: none;
            }
            /* CORRIGIDO 10/08/2026 (pedido do usuário: "quando abre o campo pra pesquisa a lupa fica
               torta") - causa raiz: o wrap ganha padding:8px 14px só no overlay mobile, mas o ícone
               (position:absolute) usa o mesmo left:11px de sempre, relativo à borda do wrap — sem
               contar esse padding novo, o ícone ficava perto da própria borda/curva do pill em vez de
               centrado dentro do campo. Ajustado só pra este contexto (14px do padding + 11px original). */
            #dashboardScreen header .header-search-wrap.mobile-open .header-search-icon {
                left: 25px;
            }
        }

        #dashboardScreen header .user-chip {
            position: relative;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 0;
            border-radius: 50%;
            cursor: pointer;
        }
        /* NOVO 10/08/2026 (pedido do usuário: "quando passar o mouse ou clicar sobre a letra com a
           inicial, pode identificar que está logado com o email, bem sutil") - pill discreto que some
           sozinho, alternativa ao title="" (que não é confiável em toque no mobile). */
        #dashboardScreen header .user-email-tooltip {
            position: absolute;
            top: calc(100% + 8px);
            right: 0;
            background: #1d2024;
            border: 1px solid rgba(255,255,255,0.12);
            color: #c8c6bf;
            font-size: 11px;
            font-weight: 500;
            white-space: nowrap;
            padding: 5px 10px;
            border-radius: var(--radius-md, 6px);
            box-shadow: var(--shadow-card, 0 1px 2px rgba(0,0,0,0.22), 0 8px 20px -6px rgba(0,0,0,0.34));
            opacity: 0;
            pointer-events: none;
            transform: translateY(-3px);
            transition: opacity 0.15s ease, transform 0.15s ease;
            z-index: 70;
        }
        #dashboardScreen header .user-email-tooltip.visivel {
            opacity: 1;
            transform: translateY(0);
        }
        /* NOVO 16/08/2026 (achado do usuário: comparou o tooltip nativo title="" — cinza claro,
           padrão do navegador — com o tooltip escuro/estilizado do e-mail acima, pediu "deixe esses
           avisos igual o do email"). Versão reutilizável em CSS puro do MESMO estilo (mesma cor de
           fundo #1d2024, mesma borda, mesmo texto #c8c6bf) via data-tooltip + ::after, sem depender
           de JS novo — troca só o title="" desses botões por data-tooltip="" (aria-label já cobre a
           acessibilidade, então nada se perde pra leitor de tela). */
        [data-tooltip] { position: relative; }
        [data-tooltip]::after {
            content: attr(data-tooltip);
            position: absolute;
            top: calc(100% + 8px);
            right: 0;
            background: #1d2024;
            border: 1px solid rgba(255,255,255,0.12);
            color: #c8c6bf;
            font-size: 11px;
            font-weight: 500;
            white-space: nowrap;
            padding: 5px 10px;
            border-radius: var(--radius-md, 6px);
            box-shadow: var(--shadow-card, 0 1px 2px rgba(0,0,0,0.22), 0 8px 20px -6px rgba(0,0,0,0.34));
            opacity: 0;
            pointer-events: none;
            transform: translateY(-3px);
            transition: opacity 0.15s ease, transform 0.15s ease;
            z-index: 70;
        }
        [data-tooltip]:hover::after, [data-tooltip]:focus-visible::after {
            opacity: 1;
            transform: translateY(0);
        }
        /* NOVO 10/08/2026 (pedido do usuário: avatar só com a inicial, "como sites modernos") -
           mesmo diâmetro (34px) dos outros botões circulares do cabeçalho (busca/olho/sair), pra
           ficar tudo alinhado na mesma "fileira de ícones" em vez do chip alongado com email inteiro. */
        #dashboardScreen header .user-avatar-initial {
            display: flex;
            align-items: center;
            justify-content: center;
            width: 34px;
            height: 34px;
            border-radius: 50%;

            color: #fff;
            font-size: 13px;
            font-weight: 700;
            letter-spacing: 0;
            flex-shrink: 0;
        }

        #dashboardScreen header .header-divider {
            width: 1px;
            height: 28px;
            background: rgba(255,255,255,0.1);
        }

        #dashboardScreen header .header-actions {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        #dashboardScreen header .logout-btn {
            width: 34px;
            height: 34px;
            padding: 0;
            border-radius: 50%;
            background: rgba(255,255,255,0.03);
            border: 1px solid rgba(255,255,255,0.12);
            color: #a9a79f;
            font-size: 13px;
            line-height: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: border-color 0.2s ease, background-color 0.2s ease, transform 0.15s ease, color 0.2s ease, box-shadow 0.2s ease;
        }

        #dashboardScreen header .logout-btn:hover {
            background: rgba(239,91,86, 0.12);
            border-color: rgba(239,91,86, 0.55);
            color: var(--red, #ef5b56);
            transform: translateY(-1px);
            box-shadow: 0 4px 14px rgba(239,91,86, 0.18);
        }

        #dashboardScreen header .logout-btn:active {
            transform: translateY(0) scale(0.94);
        }
        #dashboardScreen header .logout-btn:focus-visible {
            outline: none;
            box-shadow: 0 0 0 3px rgba(239,91,86, 0.35);
        }

        /* NOVO 14/08/2026 (pedido do usuário: botão de baixar relatório de fechamento em PDF, "no
           topo do painel, acessível de qualquer aba" — por isso vive aqui fora do #mainIframe, mesmo
           padrão de esconder-valores/sair, e não dentro de uma aba específica). Mesmo estilo de
           botão redondo já usado pelos outros ícones do cabeçalho (34px, hover/active/focus-visible),
           cor azul de marca por ser ação neutra (não é destrutiva como sair, nem um estado ligado/
           desligado como esconder valores). */
        #dashboardScreen header .pdf-report-btn {
            width: 34px;
            height: 34px;
            padding: 0;
            border-radius: 50%;
            background: rgba(255,255,255,0.03);
            border: 1px solid rgba(255,255,255,0.12);
            color: #a9a79f;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: border-color 0.2s ease, background-color 0.2s ease, transform 0.15s ease, color 0.2s ease, box-shadow 0.2s ease;
        }
        #dashboardScreen header .pdf-report-btn:hover {
            background: rgba(76,142,242, 0.1);
            border-color: rgba(76,142,242, 0.55);
            color: #8ab4f8;
            transform: translateY(-1px);
            box-shadow: 0 4px 14px rgba(76,142,242, 0.18);
        }
        #dashboardScreen header .pdf-report-btn:active {
            transform: translateY(0) scale(0.94);
        }
        #dashboardScreen header .pdf-report-btn:focus-visible {
            outline: none;
            box-shadow: 0 0 0 3px rgba(76,142,242, 0.35);
        }
        #dashboardScreen header .pdf-report-btn:disabled {
            opacity: 0.5;
            cursor: wait;
        }

        @media (max-width: 560px) {
            #dashboardScreen header {
                padding: 8px 14px;

            }
            #dashboardScreen header .header-divider {

            #dashboardScreen header .eye-toggle-btn,
            #dashboardScreen header .logout-btn,
            #dashboardScreen header .pdf-report-btn,
            #dashboardScreen header .header-search-toggle-btn,
            #dashboardScreen header .user-avatar-initial {
                /* CORRIGIDO 14/08/2026 (achado de auditoria mobile: eram 28x28px neste breakpoint -
                   MENOR que os 34x34px do desktop, ou seja, os botões de ação real do cabeçalho
                   (esconder valores, sair, buscar) encolhiam justo na tela onde o dedo precisa de
                   mais área, não menos. 40x40px fica perto do alvo de toque de 44px recomendado e
                   ainda cabe confortável dentro do header (min-height:48px neste mesmo breakpoint). */
                width: 40px;
                height: 40px;
                font-size: 13px;
            }
            /* CORRIGIDO 10/08/2026 (pedido do usuário: proporção/alinhamento perfeitos no mobile) -
               header-search-toggle-btn não fazia parte deste bloco antes, ficava 34px enquanto
               olho/sair encolhiam pra 28px — os 3 ícones agora encolhem juntos, mesma proporção. */
            #dashboardScreen header .header-actions-group {
                gap: 7px;

            #dashboardScreen header .header-search-toggle-btn svg {
                width: 17px;
                height: 17px;
                min-width: 17px;
                min-height: 17px;
                flex-shrink: 0;
            }

        #dashboardContent {
            flex: 1;
            overflow: hidden;
        }
        #dashboardContent iframe {
            width: 100%;
            height: 100%;
            border: none;
            display: block;
        }
    </style>
</head>
<body>
    <div id="loginScreen">

            <!-- NOVO 09/08/2026 (pedido do usuario: "lupa de pesquisa na barra de cima, pra aparecer
                 sempre"): campo real vive AQUI, fora do #mainIframe - so assim fica na mesma barra
                 fixa do email/olho/sair (um sticky DENTRO do iframe, tentativa anterior, nao contava
                 como "barra de cima" pro usuario, e um dropdown position:fixed dentro do iframe nunca
                 conseguiria pintar por cima da barra externa mesmo se o campo ficasse la dentro -

                 dentro do iframe) reaproveitam 100% do indice/match/ordenacao ja existentes - aqui so

            <!-- CORRIGIDO 09/08/2026 (achado do usuário: "no mobile falta a lupa de pesquisa") - a

                 Botão só-ícone abaixo, visível só no mobile (ver CSS), abre o mesmo campo/dropdown

            <!-- CORRIGIDO 10/08/2026 (pedido do usuário: "mais destaque nos botões, pode reorganizar,

                 pra busca+chip+ações ficarem sempre juntos como 1 bloco à direita, em vez de 3 filhos

            <div class="header-actions-group">

                        <circle cx="11" cy="11" r="8"></circle>

    <!-- NOVO 04/08/2026 (parte 76): modal de confirmacao de senha pra DESATIVAR o modo de esconder
         valores. So aparece nesse sentido (ativar continua 1 clique, sem atrito). -->
    <!-- CORRIGIDO 14/08/2026 (achado de auditoria: únicos botões clicáveis da página sem nenhum
         estado de hover/focus/active, destoando do resto do arquivo que trata isso com cuidado). -->
    <style>
      #modalSenhaEsconderValoresBtnCancelar{transition:background 0.15s ease,border-color 0.15s ease}
      #modalSenhaEsconderValoresBtnCancelar:hover{background:rgba(255,255,255,0.05);border-color:var(--border-strong,#363b45)}
      #modalSenhaEsconderValoresBtnCancelar:focus-visible{outline:none;box-shadow:0 0 0 3px rgba(76,142,242,0.18)}
      #senhaEsconderValoresBtnConfirmar{transition:filter 0.15s ease,box-shadow 0.15s ease}
      #senhaEsconderValoresBtnConfirmar:hover{filter:brightness(1.1)}
      #senhaEsconderValoresBtnConfirmar:active{filter:brightness(0.95)}
      #senhaEsconderValoresBtnConfirmar:focus-visible{outline:none;box-shadow:0 0 0 3px rgba(76,142,242,0.35)}
      #senhaEsconderValoresInput:focus{outline:none;border-color:var(--accent,#4c8ef2);box-shadow:0 0 0 3px rgba(76,142,242,0.15)}
    </style>
    <!-- ADICIONADO 14/08/2026 (mesma migração de token acima): valores inline deste modal eram
         cópias literais dos tokens --surface/--border/--text/--text-mid/--bg/--red/--accent/
         --radius-2xl/--radius-lg definidos em assets/css/styles.css - trocados por var(--token, valor
         antigo) com fallback idêntico, zero mudança visual, só passa a citar a fonte única. -->
    <!-- ADICIONADO 15/08/2026 (achado de Acessibilidade da auditoria de 43 especialistas): modal sem
         nenhuma semântica de diálogo — leitor de tela não anunciava abertura nem tinha jeito de
         fechar via teclado sem Tab até o botão Cancelar. role="dialog"+aria-modal informam o
         diálogo e seu título (aria-labelledby); Escape fecha (ver fecharModalSenhaEsconderValores
         chamado no keydown global logo abaixo do modal); aria-live="assertive" no erro faz o leitor
         de tela anunciar "PIN incorreto" assim que aparece, sem precisar navegar até lá. -->
    <div id="modalSenhaEsconderValores" role="dialog" aria-modal="true" aria-labelledby="modalSenhaEsconderValoresTitulo" style="display:none;position:fixed;inset:0;background:rgba(0,0,0,0.6);z-index:9999;align-items:center;justify-content:center;">
      <div style="background:var(--surface,#14161b);border:1px solid var(--border,#262a32);border-radius:var(--radius-2xl,12px);padding:1.5rem;width:90%;max-width:320px;">
        <div id="modalSenhaEsconderValoresTitulo" style="font-weight:600;color:var(--text,#f0eee6);margin-bottom:0.4rem;font-size:0.95rem;">Digite o PIN pra mostrar os valores</div>
        <div style="font-size:0.78rem;color:var(--text-mid,#adaba3);margin-bottom:1rem;">O modo de privacidade só desativa com o PIN.</div>
        <input type="password" id="senhaEsconderValoresInput" placeholder="PIN" inputmode="numeric" maxlength="4" autocomplete="off"
          style="width:100%;padding:0.6rem 0.75rem;border-radius:var(--radius-lg,8px);border:1px solid var(--border,#262a32);background:var(--bg,#0a0b10);color:var(--text,#f0eee6);font-size:1.1rem;letter-spacing:0.3em;text-align:center;margin-bottom:0.5rem;"
          onkeydown="if(event.key==='Enter') confirmarSenhaEsconderValores(); else if(event.key==='Escape') fecharModalSenhaEsconderValores();">
        <div id="senhaEsconderValoresErro" role="alert" aria-live="assertive" style="display:none;color:var(--red,#ef5b56);font-size:0.78rem;margin-bottom:0.5rem;"></div>
        <div style="display:flex;gap:0.5rem;margin-top:0.5rem;">
          <button type="button" id="modalSenhaEsconderValoresBtnCancelar" onclick="fecharModalSenhaEsconderValores()"
            style="flex:1;padding:0.55rem;border-radius:var(--radius-lg,8px);border:1px solid var(--border,#262a32);background:transparent;color:var(--text-mid,#adaba3);cursor:pointer;">Cancelar</button>
          <button type="button" id="senhaEsconderValoresBtnConfirmar" onclick="confirmarSenhaEsconderValores()"
            style="flex:1;padding:0.55rem;border-radius:var(--radius-lg,8px);border:none;background:var(--accent,#4c8ef2);color:#fff;cursor:pointer;font-weight:600;">Confirmar</button>
        </div>
      </div>
    </div>

    <script>
        // NOVO 01/08/2026 (V252, pedido do usuario): botao de esconder valores movido pra barra
        // superior fixa (fora do iframe) - fica acessivel ANTES de rolar/ver qualquer valor, em vez

        function construirHtmlRelatorioWWI(dados, narrativa, indicadores, comparativo) {
            const score = indicadores && indicadores.wealthScore != null ? indicadores.wealthScore : null;
            const nivel = score === null ? null : score >= 90 ? 'ELITE' : score >= 75 ? 'AVANÇADO' : score >= 55 ? 'ESTÁVEL' : 'ATENÇÃO';
            const circunferencia = 263.9;
            const offset = score === null ? circunferencia : circunferencia - (circunferencia * Math.min(100, Math.max(0, score)) / 100);

            // REESCRITO 14/08/2026 (achado do usuário, repetido: "faça exatamente igual" — os 8 KPIs

            const caixaLance = _wwiNumLocal(pdfPegarKpi(dados.secoes, '📦 Todas as Caixas', 'Caixa Lance'));

            const partesLiquidezImediata = [reservaNum, caixaLance, caixaVariavel].filter(function (v) { return v !== null; });
            const liquidezImediata = partesLiquidezImediata.length ? _wwiFmtR(partesLiquidezImediata.reduce(function (a, v) { return a + v; }, 0)) : null;

            const capacidadeInvestimento = (indicadores && indicadores.indicadoresBrutos && indicadores.indicadoresBrutos.poupancaSobrou != null)

            // ADICIONADO 14/08/2026 (achado do usuário: "sem vida, sem beleza, feio" — os KPIs só

            const sc = (indicadores && indicadores.subscores) || {};
            const ib = (indicadores && indicadores.indicadoresBrutos) || {};
            function _wwiChip(score) {

            let numSecao = 0;

            function proximoNum() { numSecao++; return numSecao < 10 ? '0' + numSecao : '' + numSecao; }

            const blocos = [];

            if (kpis.length || score !== null) {

            // 11. Parecer Final — REESCRITO 14/08/2026 em formato pergunta/resposta (.fv-q + p), mesmo

                '</div>' +

                '</header>' +
                '<nav class="toc">' + navSecoes.map(function (s) {

        // REESCRITO 14/08/2026, 4ª vez (achado do usuário: 2 problemas na versão anterior — "fica

        function gerarPdfRelatorioFechamento(dados, narrativa, indicadores, comparativo, janela) {
            const htmlRel = construirHtmlRelatorioWWI(dados, narrativa, indicadores, comparativo);
            if (!janela || janela.closed) {

            // (new URL(...).href) porque a aba nova é aberta com window.open('', '_blank') + document.write()
            // — caminho relativo não tem garantia de resolver contra a mesma base em todo navegador.
            const faviconUrl = new URL('assets/images/favicon.svg', window.location.href).href;

            janela.document.open();

            janela.focus();
            return Promise.resolve();

        // REESCRITO 14/08/2026 (WWI — Wallace Wealth Intelligence). Fluxo (ver
        // docs/decisions/WWI_RELATORIO_EXECUTIVO_INTELIGENCIA.md):
        //   1. coletarDadosRelatorioFechamento() — reaproveitado, sem mudança de assinatura.
        //   2. calcularIndicadoresEScores(dados) — Wealth Score + 4 índices, dentro do iframe.
        //   3. wwiBuscarHistoricoRelatorios(competencia) — lê historico_relatorios (leitura pública,
        //      chave anon — a ESCRITA continua exclusiva do job mensal com service_role, nunca daqui).
        //   4. SE já existe relatório desta competência: reaproveita a narrativa salva (analise_ia) —
        //      requisito do usuário "narrativa igual durante o mês". SENÃO: gera na hora só pra EXIBIR
        //      no PDF (gerarAnaliseFinanceira) — não persiste; quem persiste de verdade é o job mensal.
        //   5. compararComHistorico() — frases de evolução vs. ciclo(s) anterior(es), degrada sem
        //      histórico (1º relatório da série).
        //   6. construirHtmlRelatorioWWI() abre uma aba nova com a página HTML real do relatório —
        //      ver comentário acima de gerarPdfRelatorioFechamento(). Não depende mais de
        //      jsPDF/html2canvas, e não chama print() sozinho (só se o usuário clicar no botão
        //      flutuante dentro da própria aba do relatório).
        // CORRIGIDO 14/08/2026 (achado ao testar): window.open() chamado DEPOIS de um fetch
        // assíncrono (busca de histórico) é bloqueado por popup blocker em vários navegadores — o
        // "gesto do usuário" (o clique no botão) só cobre chamadas síncronas ou logo no próximo
        // microtask, não sobrevive a uma ida-e-volta de rede. Fix: abre a janela (com uma tela de
        // "gerando...") SÍNCRONO, no primeiro tick do clique, antes de qualquer await — e só
        // preenche o conteúdo final depois que os dados chegam.
        function gerarRelatorioFechamentoPDF() {
            const btn = document.getElementById('btnRelatorioPdfHeader');
            const iframe = document.getElementById('mainIframe');
            if (!iframe || !iframe.contentWindow || typeof iframe.contentWindow.coletarDadosRelatorioFechamento !== 'function') {
                alert('O painel ainda não terminou de carregar — espera alguns segundos e tenta de novo.');
                return;
            }
            const janela = window.open('', '_blank');
            if (janela) {
                janela.document.write('<!doctype html><html><head><meta charset="utf-8"><title>Gerando relatório…</title></head>' +
                    '<body style="font-family:sans-serif;background:#F1F1EB;color:#161A22;display:flex;align-items:center;justify-content:center;height:100vh;margin:0;">' +
                    '<p>Gerando o relatório…</p></body></html>');
            }
            if (btn) btn.disabled = true;
            Promise.resolve().then(function () {
                const win = iframe.contentWindow;
                const dados = win.coletarDadosRelatorioFechamento();
                // CORRIGIDO 14/08/2026: WWI soma Caixa Lance ao Patrimônio (decisão explícita do
                // usuário, ver comentário em calcularIndicadoresEScores() no motor de análise) —
                // busca o saldo ANTES de calcular indicadores/narrativa, mesmo caminho já usado por
                // hydrate-onda3-caixalance.js (WallaceFinanceService.getSaldosPorCaixa(), cacheado).
                // Só altera o cálculo dentro do WWI; recalcularPatrimonio()/REG.patrimonio.total
                // (Painel Executivo/Balanço) continuam sem Caixa Lance, sem nenhuma mudança aqui.
                const promessaCaixaLance = (typeof win.wwiBuscarSaldoCaixaLance === 'function')
                    ? win.wwiBuscarSaldoCaixaLance()
                    : Promise.resolve(null);
                return promessaCaixaLance.then(function (caixaLanceSaldo) {
                    const promessaHistorico = (typeof win.wwiBuscarHistoricoRelatorios === 'function' && dados.competencia)
                        ? win.wwiBuscarHistoricoRelatorios(dados.competencia)
                        : Promise.resolve({ atual: null, anteriores: [] });
                    return promessaHistorico.then(function (historico) {
                        // NOVO 15/08/2026 (WWI Fase 3A/3B — WWI_FASE3_LEVANTAMENTO_TECNICO.md: "WWI = fonte
                        // de verdade, PDF = representação"). Guarda por competência fechada: só existe
                        // snapshot WWI pra consumir quando o job de dia 25 já rodou nesta competência
                        // (historico.atual.dados_json existe e tem o shape esperado). Fallback automático:
                        // qualquer ausência/formato inesperado cai de volta pro cálculo ao vivo — nunca
                        // quebra a geração do relatório (mesma filosofia defensiva do shadow mode da
                        // narrativa, Estágio B). `indicadores` (Wealth Score/subscores/indicadoresBrutos)
                        // tem exatamente o mesmo shape em `dados_json` e no retorno de
                        // calcularIndicadoresEScores() — troca de fonte sem transformação nenhuma.
                        let indicadores = null;
                        let wwiIndicadoresFonte = 'live';
                        if (historico.atual && historico.atual.dados_json &&
                            historico.atual.dados_json.indicadoresBrutos && historico.atual.dados_json.subscores) {
                            indicadores = historico.atual.dados_json;
                            wwiIndicadoresFonte = 'wwi';
                        } else if (typeof win.calcularIndicadoresEScores === 'function') {
                            indicadores = win.calcularIndicadoresEScores(dados, caixaLanceSaldo);
                        }
                        console.log('WWI Fase 3: indicadores desta geração vieram de', wwiIndicadoresFonte === 'wwi' ? 'WWI persistido' : 'cálculo ao vivo', '—', dados.competencia);

                        let narrativa = null;
                        if (historico.atual && historico.atual.analise_ia) {
                            narrativa = historico.atual.analise_ia; // reutiliza — mesma narrativa da criação da competência
                            // NOVO 15/08/2026 (Estágio B — WWI_ROADMAP_V1.md: Python é a fonte oficial da
                            // narrativa; JS vira SHADOW COMPARATOR durante a transição, nunca é exibido
                            // quando existe narrativa Python persistida). Calcula a versão JS só pra
                            // comparar — resultado nunca substitui `narrativa`, só vai pro console.
                            if (typeof win.gerarAnaliseFinanceira === 'function' && typeof win.wwiCompararNarrativaShadow === 'function') {
                                try {
                                    const narrativaSombraJs = win.gerarAnaliseFinanceira(dados, caixaLanceSaldo);
                                    win.wwiCompararNarrativaShadow(narrativa, narrativaSombraJs, dados.competencia);
                                } catch (errSombra) {
                                    console.warn('WWI Shadow Mode: falha ao comparar narrativa Python×JS (não afeta o relatório exibido).', errSombra);
                                }
                            }
                        } else if (typeof win.gerarAnaliseFinanceira === 'function') {
                            narrativa = win.gerarAnaliseFinanceira(dados, caixaLanceSaldo); // gerada na hora só pra exibir, não persiste
                        }
                        // Comparativo exibido continua vindo do cálculo ao vivo (janelas de 3/6/12 ciclos)

        // Função auxiliar para fazer fetch
        function firebaseAuth(email, password) {
            const url = "https://identitytoolkit.googleapis.com/v1/accounts:signInWithPassword?key=" + window.firebaseConfig.apiKey;
            
            return fetch(url, {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({
                    email: email,
                    password: password,
                    returnSecureToken: true
                })
            })
            .then(response => response.json())
            .then(data => {
                if (data.error) {
                    throw new Error(data.error.message);
                }
                return data;
            });

        // NOVO 14/08/2026 (achado do usuário: botão "Compartilhar" do Solar falhando com "Não
        // consegui criar o link" em sessão de várias horas) - o idToken do Firebase expira em ~1h e
        // login() nunca implementou renovação (é REST puro, não o SDK oficial, que faria isso sozinho).
        // O RPC do Supabase (criar_compartilhamento_solar) valida o JWT e rejeita silenciosamente um
        // token vencido como "não autenticado", mesmo com sessionStorage.auth ainda presente - dava a
        // entender que era só um erro de rede. A resposta de signInWithPassword TAMBÉM traz um
        // refreshToken (sempre foi salvo, só nunca foi usado) - de vida muito mais longa, serve pra
        // pedir um idToken novo sem precisar da senha de novo. Endpoint oficial do Google Identity
        // Platform pra isso: securetoken.googleapis.com/v1/token (formato de resposta é snake_case,
        // diferente do signInWithPassword - normaliza pros mesmos campos camelCase que o resto do
        // código já espera em sessionStorage.auth, pra obterTokenAuthSupabase() em app.js nem perceber
        // a diferença).
        function renovarTokenFirebase() {
            let auth;
            try { auth = JSON.parse(sessionStorage.getItem('auth') || 'null'); } catch (e) { auth = null; }
            if (!auth || !auth.refreshToken) return Promise.resolve(false);

            const url = "https://securetoken.googleapis.com/v1/token?key=" + window.firebaseConfig.apiKey;
            return fetch(url, {
                method: "POST",
                headers: { "Content-Type": "application/x-www-form-urlencoded" },
                body: "grant_type=refresh_token&refresh_token=" + encodeURIComponent(auth.refreshToken)
            })
            .then(response => response.json())
            .then(data => {
                if (data.error) throw new Error(data.error.message);
                auth.idToken = data.id_token;
                auth.refreshToken = data.refresh_token;
                auth.expiresIn = data.expires_in;
                sessionStorage.setItem('auth', JSON.stringify(auth));
                window.authObj = auth;
                console.log('🔄 Token Firebase renovado.');
                return true;
            })
            .catch(error => {
                // refreshToken também vencido/revogado (ex: senha trocada, sessão revogada no
                // console) - não dá pra renovar, só relogar mesmo. Não força logout aqui pra não
                // interromper o usuário no meio do que está fazendo; próxima chamada autenticada que
                // falhar mostra o erro real e ele reloga quando quiser.
                console.warn('Não foi possível renovar o token Firebase:', error.message);
                return false;
            });
        }
        window.renovarTokenFirebase = renovarTokenFirebase;

        // Renova de forma proativa a cada 45min (token expira em ~60min) enquanto o painel estiver
        // aberto, e também logo ao entrar/retomar sessão (cobre o caso de reload de página com um

        const INTERVALO_RENOVACAO_TOKEN_MS = 45 * 60 * 1000;
        let __renovacaoTokenTimer = null;
        function iniciarRenovacaoTokenPeriodica() {
            renovarTokenFirebase();
            if (__renovacaoTokenTimer) clearInterval(__renovacaoTokenTimer);

        // acima) - por isso o scroll precisa ser feito no contentWindow do iframe, nao em window/document
        // daqui de fora. CONFIRMADO por inspecao: dentro do painel quem rola de verdade e o <body>
        // (overflow-y:auto), nao o <html>/window - contentWindow.scrollTo() sozinho nao move a tela
        // visivel. Seta os 3 alvos possiveis (scrollTo do window + scrollTop de html e body) pra
        // cobrir qualquer um que seja o container real, sem depender de qual exatamente é.
        // ATUALIZADO 09/08/2026 (pedido do usuario: home vira tela exclusiva, "pra voltar pode usar o
        // ponto que ja tem hoje que retorna pro icone painel de controle"): antes so rolava a pagina
        // pro topo (o conteudo da aba atual continuava visivel logo abaixo do resumo). Agora chama
        // irParaPrimeiraSecao('home') dentro do iframe - mesma funcao que ja troca de aba pros outros
        // 5 destinos (showMaster + scroll), reaproveitada aqui pra "voltar" tambem trocar de pane de
        // verdade, escondendo o conteudo da aba anterior, nao so rolar por cima dele. Fallback pro
        // scroll antigo se a funcao ainda nao existir (HTML em cache antigo, deploy no meio do caminho).
        function scrollPainelParaTopo(){
            const iframe = document.getElementById('mainIframe');
            if(!iframe || !iframe.contentWindow) return;
            const win = iframe.contentWindow;
            if(typeof win.irParaPrimeiraSecao === 'function'){
                win.irParaPrimeiraSecao('home');
                return;
            }
            const doc = win.document;
            if(doc && doc.body && doc.body.scrollTo){ doc.body.scrollTo({ top: 0, behavior: 'smooth' }); }
            if(doc && doc.body) doc.body.scrollTop = 0;
            if(doc && doc.documentElement) doc.documentElement.scrollTop = 0;
            win.scrollTo({ top: 0, behavior: 'smooth' });
        }
        const brandLogo = document.getElementById('brandLogo');
        if(brandLogo){
            brandLogo.addEventListener('click', scrollPainelParaTopo);
            brandLogo.addEventListener('keydown', e => {
                if(e.key === 'Enter' || e.key === ' '){ e.preventDefault(); scrollPainelParaTopo(); }
            });
        }

        document.getElementById('email').addEventListener('keypress', e => {
            if (e.key === 'Enter') login();
        });
        document.getElementById('password').addEventListener('keypress', e => {
            if (e.key === 'Enter') login();
        });

        // VERIFICAR SE JÁ ESTÁ LOGADO
        // CORRIGIDO 15/08/2026 (achado de auditoria: sessionStorage.getItem() sem try/catch, ao
        // contrário do padrão já usado em outros pontos deste mesmo arquivo — em navegador/perfil
        // com storage desabilitado por política, isso lançaria exceção não capturada dentro do
        // listener de load, travando o usuário na tela de login mesmo já logado).
        window.addEventListener('load', () => {
            let auth = null;
            try { auth = sessionStorage.getItem('auth'); } catch (e) { auth = null; }
            if (auth) {
                try {
                    window.authObj = JSON.parse(auth);
                    const email = window.authObj.email || 'usuário';
                    showDashboard(email);
                } catch (e) {
                    showLoginScreen();
                }
            }
        });
    </script>
</body>
</html>
