<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Expires" content="0">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sistema Wallace Lira - Login</title>

    <link rel="icon" type="image/png" sizes="32x32" href="assets/images/favicon-32.png">
    <link rel="icon" type="image/png" sizes="192x192" href="assets/images/favicon-192.png">
    <link rel="apple-touch-icon" href="assets/images/apple-touch-icon.png">
    
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            background: #0b0c0e;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        #loginScreen {
            background: #16181b;
            border: 1px solid #2a2d31;
            border-radius: 12px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.5);
            padding: 40px;
            max-width: 400px;
            width: 100%;
        }

        #loginScreen h1 {
            text-align: center;
            color: #e8e6df;
            margin-bottom: 30px;
            font-size: 24px;
        }

        .form-group {
            margin-bottom: 20px;
        }

        .form-group label {
            display: block;
            margin-bottom: 8px;
            color: #a9a79f;
            font-weight: 500;
        }

        .form-group input {
            width: 100%;
            padding: 12px;
            background: #1d2024;
            border: 1px solid #2a2d31;
            border-radius: 6px;
            color: #e8e6df;
            font-size: 14px;
        }

        .form-group input::placeholder {
            color: #6f6d66;
        }

        .form-group input:focus {
            outline: none;
            border-color: #3987e5;
            box-shadow: 0 0 0 3px rgba(57, 135, 229, 0.15);
        }

        /* NOVO 01/08/2026: botao de esconder valores - antes era emoji fixo que nunca trocava
           (bug estrutural: a funcao que trocava o icone rodava dentro do iframe, nao alcancava
           este botao que mora aqui fora). Agora 2 icones SVG (olho aberto/fechado, mesmo traco
           do botao Sair ao lado) com transicao suave de opacidade+escala+rotacao. */
        .eye-toggle-btn {
            position: relative;
            background: rgba(255,255,255,0.03);
            border: 1px solid rgba(255,255,255,0.12);
            border-radius: 50%;
            width: 34px;
            height: 34px;
            cursor: pointer;
            color: #a9a79f;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            transition: border-color 0.2s ease, background-color 0.2s ease, transform 0.15s ease, color 0.2s ease, box-shadow 0.2s ease;
        }
        .eye-toggle-btn:hover {
            border-color: rgba(57, 135, 229, 0.55);
            background: rgba(57, 135, 229, 0.1);
            color: #8ab4f8;
            transform: translateY(-1px);
            box-shadow: 0 4px 14px rgba(57, 135, 229, 0.18);
        }
        .eye-toggle-btn:active {
            transform: translateY(0) scale(0.94);
        }
        .eye-toggle-btn.ativo {
            background: rgba(57, 135, 229, 0.16);
            border-color: #3987e5;
            color: #3987e5;
        }
        .eye-icon {
            position: absolute;
            transition: opacity 0.25s ease, transform 0.25s ease;
        }
        .eye-open {
            opacity: 1;
            transform: scale(1) rotate(0deg);
        }
        .eye-closed {
            opacity: 0;
            transform: scale(0.4) rotate(-25deg);
        }
        .eye-toggle-btn.ativo .eye-open {
            opacity: 0;
            transform: scale(0.4) rotate(25deg);
        }
        .eye-toggle-btn.ativo .eye-closed {
            opacity: 1;
            transform: scale(1) rotate(0deg);
        }

        button {
            width: 100%;
            padding: 12px;
            background: #3987e5;
            color: white;
            border: none;
            border-radius: 6px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.15s;
        }

        button:hover:not(:disabled) {
            background: #2d70c4;
        }

        button:disabled {
            background: #2a2d31;
            color: #6f6d66;
            cursor: not-allowed;
        }

        .error-message {
            color: #ff8783;
            font-size: 14px;
            margin-top: 15px;
            padding: 10px;
            background: rgba(226, 85, 79, 0.12);
            border: 1px solid rgba(226, 85, 79, 0.3);
            border-radius: 6px;
            display: none;
            text-align: center;
        }

        #dashboardScreen {
            display: none;
            width: 100%;
            height: 100vh;
            flex-direction: column;
        }

        #dashboardScreen header {
            background: linear-gradient(180deg, #15171c 0%, #0e1013 100%);
            color: #eceae4;
            padding: 11px 24px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid rgba(255,255,255,0.06);
            position: relative;
            min-height: 56px;
            box-shadow: 0 1px 0 rgba(0,0,0,0.4);
        }

        #dashboardScreen header::after {
            content: '';
            position: absolute;
            left: 0; right: 0; bottom: -1px;
            height: 1px;
            background: linear-gradient(90deg, rgba(57,135,229,0.55) 0%, rgba(144,133,233,0.4) 45%, rgba(57,135,229,0) 100%);
        }

        #dashboardScreen header .brand {
            display: flex;
            align-items: center;
            gap: 11px;
            cursor: pointer;
            border-radius: 8px;
            transition: opacity .15s ease;
        }
        #dashboardScreen header .brand:hover {
            opacity: 0.82;
        }

        #dashboardScreen header .brand-icon {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            width: 36px;
            height: 36px;
            font-size: 18px;
            border-radius: 10px;
            background: linear-gradient(135deg, rgba(57,135,229,0.22), rgba(144,133,233,0.16));
            border: 1px solid rgba(255,255,255,0.09);
            box-shadow: inset 0 1px 0 rgba(255,255,255,0.06);
            flex-shrink: 0;
        }

        #dashboardScreen header .brand-text {
            display: flex;
            flex-direction: column;
            gap: 1px;
            line-height: 1.15;
        }

        #dashboardScreen header h1 {
            font-size: 15.5px;
            font-weight: 700;
            letter-spacing: 0.2px;
            color: #f3f1ec;
        }
        #dashboardScreen header .brand-name-full {
            display: none;
        }
        #dashboardScreen header .brand-name-short {
            display: inline;
        }

        #dashboardScreen header .brand-sub {
            font-size: 10px;
            font-weight: 600;
            letter-spacing: 0.6px;
            text-transform: uppercase;
            color: #6f9bd8;
        }

        #dashboardScreen header .user-info {
            display: flex;
            gap: 12px;
            align-items: center;
        }

        /* NOVO 10/08/2026 (pedido do usuário: "mais destaque nos botões, pode reorganizar"):
           agrupa busca+chip+ações como 1 bloco à direita — header vira só 2 filhos (.brand e este
           grupo), garante alinhamento/gap consistentes em qualquer largura, sem depender de
           justify-content:space-between espalhar 4 filhos de forma instável. */
        #dashboardScreen header .header-actions-group {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        #dashboardScreen header .header-search-wrap {
            position: relative;
            flex: 0 1 320px;
            min-width: 120px;
            display: flex;
            align-items: center;
        }
        #dashboardScreen header .header-search-icon {
            position: absolute;
            left: 11px;
            top: 50%;
            transform: translateY(-50%);
            color: #6f9bd8;
            pointer-events: none;
        }
        #dashboardScreen header .header-search-input {
            width: 100%;
            background: rgba(57,135,229,0.07);
            border: 1px solid rgba(57,135,229,0.25);
            color: #eceae4;
            font-size: 12.5px;
            padding: 7px 10px 7px 30px;
            border-radius: 999px;
            outline: none;
            font-family: inherit;
            transition: border-color .15s ease, background-color .15s ease;
        }
        #dashboardScreen header .header-search-input:focus {
            border-color: rgba(57,135,229,0.55);
            background: rgba(255,255,255,0.08);
        }
        #dashboardScreen header .header-search-resultados {
            position: absolute;
            top: calc(100% + 6px);
            left: 0;
            width: 100%;
            min-width: 280px;
            background: #1d2024;
            border: 1px solid rgba(255,255,255,0.12);
            border-radius: 10px;
            overflow: hidden;
            box-shadow: 0 8px 24px rgba(0,0,0,0.4);
            z-index: 50;
        }
        #dashboardScreen header .header-search-item {
            padding: 8px 12px;
            font-size: 12.5px;
            color: #c8c6bf;
            cursor: pointer;
            border-bottom: 1px solid rgba(255,255,255,0.06);
        }
        #dashboardScreen header .header-search-item:last-child { border-bottom: none; }
        #dashboardScreen header .header-search-item:hover { background: rgba(57,135,229,0.12); color: #eceae4; }
        #dashboardScreen header .header-search-item .hs-sub {
            display: block;
            font-size: 10.5px;
            color: #8b8a84;
            margin-top: 2px;
        }
        #dashboardScreen header .header-search-vazio {
            padding: 10px 12px;
            font-size: 12px;
            color: #8b8a84;
        }
        /* CORRIGIDO 10/08/2026 (pedido do usuário: "o de pesquisa precisa ser um pouco mais
           pronunciado que os outros") - tom de acento (mesmo azul da marca) já em repouso, não só
           no hover, pra se diferenciar visualmente de olho/sair (ghost buttons neutros). */
        #dashboardScreen header .header-search-toggle-btn {
            display: none;
            align-items: center;
            justify-content: center;
            width: 34px;
            height: 34px;
            border-radius: 999px;
            background: rgba(57,135,229,0.16);
            border: 1px solid rgba(57,135,229,0.45);
            color: #8ab4f8;
            cursor: pointer;
            flex-shrink: 0;
            transition: border-color 0.2s ease, background-color 0.2s ease, transform 0.15s ease, box-shadow 0.2s ease;
        }
        #dashboardScreen header .header-search-toggle-btn:hover {
            background: rgba(57,135,229,0.26);
            border-color: rgba(57,135,229,0.7);
            transform: translateY(-1px);
            box-shadow: 0 4px 14px rgba(57,135,229,0.22);
        }
        #dashboardScreen header .header-search-toggle-btn:active {
            transform: translateY(0) scale(0.94);
        }
        @media (max-width: 780px) {
            #dashboardScreen header .header-search-wrap { display: none; }
            #dashboardScreen header .header-search-toggle-btn { display: flex; }
            #dashboardScreen header .header-search-wrap.mobile-open {
                display: flex;
                position: absolute;
                top: 100%;
                left: 0;
                right: 0;
                margin: 0;
                padding: 8px 14px;
                background: #15171c;
                border-bottom: 1px solid rgba(255,255,255,0.1);
                box-shadow: 0 6px 14px rgba(0,0,0,0.35);
                z-index: 60;
                flex: none;
            }
            /* CORRIGIDO 10/08/2026 (pedido do usuário: "quando abre o campo pra pesquisa a lupa fica
               torta") - causa raiz: o wrap ganha padding:8px 14px só no overlay mobile, mas o ícone
               (position:absolute) usa o mesmo left:11px de sempre, relativo à borda do wrap — sem
               contar esse padding novo, o ícone ficava perto da própria borda/curva do pill em vez de
               centrado dentro do campo. Ajustado só pra este contexto (14px do padding + 11px original). */
            #dashboardScreen header .header-search-wrap.mobile-open .header-search-icon {
                left: 25px;
            }
        }

        #dashboardScreen header .user-chip {
            position: relative;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 0;
            border-radius: 50%;
            cursor: pointer;
        }
        /* NOVO 10/08/2026 (pedido do usuário: "quando passar o mouse ou clicar sobre a letra com a
           inicial, pode identificar que está logado com o email, bem sutil") - pill discreto que some
           sozinho, alternativa ao title="" (que não é confiável em toque no mobile). */
        #dashboardScreen header .user-email-tooltip {
            position: absolute;
            top: calc(100% + 8px);
            right: 0;
            background: #1d2024;
            border: 1px solid rgba(255,255,255,0.12);
            color: #c8c6bf;
            font-size: 11px;
            font-weight: 500;
            white-space: nowrap;
            padding: 5px 10px;
            border-radius: 7px;
            box-shadow: 0 4px 14px rgba(0,0,0,0.35);
            opacity: 0;
            pointer-events: none;
            transform: translateY(-3px);
            transition: opacity 0.15s ease, transform 0.15s ease;
            z-index: 70;
        }
        #dashboardScreen header .user-email-tooltip.visivel {
            opacity: 1;
            transform: translateY(0);
        }
        /* NOVO 10/08/2026 (pedido do usuário: avatar só com a inicial, "como sites modernos") -
           mesmo diâmetro (34px) dos outros botões circulares do cabeçalho (busca/olho/sair), pra
           ficar tudo alinhado na mesma "fileira de ícones" em vez do chip alongado com email inteiro. */
        #dashboardScreen header .user-avatar-initial {
            display: flex;
            align-items: center;
            justify-content: center;
            width: 34px;
            height: 34px;
            border-radius: 50%;
            background: linear-gradient(135deg, #3987e5, #9085e9);
            color: #fff;
            font-size: 13px;
            font-weight: 700;
            letter-spacing: 0;
            flex-shrink: 0;
        }

        #dashboardScreen header .header-divider {
            width: 1px;
            height: 28px;
            background: rgba(255,255,255,0.1);
        }

        #dashboardScreen header .header-actions {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        #dashboardScreen header .logout-btn {
            width: 34px;
            height: 34px;
            padding: 0;
            border-radius: 50%;
            background: rgba(255,255,255,0.03);
            border: 1px solid rgba(255,255,255,0.12);
            color: #a9a79f;
            font-size: 13px;
            line-height: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: border-color 0.2s ease, background-color 0.2s ease, transform 0.15s ease, color 0.2s ease, box-shadow 0.2s ease;
        }

        #dashboardScreen header .logout-btn:hover {
            background: rgba(226, 85, 79, 0.12);
            border-color: rgba(226, 85, 79, 0.55);
            color: #ff8783;
            transform: translateY(-1px);
            box-shadow: 0 4px 14px rgba(226, 85, 79, 0.18);
        }

        #dashboardScreen header .logout-btn:active {
            transform: translateY(0) scale(0.94);
        }

        @media (max-width: 560px) {
            #dashboardScreen header {
                padding: 8px 14px;
                min-height: 48px;
            }
            #dashboardScreen header .brand-icon {
                width: 30px;
                height: 30px;
                font-size: 15px;
                border-radius: 8px;
            }
            #dashboardScreen header h1 {
                font-size: 13px;
            }
            #dashboardScreen header .brand-sub {
                display: none;
            }
            #dashboardScreen header .brand-name-full {
                display: none;
            }
            #dashboardScreen header .brand-name-short {
                display: inline;
            }
            #dashboardScreen header .header-divider {
                display: none;
            }
            #dashboardScreen header .eye-toggle-btn,
            #dashboardScreen header .logout-btn,
            #dashboardScreen header .header-search-toggle-btn,
            #dashboardScreen header .user-avatar-initial {
                width: 28px;
                height: 28px;
                font-size: 11px;
            }
            /* CORRIGIDO 10/08/2026 (pedido do usuário: proporção/alinhamento perfeitos no mobile) -
               header-search-toggle-btn não fazia parte deste bloco antes, ficava 34px enquanto
               olho/sair encolhiam pra 28px — os 3 ícones agora encolhem juntos, mesma proporção. */
            #dashboardScreen header .header-actions-group {
                gap: 7px;
            }
            #dashboardScreen header .header-search-toggle-btn svg {
                width: 15px;
                height: 15px;
            }
            /* CORRIGIDO 10/08/2026 (achado do usuário via foto real do celular: "a lupa ficou quase
               invisível dentro do círculo") - a versão de repouso (fundo azul 16% opacidade, borda
               45%) simplesmente não tem contraste suficiente contra o fundo quase-preto do cabeçalho
               num círculo de só 28px - funcionava em telas maiores/mais de perto, não no celular. Só
               no mobile: fundo e borda mais fortes, ícone branco puro (era #8ab4f8, azul claro) em vez
               de herdar a cor de acento. */
            #dashboardScreen header .header-search-toggle-btn {
                background: rgba(57,135,229,0.32);
                border-color: rgba(57,135,229,0.75);
                color: #ffffff;
            }
        }

        #dashboardContent {
            flex: 1;
            overflow: hidden;
        }
        #dashboardContent iframe {
            width: 100%;
            height: 100%;
            border: none;
            display: block;
        }
    </style>
</head>
<body>
    <div id="loginScreen">
        <h1>🔐 Sistema Wallace Lira</h1>
        <div class="form-group">
            <label for="email">Email</label>
            <input type="email" id="email" placeholder="seu@email.com">
        </div>
        <div class="form-group">
            <label for="password">Senha</label>
            <input type="password" id="password" placeholder="Sua senha">
        </div>
        <button id="loginBtn">Entrar</button>
        <div class="error-message" id="errorMessage"></div>
    </div>

    <div id="dashboardScreen">
        <header>
            <div class="brand" id="brandLogo" role="button" tabindex="0" title="Voltar ao Painel">
                <span class="brand-icon" aria-hidden="true">📊</span>
                <div class="brand-text">
                    <h1><span class="brand-name-full">Sistema Wallace Lira</span><span class="brand-name-short">Wallace Lira</span></h1>
                    <span class="brand-sub">Painel Financeiro</span>
                </div>
            </div>
            <!-- NOVO 09/08/2026 (pedido do usuario: "lupa de pesquisa na barra de cima, pra aparecer
                 sempre"): campo real vive AQUI, fora do #mainIframe - so assim fica na mesma barra
                 fixa do email/olho/sair (um sticky DENTRO do iframe, tentativa anterior, nao contava
                 como "barra de cima" pro usuario, e um dropdown position:fixed dentro do iframe nunca
                 conseguiria pintar por cima da barra externa mesmo se o campo ficasse la dentro -
                 iframe nao "vaza" position:fixed pra fora da propria caixa). Zero logica de busca
                 duplicada: buscaGlobalDados()/buscaGlobalNavegar() (expostas em dashboard-navegacao.js,
                 dentro do iframe) reaproveitam 100% do indice/match/ordenacao ja existentes - aqui so
                 desenha o dropdown e repassa o clique de volta pro iframe navegar. -->
            <!-- CORRIGIDO 09/08/2026 (achado do usuário: "no mobile falta a lupa de pesquisa") - a
                 busca inteira sumia abaixo de 780px (regra antiga só escondia, sem alternativa).
                 Botão só-ícone abaixo, visível só no mobile (ver CSS), abre o mesmo campo/dropdown
                 de sempre como um overlay - zero lógica de busca nova, só toggle de visibilidade. -->
            <!-- CORRIGIDO 10/08/2026 (pedido do usuário: "mais destaque nos botões, pode reorganizar,
                 busca mais pronunciada, cuidado com o mobile") - agrupador único (.header-actions-group)
                 pra busca+chip+ações ficarem sempre juntos como 1 bloco à direita, em vez de 3 filhos
                 soltos disputando espaço via justify-content:space-between do header (o que deixava a
                 proporção instável entre larguras de tela). Zero mudança de IDs/onclick/lógica de busca. -->
            <div class="header-actions-group">
                <button type="button" id="headerSearchToggleBtn" class="header-search-toggle-btn" onclick="toggleHeaderSearchMobile()" aria-label="Buscar" title="Buscar">
                    <svg viewBox="0 0 24 24" width="17" height="17" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                        <circle cx="11" cy="11" r="8"></circle>
                        <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
                    </svg>
                </button>
                <div class="header-search-wrap" id="headerSearchWrap">
                    <svg viewBox="0 0 24 24" width="13" height="13" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="header-search-icon" aria-hidden="true">
                        <circle cx="11" cy="11" r="8"></circle>
                        <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
                    </svg>
                    <input type="text" id="headerSearchInput" class="header-search-input" placeholder="Buscar…" autocomplete="off">
                    <div id="headerSearchResultados" class="header-search-resultados" style="display:none"></div>
                </div>
                <div class="user-info">
                    <!-- CORRIGIDO 10/08/2026 (pedido do usuário: "o bonequinho de login pode ficar só a
                         inicial de quem acessou, não o email inteiro, aí pode ficar no canto, como
                         sites modernos") - troca ícone genérico + email completo por avatar circular
                         com a inicial (mesmo padrão Gmail/Google Workspace) - email completo continua
                         acessível via title="" (hover/long-press), nada de informação perdida. -->
                    <!-- NOVO 10/08/2026 (pedido do usuário: "quando passar o mouse ou clicar sobre a
                         letra com a inicial, pode identificar que está logado com o email, bem sutil")
                         - title="" já cobre hover em desktop; tooltip próprio abaixo cobre toque no
                         mobile (title/long-press não é confiável em touch) e também funciona no clique
                         do mouse. -->
                    <div class="user-chip" id="userChip" title="">
                        <span id="userAvatarInitial" class="user-avatar-initial"></span>
                        <span id="userEmailTooltip" class="user-email-tooltip"></span>
                    </div>
                    <div class="header-divider" aria-hidden="true"></div>
                    <div class="header-actions">
                        <button id="btnEsconderValoresHeader" onclick="toggleEsconderValoresHeader()" title="Esconder/mostrar valores (modo apresentação)" aria-label="Esconder valores" class="eye-toggle-btn">
                            <svg class="eye-icon eye-open" viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8Z"></path>
                                <circle cx="12" cy="12" r="3"></circle>
                            </svg>
                            <svg class="eye-icon eye-closed" viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">

    <script>
        // NOVO 01/08/2026 (V252, pedido do usuario): botao de esconder valores movido pra barra
        // superior fixa (fora do iframe) - fica acessivel ANTES de rolar/ver qualquer valor, em vez
        // de estar dentro do painel (so aparecia depois de carregar o conteudo sensivel).
        // AJUSTADO 04/08/2026 (parte 76, pedido do usuario: "quando o olho de nublar for ativado, so
        // consegue desativar via senha"): ATIVAR o blur continua instantaneo (sem atrito - precisa ser
        // rapido pra esconder valores na hora que alguem chega perto). DESATIVAR agora exige reautenticar
        // com a senha real da conta (mesmo endpoint Firebase do login, signInWithPassword) - nao um PIN
        // novo/paralelo, que seria mais uma senha pra lembrar e mais facil de descobrir por tentativa.
        // Usa window.authObj.email (ja setado no login) + reusa firebaseAuth() ja existente.
        function toggleEsconderValoresHeader() {
            const iframe = document.getElementById('mainIframe');
            const btn = document.getElementById('btnEsconderValoresHeader');
            if (!iframe || !iframe.contentWindow) return;
            const estaAtivoAgora = btn && btn.classList.contains('ativo');
            if (estaAtivoAgora) {
                abrirModalSenhaEsconderValores();
                return;
            }
            try {
                const ativo = iframe.contentWindow.toggleEsconderValores();
                if (btn) btn.classList.toggle('ativo', !!ativo);
            } catch (e) {
                console.error('Nao foi possivel alternar valores no painel:', e);
            }
        }

        function abrirModalSenhaEsconderValores() {
            const modal = document.getElementById('modalSenhaEsconderValores');
            const input = document.getElementById('senhaEsconderValoresInput');
            const erro = document.getElementById('senhaEsconderValoresErro');
            if (!modal) return;
            erro.style.display = 'none';
            input.value = '';
            modal.style.display = 'flex';
            setTimeout(() => input.focus(), 50);
        }

        function fecharModalSenhaEsconderValores() {
            const modal = document.getElementById('modalSenhaEsconderValores');
            if (modal) modal.style.display = 'none';
        }

        // AJUSTADO 04/08/2026 (parte 77, pedido do usuario: "crie o pin 1322 para desbloquear o
        // nublado" - troca a reautenticacao por senha completa da parte 76 por um PIN numerico
        // dedicado, mais rapido de digitar quando alguem esta querendo ver o painel rapido).
        const PIN_DESBLOQUEIO_VALORES = '1322';
        function confirmarSenhaEsconderValores() {
            const input = document.getElementById('senhaEsconderValoresInput');
            const erro = document.getElementById('senhaEsconderValoresErro');
            const pin = (input.value || '').trim();
            if (pin !== PIN_DESBLOQUEIO_VALORES) {
                erro.textContent = 'PIN incorreto.';
                erro.style.display = 'block';
                input.value = '';
                input.focus();
                return;
            }
            const iframe = document.getElementById('mainIframe');
            const btn = document.getElementById('btnEsconderValoresHeader');
            if (iframe && iframe.contentWindow) {
                const ativo = iframe.contentWindow.toggleEsconderValores();
                if (btn) btn.classList.toggle('ativo', !!ativo);
            }
            fecharModalSenhaEsconderValores();
        }

        // NOVO 01/08/2026: sincroniza o icone do botao com a preferencia ja salva - localStorage e
        // compartilhado entre este documento e o iframe (mesma origem/dominio), entao nao precisa
        // esperar o iframe carregar pra saber o estado.
        onDomPronto2(function(){
            try {
                const btn = document.getElementById('btnEsconderValoresHeader');
                if (btn && localStorage.getItem('wallace_esconder_valores') === '1') {
                    btn.classList.add('ativo');
                }
            } catch (e) {}
        });
        function onDomPronto2(fn){
            if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', fn);
            else fn();
        }

        // NOVO 09/08/2026 (pedido do usuario: busca na barra fixa de fora do iframe, sempre visivel).
        // Mesmo padrao ja usado em toggleEsconderValoresHeader() acima - chama funcoes expostas dentro
        // do iframe via contentWindow (mesma origem). buscaGlobalDados()/buscaGlobalNavegar() (ver
        // dashboard-navegacao.js) reaproveitam 100% do indice/match/ordenacao da busca original - aqui
        // so desenha o dropdown (que precisa viver FORA do iframe, porque position:fixed/absolute
        // dentro do iframe nunca pinta por cima da barra externa) e repassa cliques de volta.
        let _headerSearchDebounce = null;
        let _headerSearchUltimo = null; // guarda o ultimo {secoes,transacoes} pra saber o que o clique de cada item significa
        function headerSearchInput(valor){
            clearTimeout(_headerSearchDebounce);
            _headerSearchDebounce = setTimeout(() => headerSearchExecutar(valor), 200);
        }
        // NOVO 09/08/2026 (achado do usuario: "nao pesquisa mais nada", ficava preso em "Painel ainda
        // carregando..." mesmo com o painel ja de pe): dashboard-navegacao.js e um dos ULTIMOS arquivos
        // numa cadeia longa de scripts em sequencia dentro do iframe (app.js -> energia-solar.js ->
        // promocoes-financeengine.js -> so ENTAO os 6 modulos finais, dashboard-navegacao.js entre
        // eles) - pode terminar de carregar segundos DEPOIS dos badges "SISTEMA INTEGRO"/"V2 ATIVA"
        // aparecerem (esses vem de uma parte bem mais cedo do boot). Antes, um unico "nao esta pronto"
        // desistia na hora. Agora tenta de novo sozinho (ate 6s, a cada 400ms) e reexecuta a busca com
        // o que estiver no campo assim que a funcao aparecer - autocura, sem exigir que o usuario
        // retype.
        let _headerSearchAguardando = false;
        function _headerSearchIframeProntO(){
            const iframe = document.getElementById('mainIframe');
            return iframe && iframe.contentWindow && typeof iframe.contentWindow.buscaGlobalDados === 'function' ? iframe : null;
        }
        function _headerSearchEsperarEReexecutar(tentativasRestantes){
            const iframe = _headerSearchIframeProntO();
            if(iframe){
                _headerSearchAguardando = false;
                const input = document.getElementById('headerSearchInput');
                if(input && input.value.trim()) headerSearchExecutar(input.value);
                return;
            }
            if(tentativasRestantes <= 0){
                _headerSearchAguardando = false;
                const wrap = document.getElementById('headerSearchResultados');
                if(wrap) wrap.innerHTML = '<div class="header-search-vazio">Painel demorou demais pra carregar — tenta recarregar a página.</div>';
                console.error('headerSearch: buscaGlobalDados nunca ficou disponível no iframe depois de 6s de espera.');
                return;
            }
            setTimeout(() => _headerSearchEsperarEReexecutar(tentativasRestantes - 1), 400);
        }
        function headerSearchExecutar(valor){
            const termo = (valor || '').trim();
            const wrap = document.getElementById('headerSearchResultados');
            if(!wrap) return;
            if(!termo){ wrap.style.display = 'none'; wrap.innerHTML = ''; return; }
            const iframe = _headerSearchIframeProntO();
            if(!iframe){
                wrap.innerHTML = '<div class="header-search-vazio">Painel ainda carregando…</div>';
                wrap.style.display = 'block';
                if(!_headerSearchAguardando){
                    _headerSearchAguardando = true;
                    _headerSearchEsperarEReexecutar(15); // 15 x 400ms = ate 6s de espera
                }
                return;
            }
            let resultado;
            try { resultado = iframe.contentWindow.buscaGlobalDados(termo); }
            catch(e){ console.error('headerSearchExecutar: falha ao consultar busca do painel', e); return; }
            _headerSearchUltimo = resultado;
            const { secoes = [], transacoes = [] } = resultado || {};
            if(secoes.length === 0 && transacoes.length === 0){
                wrap.innerHTML = '<div class="header-search-vazio">Nada encontrado</div>';
                wrap.style.display = 'block';
                return;
            }
            wrap.innerHTML = secoes.map(s =>
                `<div class="header-search-item" onclick="headerSearchNavegar('secao',${s.idx})">${s.rotulo}</div>`
            ).join('') + transacoes.map(t =>
                `<div class="header-search-item" onclick="headerSearchNavegar('transacao',${t.idx})">`
                + `<strong>${t.tx}</strong> · ${t.nome} · <strong>${t.valor}</strong>`
                + `<span class="hs-sub">${t.data || ''} — ${t.livro}${t.obs ? ' — ' + t.obs : ''}</span></div>`
            ).join('');
            wrap.style.display = 'block';
        }
        function headerSearchNavegar(tipo, idx){
            const iframe = document.getElementById('mainIframe');
            if(iframe && iframe.contentWindow && typeof iframe.contentWindow.buscaGlobalNavegar === 'function'){
                try { iframe.contentWindow.buscaGlobalNavegar(tipo, idx); } catch(e){ console.error('headerSearchNavegar: falha ao navegar no painel', e); }
            }
            const wrap = document.getElementById('headerSearchResultados');
            const input = document.getElementById('headerSearchInput');
            if(wrap) wrap.style.display = 'none';
            if(input) input.value = '';
        }
        // CORRIGIDO 09/08/2026 (achado do usuário: "no mobile falta a lupa de pesquisa") - toggle
        // do botão só-ícone que aparece <780px; abre o mesmo #headerSearchWrap como overlay.
        function toggleHeaderSearchMobile(){
            const wrap = document.getElementById('headerSearchWrap');
            if(!wrap) return;
            const abrindo = !wrap.classList.contains('mobile-open');
            wrap.classList.toggle('mobile-open', abrindo);
            if(abrindo){
                const input = document.getElementById('headerSearchInput');
                if(input) setTimeout(() => input.focus(), 0);
            }
        }
        onDomPronto2(function(){
            const input = document.getElementById('headerSearchInput');
            if(input) input.addEventListener('input', (e) => headerSearchInput(e.target.value));
            document.addEventListener('click', (e) => {
                if(!e.target.closest('#headerSearchWrap') && !e.target.closest('#headerSearchToggleBtn')){
                    const wrap = document.getElementById('headerSearchResultados');
                    if(wrap) wrap.style.display = 'none';
                    const searchWrap = document.getElementById('headerSearchWrap');
                    if(searchWrap) searchWrap.classList.remove('mobile-open');
                }
            });
        });
    </script>

    <!-- CARREGAMENTO DIRETO DO FIREBASE SCRIPT GLOBAL -->
    <script>
        // Sem módulos ES6, usando callbacks diretos
        window.firebaseConfig = {
            apiKey: "AIzaSyCvXsD2v_AGx3vN3kM2z_uIllkRO-Lr2pc",
            authDomain: "sistema-wallace-lira.firebaseapp.com",
            projectId: "sistema-wallace-lira",
            storageBucket: "sistema-wallace-lira.firebasestorage.app",
            messagingSenderId: "648799873363",
            appId: "1:648799873363:web:28e6796ee70afc3a4b99a6"
        };

        window.authObj = null;

        // Função auxiliar para fazer fetch
        function firebaseAuth(email, password) {
            const url = "https://identitytoolkit.googleapis.com/v1/accounts:signInWithPassword?key=" + window.firebaseConfig.apiKey;
            
            return fetch(url, {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({
                    email: email,
                    password: password,
                    returnSecureToken: true
                })
            })
            .then(response => response.json())
            .then(data => {
                if (data.error) {
                    throw new Error(data.error.message);
                }
                return data;
            });
        }

        // LOGIN
        function login() {
            const email = document.getElementById('email').value.trim();
            const password = document.getElementById('password').value;
            const btn = document.getElementById('loginBtn');
            const errorDiv = document.getElementById('errorMessage');

            errorDiv.style.display = 'none';

            if (!email || !password) {
                showError('Preencha email e senha');
                return;
            }

            btn.disabled = true;
            btn.textContent = 'Entrando...';

            firebaseAuth(email, password)
                .then(response => {
                    console.log('✅ Login bem-sucedido');
                    window.authObj = response;
                    sessionStorage.setItem('auth', JSON.stringify(response));
                    showDashboard(email);
                })
                .catch(error => {
                    btn.disabled = false;
                    btn.textContent = 'Entrar';
                    
                    let msg = error.message || 'Erro ao fazer login';
                    if (msg.includes('INVALID_LOGIN_CREDENTIALS')) msg = 'Email ou senha incorretos';
                    if (msg.includes('USER_DISABLED')) msg = 'Usuário desativado';
                    
                    showError(msg);
                });
        }

        // MOSTRAR PAINEL
        function showDashboard(email) {
            document.getElementById('loginScreen').style.display = 'none';
            document.getElementById('dashboardScreen').style.display = 'flex';
            // CORRIGIDO 10/08/2026 (pedido do usuário: avatar só com a inicial, email completo só no
            // hover/long-press via title) - inicial vem do e-mail (nunca há nome cadastrado à parte).
            const inicial = (email || '?').trim().charAt(0).toUpperCase();
            document.getElementById('userAvatarInitial').textContent = inicial;
            document.getElementById('userChip').title = email || '';
            document.getElementById('userEmailTooltip').textContent = email || '';
            loadDashboard();
            iniciarMonitorInatividade();
        }

        // NOVO 10/08/2026 (pedido do usuário: "quando passar o mouse ou clicar sobre a letra com a
        // inicial, pode identificar que está logado com o email, bem sutil") - clique/toque alterna o
        // tooltip (funciona em qualquer dispositivo, ao contrário de title=""); fecha sozinho depois de
        // alguns segundos ou ao tocar fora, mesmo padrão já usado no dropdown de busca.
        (function(){
            const chip = document.getElementById('userChip');
            const tooltip = document.getElementById('userEmailTooltip');
            if(!chip || !tooltip) return;
            let timerFechar = null;
            const fechar = () => tooltip.classList.remove('visivel');
            chip.addEventListener('click', (ev) => {
                ev.stopPropagation();
                const abrindo = !tooltip.classList.contains('visivel');
                tooltip.classList.toggle('visivel', abrindo);
                clearTimeout(timerFechar);
                if(abrindo) timerFechar = setTimeout(fechar, 3000);
            });
            document.addEventListener('click', (ev) => { if(!chip.contains(ev.target)) fechar(); });
        })();

        // NOVO 07/08/2026 (pedido do usuário: "quero que o site bloqueie por inatividade... não
        // ficando aberto em algum computador"): desloga sozinho depois de 15min sem nenhuma
        // interação (mouse/teclado/toque/rolagem) - dado financeiro real, não pode ficar logado
        // pra sempre numa máquina compartilhada/esquecida. Reinicia o contador a cada evento;
        // dispara só uma vez (guarda __inatividadeTimer pra nunca empilhar timers duplicados).
        const TEMPO_INATIVIDADE_MS = 15 * 60 * 1000; // 15 minutos
        let __inatividadeTimer = null;
        let __monitorInatividadeAtivo = false;
        function resetarTimerInatividade() {
            if (__inatividadeTimer) clearTimeout(__inatividadeTimer);
            __inatividadeTimer = setTimeout(() => {
                console.log('Sessão encerrada por inatividade (15min sem uso).');
                logout();
            }, TEMPO_INATIVIDADE_MS);
        }
        function iniciarMonitorInatividade() {
            if (__monitorInatividadeAtivo) { resetarTimerInatividade(); return; }
            __monitorInatividadeAtivo = true;
            ['mousemove', 'mousedown', 'keydown', 'scroll', 'touchstart', 'wheel'].forEach(evento => {
                document.addEventListener(evento, resetarTimerInatividade, { passive: true });
            });
            resetarTimerInatividade();
        }
        function pararMonitorInatividade() {
            if (__inatividadeTimer) clearTimeout(__inatividadeTimer);
            __inatividadeTimer = null;
        }

        // MOSTRAR LOGIN
        function showLoginScreen() {
            document.getElementById('loginScreen').style.display = 'block';
            document.getElementById('dashboardScreen').style.display = 'none';
            document.getElementById('email').value = '';
            document.getElementById('password').value = '';
            // CORREÇÃO: reseta o botão de login, que ficava travado em "Entrando..." / disabled
            // após um login bem-sucedido anterior — isso impedia clicar em "Entrar" de novo depois do logout.
            const loginBtn = document.getElementById('loginBtn');
            loginBtn.disabled = false;
            loginBtn.textContent = 'Entrar';
            document.getElementById('errorMessage').style.display = 'none';
        }

        // CARREGAR PAINEL HTML (via iframe - preserva scripts, Chart.js e datas dinâmicas)
        function loadDashboard() {
            const content = document.getElementById('dashboardContent');
            content.innerHTML = '<p style="padding: 20px; text-align: center;">⏳ Carregando painel...</p>';

            const cacheBust = Date.now();
            // NOVO 09/08/2026 (pedido do usuario: "compartilhar link de uma aba especifica, ex.
            // solar"): repassa ?aba=... da URL externa (index.html) pro iframe interno, que le esse
            // mesmo parametro no proprio boot e chama showMaster() - ver Sistema_Wallace_Lira_Completo.html.
            const abaAlvo = new URLSearchParams(location.search).get('aba');
            let iframeSrc = 'Sistema_Wallace_Lira_Completo.html?v=' + cacheBust;
            if(abaAlvo) iframeSrc += '&aba=' + encodeURIComponent(abaAlvo);
            fetch('Sistema_Wallace_Lira_Completo.html?v=' + cacheBust, { method: 'HEAD', cache: 'no-store' })
                .then(r => {
                    if (!r.ok) throw new Error('Arquivo não encontrado (status ' + r.status + ')');
                    const iframe = document.createElement('iframe');
                    iframe.id = 'mainIframe';
                    iframe.src = iframeSrc;
                    iframe.title = 'Sistema Wallace Lira - Painel';
                    content.innerHTML = '';
                    content.appendChild(iframe);
                    console.log('✅ Painel carregado via iframe (scripts e datas dinâmicas ativos)');
                })
                .catch(error => {
                    console.error('❌ Erro:', error);
                    content.innerHTML = '<div style="padding: 40px; text-align: center; color: #e74c3c;"><h2>⚠️ Erro</h2><p>Arquivo "Sistema_Wallace_Lira_Completo.html" não encontrado</p></div>';
                });
        }

        // LOGOUT
        function logout() {
            pararMonitorInatividade();
            sessionStorage.removeItem('auth');
            window.authObj = null;
            document.getElementById('dashboardContent').innerHTML = '';
            showLoginScreen();
        }

        // ERRO
        function showError(msg) {
            const errorDiv = document.getElementById('errorMessage');
            errorDiv.textContent = msg;
            errorDiv.style.display = 'block';
            console.error('❌', msg);
        }

        // EVENTOS
        document.getElementById('loginBtn').addEventListener('click', login);
        document.getElementById('logoutBtn').addEventListener('click', logout);

        // NOVO 07/08/2026 (pedido do usuario: clicar na logo "Sistema Wallace Lira / Painel
        // Financeiro" volta pro topo do painel): o painel real mora dentro do #mainIframe (a pagina
        // externa/index.html nao rola, so o iframe rola por dentro - ver #dashboardContent{overflow:hidden}
        // acima) - por isso o scroll precisa ser feito no contentWindow do iframe, nao em window/document
        // daqui de fora. CONFIRMADO por inspecao: dentro do painel quem rola de verdade e o <body>
        // (overflow-y:auto), nao o <html>/window - contentWindow.scrollTo() sozinho nao move a tela
        // visivel. Seta os 3 alvos possiveis (scrollTo do window + scrollTop de html e body) pra
        // cobrir qualquer um que seja o container real, sem depender de qual exatamente é.
        // ATUALIZADO 09/08/2026 (pedido do usuario: home vira tela exclusiva, "pra voltar pode usar o
        // ponto que ja tem hoje que retorna pro icone painel de controle"): antes so rolava a pagina
        // pro topo (o conteudo da aba atual continuava visivel logo abaixo do resumo). Agora chama
        // irParaPrimeiraSecao('home') dentro do iframe - mesma funcao que ja troca de aba pros outros
        // 5 destinos (showMaster + scroll), reaproveitada aqui pra "voltar" tambem trocar de pane de
        // verdade, escondendo o conteudo da aba anterior, nao so rolar por cima dele. Fallback pro
        // scroll antigo se a funcao ainda nao existir (HTML em cache antigo, deploy no meio do caminho).
        function scrollPainelParaTopo(){
            const iframe = document.getElementById('mainIframe');
            if(!iframe || !iframe.contentWindow) return;
            const win = iframe.contentWindow;
            if(typeof win.irParaPrimeiraSecao === 'function'){
                win.irParaPrimeiraSecao('home');
                return;
            }
            const doc = win.document;
            if(doc && doc.body && doc.body.scrollTo){ doc.body.scrollTo({ top: 0, behavior: 'smooth' }); }
            if(doc && doc.body) doc.body.scrollTop = 0;
            if(doc && doc.documentElement) doc.documentElement.scrollTop = 0;
            win.scrollTo({ top: 0, behavior: 'smooth' });
        }
        const brandLogo = document.getElementById('brandLogo');
        if(brandLogo){
            brandLogo.addEventListener('click', scrollPainelParaTopo);
            brandLogo.addEventListener('keydown', e => {
                if(e.key === 'Enter' || e.key === ' '){ e.preventDefault(); scrollPainelParaTopo(); }
            });
        }

        document.getElementById('email').addEventListener('keypress', e => {
            if (e.key === 'Enter') login();
        });
        document.getElementById('password').addEventListener('keypress', e => {
            if (e.key === 'Enter') login();
        });

        // VERIFICAR SE JÁ ESTÁ LOGADO
        window.addEventListener('load', () => {
            const auth = sessionStorage.getItem('auth');
            if (auth) {
                try {
                    window.authObj = JSON.parse(auth);
                    const email = window.authObj.email || 'usuário';
                    showDashboard(email);
                } catch (e) {
                    showLoginScreen();
                }
            }
        });
    </script>
</body>
</html>
