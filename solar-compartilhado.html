const DIA_LEITURA_GD = 8; // dia da leitura/fechamento da GD (Casa da Mãe, onde fica a usina)

function offsetMesesCicloGD(dataRef){
  const hoje = dataRef ? new Date(dataRef+'T00:00:00') : new Date();
  let ano = hoje.getFullYear(), mes = hoje.getMonth()+1;
  if(hoje.getDate() >= DIA_LEITURA_GD){ mes += 1; if(mes > 12){ mes = 1; ano += 1; } }
  return (ano-ANCHOR_ENERGIA_ANO)*12 + (mes-ANCHOR_ENERGIA_MES);
}
function calcularDiasRestantesGD(diaLeituraAlvo){
  const hj = new Date();
  const hojeSoData = new Date(hj.getFullYear(), hj.getMonth(), hj.getDate());
  let proxima = new Date(hj.getFullYear(), hj.getMonth(), diaLeituraAlvo);
  if(proxima <= hojeSoData) proxima = new Date(hj.getFullYear(), hj.getMonth()+1, diaLeituraAlvo);
  return { dias: Math.max(1, Math.round((proxima-hojeSoData)/86400000)), data: proxima };
}

  const deficitPct = (mediaNecessaria-mediaRealizada)/mediaNecessaria;
  if(deficitPct < 0.10) return {emoji:'🟡', texto:'Atenção', cor:'var(--amber)'};
  return {emoji:'🔴', texto:'Atrasado', cor:'var(--red)'};
}

// Cópia deliberada (mesmo padrão da tarifa/consumo acima) de src/solar/vars-energia-solar.js —
// `solarConsumoMaeAnoAnterior`, consumo histórico real (12 faturas Energisa) da Casa da Mãe (unidade
// geradora). Usado SÓ dentro da projeção abaixo, pra estimar quanto a casa consumiu nos dias desde a
// última leitura manual — mesmo array, mesma média, do painel privado (graficos-cenarios-lazy.js,
// `consumoMedioMensalMaeChart`). Não confundir com CONSUMO_DIARIO_MAE_KWH acima (1572/213=7,38
// kWh/dia, usado só como linha de referência no gráfico de geração diária) — são duas estimativas de
// consumo da mesma casa, propositalmente separadas: aqui precisa ser BIT A BIT igual ao painel
// privado pra não reintroduzir a divergência que este comentário está corrigindo.
const SOLAR_CONSUMO_MAE_ANO_ANTERIOR = [171,172,174,175,177,168,201,270,242,210,215,266]; // Mai/25..Abr/26 kWh

// NOVO 14/08/2026 (correção da divergência Fluxo 2, ver comentário acima) — reimplementação bit a
// bit da projeção do painel privado (graficos-cenarios-lazy.js linhas ~1384-1416,
// `saldoTotalEstimadoChart`): soma a geração diária REAL do robô SAJ (quando existe pra aquele dia)
// ou a média histórica de geração/dia (quando não existe ainda) pra cada dia desde a última leitura
// manual até hoje, subtrai o consumo médio estimado da Casa da Mãe nesses mesmos dias, e soma tudo
// ao crédito líquido da última leitura manual (exportado-importado). `ultima` = última leitura de
// `dados.leituras` (mesmo objeto já usado no resto da página); `geracaoDiaria` = `dados.geracaoDiaria`
// (mesmo array da RPC). Retorna null se não há leitura ou geração acumulada ainda (mesma condição de
// guarda do painel privado); cai pro crédito líquido cru (sem projeção) se a última leitura já é de
// hoje (nada a projetar).
function calcularSaldoLiquidoProjetadoHoje(ultima, geracaoDiaria){
  if(!ultima || ultima.geracaoAcumulada == null) return null;
  const creditoLiquidoUltimaLeitura = Math.round((ultima.leitura103 - ultima.leitura03) * 100) / 100;
  const hoje = new Date();
  const hojeSoData = new Date(Date.UTC(hoje.getFullYear(), hoje.getMonth(), hoje.getDate()));
  const dataUltimaLeitura = new Date(ultima.data);
  const diasDesdeLeitura = Math.max(0, Math.round((hojeSoData - dataUltimaLeitura) / 86400000));
  if(diasDesdeLeitura <= 0) return creditoLiquidoUltimaLeitura;
  const diasDesdeAtivacao = Math.round((dataUltimaLeitura - new Date(SOLAR_DATA_ATIVACAO)) / 86400000);
  const geracaoMediaDiaria = diasDesdeAtivacao > 0 ? ultima.geracaoAcumulada / diasDesdeAtivacao : 0;
  const consumoMedioMensalMae = SOLAR_CONSUMO_MAE_ANO_ANTERIOR.reduce((s,v)=>s+v,0) / SOLAR_CONSUMO_MAE_ANO_ANTERIOR.length;
  const consumoMedioDiarioMae = consumoMedioMensalMae / 30;
  const diariosPorDataMap = {};
  (geracaoDiaria || []).forEach(r => { diariosPorDataMap[r.data] = Number(r.kwh); });
  let geracaoEstimadaTotalPeriodo = 0;
  for(let d = 1; d <= diasDesdeLeitura; d++){
    const dataDoDia = new Date(dataUltimaLeitura);
    dataDoDia.setDate(dataDoDia.getDate() + d);
    const chaveISO = dataDoDia.toISOString().slice(0,10);
    geracaoEstimadaTotalPeriodo += (diariosPorDataMap[chaveISO] != null) ? diariosPorDataMap[chaveISO] : geracaoMediaDiaria;
  }
  return Math.round((creditoLiquidoUltimaLeitura + geracaoEstimadaTotalPeriodo - diasDesdeLeitura * consumoMedioDiarioMae) * 100) / 100;
}

    dependenciaPct = consumoTotalCasa > 0 ? Math.round((importadoAcum / consumoTotalCasa) * 1000) / 10 : 0;
    exportacaoDaGeracaoPct = geracaoAcum > 0 ? Math.round((exportadoAcum / geracaoAcum) * 1000) / 10 : 0;

    economiaEstimada = Math.round((consumoDiretoAcum * TARIFA_RS_POR_KWH + exportadoAcum * (TARIFA_RS_POR_KWH - FIO_B_RS_POR_KWH)) * 100) / 100;
    valorKwhGerado = TARIFA_RS_POR_KWH;

    const diasDesdeAtivacao = Math.max(1, Math.round((Date.now() - new Date(SOLAR_DATA_ATIVACAO).getTime()) / 86400000));
    const economiaAnualEstimada = (economiaEstimada / diasDesdeAtivacao) * 365;

  const OFFSET_GD_HOJE = Math.max(0, Math.min(11, offsetMesesCicloGD()));
  const METAS_ABERTO = { wallace: KWH_ANO_ANTERIOR_WALLACE[OFFSET_GD_HOJE], wellida: CONSUMO_MENSAL_IRMA[OFFSET_GD_HOJE] };

  const saldoLiquidoProjetadoHoje = calcularSaldoLiquidoProjetadoHoje(ultima, geracaoDiaria);
  let fluxo2 = null;
  if(ciclo && saldoLiquidoProjetadoHoje!=null && ciclo.baseline_kwh!=null && ciclo.rateio_wallace_pct!=null){
    const baselineKwh = Number(ciclo.baseline_kwh);

    const creditoIrmaAtual = Math.round(creditoLiquidoCiclo * rateioIrma * 100) / 100;
    // CORRIGIDO 14/08/2026: mesmo ajuste de fuso (Brasília, -3h) do painel privado
    // (`hojeBrasilia = new Date(Date.now() - 3*3600*1000)`, graficos-cenarios-lazy.js ~linha 2100) —
    // sem isso, "dias desde o início do ciclo" podia ficar 1 dia à frente/atrás do painel privado
    // perto da virada de dia UTC, distorcendo Média atual/Previsão de fechamento.
    const hojeBrasiliaMs = Date.now() - 3*3600*1000;
    const diasDesdeInicioCiclo = Math.max(0, Math.round((hojeBrasiliaMs - new Date(ciclo.data_inicio).getTime()) / 86400000));
    const { dias: diasRestantesGD, data: proximoFechamentoGD } = calcularDiasRestantesGD(DIA_LEITURA_GD);
    const periodoTxt = fmtData(ciclo.data_inicio) + ' → ' + proximoFechamentoGD.toLocaleDateString('pt-BR');

    function montarPrevisao(meta, creditoAtual, corBarra, rateioTxt){
      const creditoRestante = Math.round((meta-creditoAtual)*100)/100;
      const mediaNecessaria = diasRestantesGD>0 ? Math.round((creditoRestante/diasRestantesGD)*10)/10 : 0;
      const mediaRealizada = diasDesdeInicioCiclo>0 ? Math.round((creditoAtual/diasDesdeInicioCiclo)*10)/10 : 0;
      const previsao = Math.round((creditoAtual + mediaRealizada*diasRestantesGD)*10)/10;
      const status = calcularStatusGD(mediaRealizada, mediaNecessaria);
      const pct = Math.min(100, Math.max(0, Math.round(creditoAtual/meta*100)));
      return { meta, creditoAtual, pct, corBarra, rateioTxt, periodoTxt, diasRestantesGD, mediaNecessaria, mediaRealizada, previsao, status };
    }
    fluxo2 = {
      periodoTxt,
      wallace: montarPrevisao(METAS_ABERTO.wallace, creditoWallaceAtual, 'var(--green)', fmtPct(rateioWallace*100)),
      // CORRIGIDO 14/08/2026 (pedido do usuário: "a escala da minha irmã deve ser igual a minha verde
      // no fluxo em aberto") — cor da barra do Fluxo 2 (em formação) igual pras 2 casas; só o Fluxo 1
      // (fechado) mantém a distinção visual verde/âmbar (ali a cor tem significado: âmbar = ainda não
      // cobriu a meta, ver faltam>0 em montarFechado/montarBlocoCasa).
      wellida: montarPrevisao(METAS_ABERTO.wellida, creditoIrmaAtual, 'var(--green)', fmtPct(rateioIrma*100)),
    };
  }

  // ciclosFechados vem ORDER BY data_inicio ASC (RPC) — o mais recente é o último elemento.
  const ultimoFechado = ciclosFechados.length ? ciclosFechados[ciclosFechados.length-1] : null;
  // Dia do mês em que a fatura de cada casa fecha (mesmo texto fixo já usado no painel privado,
  // legend-note da seção 03 — Wallace=apartamento dia 21, Wellida=casa da mãe dia 8, mesmo dia do
  // fechamento da GD). Não vem da RPC, é fato fixo do contrato de cada UC.
  const DIA_FATURA = { wallace: 21, wellida: 8 };
  let fluxo1 = null;
  if(ultimoFechado){
    const dataFimTxt = fmtData(ultimoFechado.dataFim);
    const offsetFechado = Math.max(0, Math.min(11, offsetMesesCicloGD(ultimoFechado.dataFim)));
    const metaWallaceFechado = KWH_ANO_ANTERIOR_WALLACE[offsetFechado];
    const metaWellidaFechado = CONSUMO_MENSAL_IRMA[offsetFechado];
    function montarFechado(meta, creditoFechado, diaFatura){
      const cobertura = meta>0 ? Math.round((creditoFechado/meta)*1000)/10 : 0;
      const faltam = Math.round((meta-creditoFechado)*10)/10;
      const pct = Math.min(100, Math.max(0, Math.round(cobertura)));
      return { meta, creditoFechado, cobertura, faltam, pct, dataFimTxt, diaFatura };
    }
    fluxo1 = {
      wallace: montarFechado(metaWallaceFechado, Number(ultimoFechado.creditoWallaceKwh), DIA_FATURA.wallace),
      wellida: montarFechado(metaWellidaFechado, Number(ultimoFechado.creditoIrmaKwh), DIA_FATURA.wellida),
    };
  }

  // NOVO/CORRIGIDO 14/08/2026 (pedido do usuário: "melhore as legendas, deixe mais parecida com o
  // site" + achado real: "Fechado em undefined" — dataFimTxt tinha ficado só no objeto fluxo1 pai,
  // nunca chegava no objeto por casa que o template lê). Estrutura reorganizada em mini-cards
  // (Fechado em/Meta/Faltam, Período/Rateio/Média, Dias restantes/Necessário/Previsão) — mesmo
  // agrupamento e mesmos rótulos da seção 03 do painel privado, só com a classe .grid já existente
  // nesta página no lugar do grid-3/.card aninhado do painel (mantém a densidade visual do resto
  // desta página, que já usa .stat-lbl/.stat-val pro mesmo tipo de mini-stat em outros cards).
  function montarBlocoCasa(nome, dadosFluxo1, dadosFluxo2){
    const f1 = dadosFluxo1 ? `
      <div class="credito-fluxo-lbl">🔒 Fluxo 1 — crédito fechado, garantido pra próxima conta</div>
      <div class="progress"><div class="progress-fill" style="width:${dadosFluxo1.pct}%;background:${dadosFluxo1.faltam<=0?'var(--green)':'var(--amber)'}"></div></div>
      <div class="credito-fracao"><span>${fmtKwh(dadosFluxo1.creditoFechado)} / ${fmtKwh(dadosFluxo1.meta)}</span><span>${fmtPct(dadosFluxo1.cobertura)}</span></div>
      <div class="stat-grid">
        <div class="stat-box"><div class="stat-lbl">Fechado em</div><div class="stat-val" style="font-size:0.92rem">${dadosFluxo1.dataFimTxt}</div></div>
        <div class="stat-box"><div class="stat-lbl">Meta</div><div class="stat-val" style="font-size:0.92rem">${fmtKwh(dadosFluxo1.meta)}</div></div>
        <div class="stat-box"><div class="stat-lbl">Faltam (se negativo)</div><div class="stat-val" style="font-size:0.92rem;color:${dadosFluxo1.faltam>0?'var(--amber)':'var(--green)'}">${dadosFluxo1.faltam>0 ? fmtKwh(dadosFluxo1.faltam) : 'Cobre com sobra de '+fmtKwh(Math.abs(dadosFluxo1.faltam))}</div></div>
      </div>
      <div class="stat-sub" style="margin-top:0.5rem">Este valor não muda mais — é o que a Energisa vai abater na fatura que fecha por volta do dia ${dadosFluxo1.diaFatura}.</div>
    ` : `<div class="stat-sub">Sem ciclo fechado ainda.</div>`;
    const f2 = dadosFluxo2 ? `
      <div class="credito-fluxo-lbl" style="margin-top:1.1rem">🌱 Fluxo 2 — GD atual, crédito em formação</div>
      <div class="progress"><div class="progress-fill" style="width:${dadosFluxo2.pct}%;background:${dadosFluxo2.corBarra}"></div></div>
      <div class="credito-fracao"><span>${fmtKwh(dadosFluxo2.creditoAtual)} / ${fmtKwh(dadosFluxo2.meta)} (meta do mês, referência)</span><span>${dadosFluxo2.pct}%</span></div>
      <div class="stat-grid">
        <div class="stat-box"><div class="stat-lbl">Período</div><div class="stat-val" style="font-size:0.8rem">${dadosFluxo2.periodoTxt}</div></div>
        <div class="stat-box"><div class="stat-lbl">Rateio ${nome}</div><div class="stat-val" style="font-size:0.92rem">${dadosFluxo2.rateioTxt}</div></div>
        <div class="stat-box"><div class="stat-lbl">Média atual</div><div class="stat-val" style="font-size:0.92rem">${fmtKwh(dadosFluxo2.mediaRealizada)}/dia</div></div>
        <div class="stat-box"><div class="stat-lbl">Dias restantes (GD)</div><div class="stat-val" style="font-size:0.92rem">${dadosFluxo2.diasRestantesGD} dias</div></div>
        <div class="stat-box"><div class="stat-lbl">Necessário/dia</div><div class="stat-val" style="font-size:0.92rem">${fmtKwh(dadosFluxo2.mediaNecessaria)}/dia</div></div>
        <div class="stat-box"><div class="stat-lbl">Previsão de fechamento</div><div class="stat-val" style="font-size:0.92rem">${fmtKwh(dadosFluxo2.previsao)}</div></div>
      </div>
      <div style="margin-top:0.6rem;font-weight:600;font-size:0.8rem;color:${dadosFluxo2.status.cor}">${dadosFluxo2.status.emoji} ${dadosFluxo2.status.texto} <span style="color:var(--text-dim);font-weight:400">(ritmo de geração desta GD)</span></div>
    ` : `<div class="stat-sub" style="margin-top:0.9rem">⚠ Sem ciclo aberto no momento.</div>`;
    return `<div class="credito-casa"><div style="font-weight:600;margin-bottom:0.4rem">⚡ ${nome}</div>${f1}${f2}</div>`;
  }

  const creditoGarantidoHtml = (fluxo1 || fluxo2) ? `
    <div class="card">
      <div class="stat-lbl" style="margin-bottom:0.3rem">📈 Crédito garantido vs. crédito em formação</div>
      <div class="stat-sub" style="margin-bottom:0.9rem">Dois créditos coexistem ao mesmo tempo, sem se misturar: o que já fechou (garantido, vai pra próxima fatura) e o que a usina está gerando agora (só fecha no próximo fechamento da GD${fluxo2 ? ', ' + fluxo2.periodoTxt : ''}).</div>
      ${montarBlocoCasa('Wallace', fluxo1 && fluxo1.wallace, fluxo2 && fluxo2.wallace)}
      <div style="border-top:1px solid var(--border);margin:1rem 0"></div>
      ${montarBlocoCasa('Wellida', fluxo1 && fluxo1.wellida, fluxo2 && fluxo2.wellida)}
      <div class="stat-sub" style="margin-top:0.9rem;padding-top:0.7rem;border-top:1px solid var(--border)">Leitura/fatura Wallace (apartamento): dia 21 do mês (janela 19-21). Leitura/fatura Wellida (casa da mãe): dia 8 do mês (janela 06-09) — mesmo dia do fechamento da GD. 🟢 no ritmo (média ≥ necessário pra fechar a meta) · 🟡 atenção (déficit menor que 10%) · 🔴 atrasado (déficit maior que 10%) — status do Fluxo 2 (em formação), não do Fluxo 1 (já fechado).</div>
    </div>
  ` : '';

  // NOVO 11/08/2026 (pedido do usuário: "coloque mais gráficos lá no link, se possível todos os
  // gráficos") - "Histórico mês a mês" (importado/consumo direto/exportado/saldo líquido), mesma
  // ideia do gráfico do painel privado (seção 02), recalculada aqui a partir do delta entre leituras
  // consecutivas (só dado solar, já devolvido pela RPC). Mês de cada intervalo = mês da leitura que
  // fecha o intervalo.
  const historicoMensal = {}; // 'YYYY-MM' -> {importado, exportado, consumoDireto, saldo}
  for(let i=1;i<leituras.length;i++){
    const ant = leituras[i-1], atu = leituras[i];
    if(atu.leitura03==null || ant.leitura03==null || atu.leitura103==null || ant.leitura103==null) continue;
    const mesKey = atu.data.slice(0,7);
    const dImportado = Math.round((atu.leitura03 - ant.leitura03)*100)/100;
    const dExportado = Math.round((atu.leitura103 - ant.leitura103)*100)/100;
    let dConsumoDireto = null;
    if(atu.geracaoAcumulada!=null && ant.geracaoAcumulada!=null){
      dConsumoDireto = Math.round(((atu.geracaoAcumulada - ant.geracaoAcumulada) - dExportado)*100)/100;
    }
    const dSaldo = Math.round((dExportado - dImportado)*100)/100;
    if(!historicoMensal[mesKey]) historicoMensal[mesKey] = {importado:0, exportado:0, consumoDireto:0, temConsumoDireto:false, saldo:0};
    historicoMensal[mesKey].importado += dImportado;
    historicoMensal[mesKey].exportado += dExportado;
    historicoMensal[mesKey].saldo += dSaldo;
    if(dConsumoDireto!=null){ historicoMensal[mesKey].consumoDireto += dConsumoDireto; historicoMensal[mesKey].temConsumoDireto = true; }
  }
  const mesesHistorico = Object.keys(historicoMensal).sort();
  const mesLbl = (chave)=>{ const [a,m] = chave.split('-'); return ['Jan','Fev','Mar','Abr','Mai','Jun','Jul','Ago','Set','Out','Nov','Dez'][parseInt(m,10)-1]+'/'+a.slice(2); };

  const expiraTxtEl = document.getElementById('expiraTxt');
  if(expiraTxtEl) expiraTxtEl.textContent = dados.expiraEm ? fmtData(dados.expiraEm) : '—';

  const app = document.getElementById('app');
  app.innerHTML = `
    <div class="card">
      <div class="grid">
        <div><div class="stat-lbl">Geração hoje</div><div class="stat-val" style="color:var(--amber)">${geracaoHojeReg ? fmtKwh(geracaoHojeReg.kwh) : '—'}</div><div class="stat-sub">${geracaoHojeReg ? fmtData(geracaoHojeReg.data) : 'aguardando leitura do robô'}</div></div>
        <div><div class="stat-lbl">Geração acumulada</div><div class="stat-val" style="color:var(--amber)">${temGeracao ? fmtKwh(geracaoAcum) : '—'}</div><div class="stat-sub">${temGeracao ? '' : 'aguardando leitura do inversor'}</div></div>
        <div><div class="stat-lbl">Autoconsumo</div><div class="stat-val" style="color:var(--green)">${consumoDiretoConfiavel ? fmtPct(autoconsumoPct) : '—'}</div><div class="stat-sub">${consumoDiretoConfiavel ? fmtKwh(consumoDiretoAcum)+' direto das placas' : (temGeracao ? 'leitura do medidor desatualizada há '+diasDescompassoAtual+' dias' : 'dados insuficientes')}</div></div>
        <div><div class="stat-lbl">Dependência da rede</div><div class="stat-val" style="color:var(--blue)">${consumoDiretoConfiavel ? fmtPct(dependenciaPct) : '—'}</div><div class="stat-sub">${importadoAcum!=null ? fmtKwh(importadoAcum)+' importados' : ''}</div></div>
        <div><div class="stat-lbl">Exportação da geração</div><div class="stat-val" style="color:var(--purple)">${consumoDiretoConfiavel ? fmtPct(exportacaoDaGeracaoPct) : '—'}</div><div class="stat-sub">${exportadoAcum!=null ? fmtKwh(exportadoAcum)+' exportados' : ''}</div></div>
      </div>
      ${saldoLiquidoAcum!=null ? `<div class="stat-sub" style="margin-top:0.9rem;padding-top:0.9rem;border-top:1px solid var(--border)">Saldo líquido: <strong style="color:${saldoLiquidoAcum>=0?'var(--green)':'var(--red)'}">${saldoLiquidoAcum>=0?'+':''}${fmtKwh(saldoLiquidoAcum)}</strong> ${saldoLiquidoAcum>=0 ? '— excedente (exportando mais do que importa)' : '— dependendo mais da rede do que exportando'}</div>` : ''}
    </div>

    ${creditoGarantidoHtml}

    <div class="card">
      <div class="stat-lbl" style="margin-bottom:0.6rem">Economia estimada (desde a ativação)</div>
      <div class="grid">
        <div><div class="stat-lbl">Economia acumulada</div><div class="stat-val" style="color:var(--green)">${fmt(economiaEstimada)}</div></div>
        <div><div class="stat-lbl">Valor do kWh gerado</div><div class="stat-val">${valorKwhGerado!=null ? fmt(valorKwhGerado) : '—'}</div></div>
        <div><div class="stat-lbl">Payback estimado</div><div class="stat-val">${paybackAnos!=null ? paybackAnos.toLocaleString('pt-BR',{maximumFractionDigits:1})+' anos' : '—'}</div><div class="stat-sub">investimento de ${fmt(INVESTIMENTO_PADRAO)} (padrão)</div></div>
      </div>
      <div class="stat-sub" style="margin-top:0.8rem">Autoconsumo direto à tarifa cheia, exportado à tarifa menos Fio B (crédito Lei 14.300) — estimativa simplificada, sem projeção mês a mês, não é a fatura real.</div>
    </div>

    <div class="card">
      <div class="stat-lbl" style="margin-bottom:0.8rem">Geração diária (kWh)</div>
      <div class="chart-wrap"><canvas id="cGeracaoDiaria"></canvas></div>
      <!-- NOVO 17/08/2026 (pedido do usuário: "coloque essa legenda no compartilhado também" — mesmo
           parágrafo explicativo que já existe no painel privado, legGeracaoPorDia em
           graficos-cenarios-lazy.js, nunca tinha sido replicado aqui). Calculado logo abaixo, no
           mesmo bloco que monta o gráfico (usa 'ultimos'/CONSUMO_MEDIO_3_CASAS_KWH, já em escopo). -->
      <div class="stat-sub" id="legGeracaoDiariaCompartilhado" style="margin-top:0.6rem"></div>
    </div>

    ${mesesHistorico.length ? `<div class="card">
      <div class="stat-lbl" style="margin-bottom:0.8rem">Histórico mês a mês (kWh)</div>
      <div class="stat-sub" style="margin-bottom:0.6rem">Importado/exportado no medidor bidirecional da Casa da Mãe (unidade geradora) — não confundir com o consumo do apartamento do Wallace, mostrado à parte no card do medidor Tuya mais abaixo.</div>
      <div class="chart-wrap"><canvas id="cHistoricoMensal"></canvas></div>
    </div>` : ''}

    <!-- AMPLIADO 17/08/2026 (pedido do usuário: "quero esse gráfico no compartilhado" + "com essa

         Wallace/Wellida), sem "Consumo esperado" nenhum. Reconstruído pra bater com o gráfico do

    <div class="card">
      <div class="stat-lbl" style="margin-bottom:0.8rem">Rateio Solar — crédito por casa (Wallace 71% / Irmã 29%)</div>
      <div class="chart-wrap"><canvas id="cRateioSolar"></canvas></div>
      <div class="stat-sub" id="legRateioSolarCompartilhado" style="margin-top:0.6rem"></div>
    </div>

    ${ciclosFechados.length ? `<div class="card">
      <div class="stat-lbl" style="margin-bottom:0.8rem">📁 Histórico de ciclos fechados</div>
      <div class="stat-sub" style="margin-bottom:0.6rem">Cada ciclo fecha quando uma leitura é confirmada como oficial da Energisa — o crédito daquele período fica congelado, e um novo ciclo abre automaticamente.</div>
      <div style="overflow-x:auto"><table style="width:100%;border-collapse:collapse;font-size:0.78rem">
        <thead><tr style="text-align:left;color:var(--text-dim);font-size:0.68rem;text-transform:uppercase"><th style="padding:0.4rem 0.6rem 0.4rem 0">Período</th><th style="padding:0.4rem 0.6rem">Crédito líquido</th><th style="padding:0.4rem 0.6rem">Wallace</th><th style="padding:0.4rem 0.6rem">Wellida</th></tr></thead>
        <tbody>${ciclosFechados.slice().reverse().map(c => `<tr style="border-top:1px solid var(--border)"><td style="padding:0.5rem 0.6rem 0.5rem 0">${fmtData(c.dataInicio)} – ${fmtData(c.dataFim)}</td><td style="padding:0.5rem 0.6rem">${fmtKwh(c.creditoLiquidoKwh)}</td><td style="padding:0.5rem 0.6rem">${fmtKwh(c.creditoWallaceKwh)}</td><td style="padding:0.5rem 0.6rem">${fmtKwh(c.creditoIrmaKwh)}</td></tr>`).join('')}</tbody>
      </table></div>
    </div>` : ''}

    <!-- NOVO 17/08/2026 (pedido do usuário: "quero esse também lá, no compartilhamento coloca o
         título como 'consumo em tempo real Apartamento Wallace'" — mesmo card do medidor Tuya que
         existe no painel privado, ver hydrate-medidor-tuya.js). Dado vem de
         dados.medidorTuyaUltima/medidorTuyaCicloBase (RPC consultar_solar_compartilhado, ampliada
         nesta sessão pra expor esses campos também — mesmo padrão de curadoria SECURITY DEFINER já
         usado pros campos solares). -->
    ${medidorUltima ? `<div class="card">
      <div class="stat-lbl" style="margin-bottom:0.8rem">⚡ Consumo em tempo real Apartamento Wallace</div>
      <div class="stat-grid">
        <div><div class="stat-lbl">Potência atual</div><div class="stat-val">${medidorUltima.potenciaW!=null ? Number(medidorUltima.potenciaW).toLocaleString('pt-BR',{maximumFractionDigits:0})+' W' : '—'}</div></div>
        <div><div class="stat-lbl">Consumo hoje</div><div class="stat-val">${fmtKwh(medidorUltima.energiaHojeKwh, 2)}</div></div>
        <div><div class="stat-lbl">Energia total acumulada</div><div class="stat-val">${fmtKwh(medidorUltima.energiaTotalKwh)}</div></div>
        <div><div class="stat-lbl">Tensão / Corrente</div><div class="stat-val" style="font-size:1.05rem">${medidorUltima.tensaoV!=null?Number(medidorUltima.tensaoV).toLocaleString('pt-BR',{minimumFractionDigits:1,maximumFractionDigits:1}):'—'} V / ${medidorUltima.correnteA!=null?Number(medidorUltima.correnteA).toLocaleString('pt-BR',{minimumFractionDigits:2,maximumFractionDigits:2}):'—'} A</div></div>

    </div>` : ''}

    <!-- CORRIGIDO 18/08/2026 (2 achados do usuário: card sempre mostrando "0,0 kWh"/"—" mesmo com o
         medidor funcionando, e o painel privado mostrando um design/fórmula diferente pra este mesmo
         card — "no site está correto"). Causa raiz do "0,0"/"—": 'ciclo.dataInicio' não existe no

         sem alias camelCase (diferente de 'ciclosFechados', que É mapeado explicitamente na RPC), então

         virava "—". Aproveitado pra também trocar a fórmula: em vez de comparar contra o ÚLTIMO CICLO

         vivo — mesma fórmula do painel privado ('calcularSaldoLiquidoProjetadoHoje()', já reimplementada
         nesta página desde 14/08 pro Fluxo 2, ver comentário linha ~223) menos o 'baseline_kwh' do ciclo
         aberto (RPC já devolve, 'vw_ciclo_solar_aberto.baseline_kwh'), vezes o rateio Wallace
         ('ciclo.rateio_wallace_pct', também já vem na RPC). Mesmo layout de 3 caixas do painel privado
         (Ciclo da GD / Crédito que cabe a você / Saldo), reaproveitando as classes CSS já existentes
         (.progress/.progress-fill/.credito-fracao/.stat-grid, mesmas do Fluxo 1/Fluxo 2 acima). -->
    ${(medidorUltima && ciclo && ciclo.data_inicio) ? (() => {
      const diarioApto = dados.medidorTuyaConsumoDiario || [];
      const inicioCicloGD = ciclo.data_inicio;
      const rateioWallace = ciclo.rateio_wallace_pct != null ? Number(ciclo.rateio_wallace_pct) : 0.71;
      const baselineKwh = ciclo.baseline_kwh != null ? Number(ciclo.baseline_kwh) : null;
      const consumoCicloGDKwh = Math.round(diarioApto.filter(r => r.data >= inicioCicloGD && r.kwhConsumido != null).reduce((s,r)=>s+Number(r.kwhConsumido),0)*100)/100;
      const saldoProjetadoHoje = calcularSaldoLiquidoProjetadoHoje(ultima, geracaoDiaria);
      const creditoCicloAtual = (saldoProjetadoHoje != null && baselineKwh != null)
        ? Math.round((saldoProjetadoHoje - baselineKwh) * rateioWallace * 100) / 100
        : null;
      const labelCiclo = fmtData(inicioCicloGD) + ' → hoje';
      if(creditoCicloAtual != null && creditoCicloAtual > 0){
        const pctConsumido = Math.min(100, Math.max(0, Math.round((consumoCicloGDKwh / creditoCicloAtual) * 100)));
        const saldo = Math.round((creditoCicloAtual - consumoCicloGDKwh) * 100) / 100;
        const estourou = saldo < 0;
        return `<div class="card">
          <div class="stat-lbl" style="margin-bottom:0.8rem">📊 Consumo real × crédito que cabe a você (apartamento)</div>
          <div class="stat-sub" style="margin-bottom:0.6rem">Barra = quanto do crédito que cabe a você (${fmtPct(rateioWallace*100)} do que a usina gerou) já foi consumido de verdade, medido pelo medidor Tuya. Ciclo é o da GD (fecha todo dia 8, não o mês calendário) — os dois lados sempre cobrem a mesma janela de tempo.</div>
          <div class="progress"><div class="progress-fill" style="width:${pctConsumido}%;background:${estourou?'var(--red)':'var(--blue)'}"></div></div>
          <div class="credito-fracao"><span>${fmtKwh(consumoCicloGDKwh)} / ${fmtKwh(creditoCicloAtual)} consumidos</span><span style="color:var(--blue)">${pctConsumido}%</span></div>
          <div class="stat-grid">
            <div><div class="stat-lbl">Ciclo da GD</div><div class="stat-val" style="font-size:1.05rem">${labelCiclo}</div></div>
            <div><div class="stat-lbl">Crédito que cabe a você</div><div class="stat-val" style="font-size:1.05rem">${fmtKwh(creditoCicloAtual)}</div></div>
            <div><div class="stat-lbl">Saldo</div><div class="stat-val" style="font-size:1.05rem;color:${estourou?'var(--red)':'var(--green)'}">${estourou ? '−'+fmtKwh(Math.abs(saldo))+' (estourou)' : '+'+fmtKwh(saldo)+' de sobra'}</div></div>
          </div>
          <div class="stat-sub" style="margin-top:0.6rem">${estourou ? 'Consumo real já passou o crédito formado neste ciclo em '+fmtKwh(Math.abs(saldo)) : 'Crédito cobre o consumo real medido até agora, com sobra de '+fmtKwh(saldo)} (os dois ainda em andamento, ciclo não fechou).</div>
        </div>`;
      }
      return `<div class="card">
        <div class="stat-lbl" style="margin-bottom:0.8rem">📊 Consumo real × crédito que cabe a você (apartamento)</div>
        <div class="stat-sub">Ainda sem crédito formado neste ciclo pra comparar.</div>
      </div>`;
    })() : ''}

    <!-- NOVO 18/08/2026 (pedido do usuário: "crie esse mesmo campo para Wellida no site e no
         compartilhado") — card gêmeo exato do de cima, mesma fórmula/IIFE, só trocando o rateio
         (rateio_irma_pct em vez de rateio_wallace_pct) e a fonte de consumo diário
         (dados.medidorTuyaWellidaConsumoDiario, RPC atualizada 18/08/2026). Medidor da Wellida já
         está linkado no Tuya (Device ID ebf0d04e88180e1474o2is), mas o robô ainda não está rodando
         (aguardando secrets do GitHub) — até a 1ª leitura chegar, mostra "aguardando instalação". -->
    ${(ciclo && ciclo.data_inicio) ? (() => {
      const diarioWellida = dados.medidorTuyaWellidaConsumoDiario || [];
      const inicioCicloGD = ciclo.data_inicio;
      const rateioIrma = ciclo.rateio_irma_pct != null ? Number(ciclo.rateio_irma_pct) : 0.29;
      const baselineKwh = ciclo.baseline_kwh != null ? Number(ciclo.baseline_kwh) : null;
      const consumoCicloGDKwh = Math.round(diarioWellida.filter(r => r.data >= inicioCicloGD && r.kwhConsumido != null).reduce((s,r)=>s+Number(r.kwhConsumido),0)*100)/100;
      const saldoProjetadoHoje = calcularSaldoLiquidoProjetadoHoje(ultima, geracaoDiaria);
      const creditoCicloAtual = (saldoProjetadoHoje != null && baselineKwh != null)
        ? Math.round((saldoProjetadoHoje - baselineKwh) * rateioIrma * 100) / 100
        : null;
      const labelCiclo = fmtData(inicioCicloGD) + ' → hoje';
      if(!diarioWellida.length){
        return `<div class="card">
          <div class="stat-lbl" style="margin-bottom:0.8rem">📊 Consumo real × crédito que cabe à Wellida</div>
          <div class="stat-sub">Aguardando instalação do medidor da Wellida — assim que ela instalar e o robô sincronizar, este card passa a comparar automaticamente.</div>
        </div>`;
      }
      if(creditoCicloAtual != null && creditoCicloAtual > 0){
        const pctConsumido = Math.min(100, Math.max(0, Math.round((consumoCicloGDKwh / creditoCicloAtual) * 100)));
        const saldo = Math.round((creditoCicloAtual - consumoCicloGDKwh) * 100) / 100;
        const estourou = saldo < 0;
        return `<div class="card">
          <div class="stat-lbl" style="margin-bottom:0.8rem">📊 Consumo real × crédito que cabe à Wellida</div>
          <div class="stat-sub" style="margin-bottom:0.6rem">Barra = quanto do crédito que cabe à Wellida (${fmtPct(rateioIrma*100)} do que a usina gerou) já foi consumido de verdade, medido pelo medidor Tuya dela. Ciclo é o da GD (fecha todo dia 8, não o mês calendário) — os dois lados sempre cobrem a mesma janela de tempo.</div>
          <div class="progress"><div class="progress-fill" style="width:${pctConsumido}%;background:${estourou?'var(--red)':'var(--blue)'}"></div></div>
          <div class="credito-fracao"><span>${fmtKwh(consumoCicloGDKwh)} / ${fmtKwh(creditoCicloAtual)} consumidos</span><span style="color:var(--blue)">${pctConsumido}%</span></div>
          <div class="stat-grid">
            <div><div class="stat-lbl">Ciclo da GD</div><div class="stat-val" style="font-size:1.05rem">${labelCiclo}</div></div>
            <div><div class="stat-lbl">Crédito que cabe a ela</div><div class="stat-val" style="font-size:1.05rem">${fmtKwh(creditoCicloAtual)}</div></div>
            <div><div class="stat-lbl">Saldo</div><div class="stat-val" style="font-size:1.05rem;color:${estourou?'var(--red)':'var(--green)'}">${estourou ? '−'+fmtKwh(Math.abs(saldo))+' (estourou)' : '+'+fmtKwh(saldo)+' de sobra'}</div></div>
          </div>
          <div class="stat-sub" style="margin-top:0.6rem">${estourou ? 'Consumo real já passou o crédito formado neste ciclo em '+fmtKwh(Math.abs(saldo)) : 'Crédito cobre o consumo real medido até agora, com sobra de '+fmtKwh(saldo)} (os dois ainda em andamento, ciclo não fechou).</div>
        </div>`;
      }
      return `<div class="card">
        <div class="stat-lbl" style="margin-bottom:0.8rem">📊 Consumo real × crédito que cabe à Wellida</div>
        <div class="stat-sub">Ainda sem crédito formado neste ciclo pra comparar.</div>
      </div>`;
    })() : ''}

    <div class="footer-note">Sistema Wallace Lira — página de compartilhamento público, só leitura de dados solares.<br>Nenhum dado financeiro é exposto por este link.</div>
  `;

  if(geracaoDiaria.length && window.Chart){
    // CORRIGIDO 14/08/2026 (achado de auditoria mobile: 30 barras + rótulos de data em ~300px úteis
    // de largura ficam ilegíveis). Tela estreita mostra só os últimos 14 dias; desktop mantém 30.
    const ultimos = geracaoDiaria.slice(window.innerWidth <= 480 ? -14 : -30);
    // DEFENSIVO (11/08/2026, achado de auditoria): mesma proteção aplicada em todo new Chart() do repo.
    { const __chartExistente = Chart.getChart(document.getElementById('cGeracaoDiaria')); if (__chartExistente) __chartExistente.destroy(); }
    new Chart(document.getElementById('cGeracaoDiaria'), {
      type: 'bar',
      data: {
        labels: ultimos.map(r => fmtData(r.data)),
        datasets: [
          // CORRIGIDO 17/08/2026 (achado do usuário: legenda mostrando "undefined" + cor diferente do
          // painel privado — faltava `label` nesse dataset, e a cor (#e8a63a, laranja) não batia com
          // o gráfico equivalente do site privado (cGeracaoPorDia, graficos-cenarios-lazy.js), que usa
          // verde (#34c98a) pra geração real do dia — mesmo dado, duas cores diferentes sem motivo).
          { label: 'Geração real do dia (kWh)', data: ultimos.map(r => r.kwh), backgroundColor: '#34c98a', borderRadius: 3 },
          // NOVO 12/08/2026 (pedido do usuário: "gráfico de geração diária precisa da linha de consumo
          // médio das 3 casas como aparece no meu site") — linha tracejada constante, mesma ideia do
          // painel privado (graficos-cenarios-lazy.js), aqui como dataset 'line' nativo do Chart.js
          // (mixed chart bar+line) por ser mais simples numa página autocontida sem plugin customizado.
          { type: 'line', label: `Consumo médio das 3 casas (${fmtKwh(CONSUMO_MEDIO_3_CASAS_KWH)}/dia)`, data: ultimos.map(()=>CONSUMO_MEDIO_3_CASAS_KWH), borderColor: 'rgba(226,85,79,0.85)', borderDash: [5,4], borderWidth: 2, pointRadius: 0, fill: false },
        ],
      },
      options: {
        responsive: true, maintainAspectRatio: false,
        layout: { padding: { top: 18 } },
        plugins: {
          legend: { display: true, position: 'bottom', labels: { boxWidth: 8, padding: 10, font: { size: 9.5 } } },
          tooltip: { callbacks: { label: c => c.dataset.type === 'line' ? c.dataset.label : c.raw + ' kWh' } },
        },
        scales: {
          x: { grid: { display: false }, ticks: { font: { size: 9 }, maxRotation: 60, minRotation: 60 } },
          y: { grid: { color: '#2a2d31' }, ticks: { callback: v => v, font: { size: 10 } } },
        },
      },
      plugins: [barValuePlugin],
    });
    // NOVO 17/08/2026 (pedido do usuário: "coloque essa legenda no compartilhado também" — mesmo
    // texto/números em destaque vermelho do painel privado, legGeracaoPorDia em
    // graficos-cenarios-lazy.js, calculado aqui com os mesmos `ultimos`/CONSUMO_MEDIO_3_CASAS_KWH).
    const legGeracaoEl = document.getElementById('legGeracaoDiariaCompartilhado');
    if(legGeracaoEl){
      const valoresReais = ultimos.map(r=>r.kwh).filter(v=>typeof v==='number');
      const mediaGeracaoReal = valoresReais.length ? Math.round((valoresReais.reduce((s,v)=>s+v,0)/valoresReais.length)*100)/100 : null;
      legGeracaoEl.innerHTML = valoresReais.length
        ? valoresReais.length+' dia(s) com geração real (barra verde), média de <strong style="color:var(--red)">'+fmtKwh(mediaGeracaoReal)+'/dia</strong>. Linha vermelha tracejada = consumo médio diário somado das 3 casas = <strong style="color:var(--red)">'+fmtKwh(CONSUMO_MEDIO_3_CASAS_KWH)+'/dia</strong>.'
        : 'Ainda sem geração diária real suficiente pra calcular a média.';
    }
  }

  if(mesesHistorico.length && window.Chart){
    { const __chartExistente = Chart.getChart(document.getElementById('cHistoricoMensal')); if (__chartExistente) __chartExistente.destroy(); }
    // SIMPLIFICADO 12/08/2026 (achado do usuário: "Histórico mês a mês (kWh) - revise esse gráfico
    // está muito confuso") — a versão anterior tinha 4 barras por mês (importado, consumo direto
    // calculado, exportado, saldo líquido positivo/negativo misturados na mesma escala), difícil de
    // ler. Reduzido às 2 séries que realmente importam pra entender o fluxo com a rede: importado x
    // exportado (o saldo líquido acumulado já aparece no card de resumo, no topo da página).
    new Chart(document.getElementById('cHistoricoMensal'), {
      type: 'bar',
      data: {
        labels: mesesHistorico.map(mesLbl),
        datasets: [
          { label:'Importado da rede', data: mesesHistorico.map(m=>Math.round(historicoMensal[m].importado*10)/10), backgroundColor:'#e2554f', borderRadius:3 },
          { label:'Exportado para a rede', data: mesesHistorico.map(m=>Math.round(historicoMensal[m].exportado*10)/10), backgroundColor:'#3987e5', borderRadius:3 },
        ],
      },
      options: {
        responsive: true, maintainAspectRatio: false,
        layout: { padding: { top: 18 } },
        plugins: { legend: { position:'bottom', labels:{boxWidth:8, padding:10, font:{size:9.5}} }, tooltip: { callbacks: { label: c => c.dataset.label+': '+c.raw+' kWh' } } },
        scales: {
          x: { grid: { display: false }, ticks: { font: { size: 9.5 } }, categoryPercentage:0.8, barPercentage:0.7 },
          y: { grid: { color: '#2a2d31' }, ticks: { callback: v => v+' kWh', font: { size: 9.5 } } },
        },
      },
      plugins: [barValuePlugin],
    });
  }

  // CORRIGIDO 18/08/2026 (achado do usuário: coluna "Jul" aparecia com barras laranjas de "esperado"
  // sem nenhum crédito, quando o painel privado nem mostra "Jul" — começa direto em "Ago"). Causa
  // raiz: esta página usava um esquema Jul-primeiro fixo (12 meses fixos, índice 0=Jul), diferente da
  // âncora real do painel privado (graficos-cenarios-lazy.js, ANCHOR_SOLAR_MES_CICLO) — o mês em que
  // o 1º ciclo de leitura FECHA (Ago/2026, já que ativação foi 21/07 e o corte de ciclo é dia 8: dia
  // 21 > 8, então cai no ciclo que fecha em Ago). Nada pertence ao ciclo de julho (pago antes da
  // usina existir) — corrigido pra usar a MESMA âncora, reaproveitando DIA_LEITURA_GD/
  // SOLAR_DATA_ATIVACAO já definidos nesta página (linhas ~230-232), nunca mais duas lógicas
  // divergentes pra "qual mês esse ciclo pertence".
  function mesFechamentoCicloRateio(dataStr){
    const [, mes, dia] = dataStr.split('-').map(Number);
    let m = dia <= DIA_LEITURA_GD ? mes : mes + 1;
    if(m > 12) m = 1;
    return m;
  }
  const ANCHOR_SOLAR_MES_CICLO_RATEIO = mesFechamentoCicloRateio(SOLAR_DATA_ATIVACAO); // 8 = Ago/2026
  const MESES_ABREV_RATEIO_CALENDARIO = ['Jan','Fev','Mar','Abr','Mai','Jun','Jul','Ago','Set','Out','Nov','Dez'];
  const MESES_ABREV_RATEIO = Array.from({length:12}, (_,i) => MESES_ABREV_RATEIO_CALENDARIO[((ANCHOR_SOLAR_MES_CICLO_RATEIO - 1 + i) % 12 + 12) % 12]); // Ago,Set,...,Jun,Jul
  const idxMesRateio = dataFimISO => (mesFechamentoCicloRateio(dataFimISO) - ANCHOR_SOLAR_MES_CICLO_RATEIO + 12) % 12;

  // Arrays de referência (consumo histórico real, Jul-primeiro na fonte) realinhados pro mesmo
  // esquema Ago-primeiro dos rótulos acima — mesmo truque de lookup por nome de mês já usado no
  // painel privado (kwhWallacePorMes/kwhIrmaPorMes), imune a qual mês vira a 1ª coluna.
  const KWH_WALLACE_POR_NOME_MES = {}, KWH_IRMA_POR_NOME_MES = {};
  ['Jul','Ago','Set','Out','Nov','Dez','Jan','Fev','Mar','Abr','Mai','Jun'].forEach((nome,i) => {
    KWH_WALLACE_POR_NOME_MES[nome] = KWH_ANO_ANTERIOR_WALLACE[i];
    KWH_IRMA_POR_NOME_MES[nome] = CONSUMO_MENSAL_IRMA[i];
  });
  const consumoEsperadoWallaceAlinhado = MESES_ABREV_RATEIO.map(nome => KWH_WALLACE_POR_NOME_MES[nome]);
  const consumoEsperadoIrmaAlinhado = MESES_ABREV_RATEIO.map(nome => KWH_IRMA_POR_NOME_MES[nome]);

  const creditoWallacePorIdx = new Array(12).fill(null);
  const creditoIrmaPorIdx = new Array(12).fill(null);
  ciclosFechados.forEach(c => {
    if(!c.dataFim) return;
    const idx = idxMesRateio(c.dataFim);
    creditoWallacePorIdx[idx] = Number(c.creditoWallaceKwh);
    creditoIrmaPorIdx[idx] = Number(c.creditoIrmaKwh);
  });

  // CORRIGIDO 18/08/2026 (achado do usuário: números sobre as barras com 1 casa decimal — "321,0" —
  // fora do padrão do resto do site, que sempre mostra kWh inteiro nesse gráfico específico —
  // solarBarLabelPlugin em graficos-cenarios-lazy.js usa minimumFractionDigits:0). Plugin dedicado só
  // pra este gráfico (o barValuePlugin genérico da página, usado nos outros 2 gráficos, continua com
  // 1 casa decimal — não mudar sem confirmar que os outros também deveriam mudar).
  const barValuePluginInteiro = {
    id: 'barValuePluginInteiro',
    afterDatasetsDraw(chart){
      const { ctx } = chart;
      ctx.save();
      ctx.fillStyle = '#e8e6df';
      ctx.font = "600 9.5px -apple-system, 'Segoe UI', Roboto, sans-serif";
      ctx.textAlign = 'center';
      ctx.textBaseline = 'bottom';
      chart.data.datasets.forEach((ds, di) => {
        const meta = chart.getDatasetMeta(di);
        if(meta.hidden) return;
        meta.data.forEach((bar, i) => {
          const v = ds.data[i];
          if(v==null) return;
          ctx.fillText(Number(v).toLocaleString('pt-BR',{minimumFractionDigits:0,maximumFractionDigits:0}), bar.x, bar.y - 4);
        });
      });
      ctx.restore();
    }
  };

  // NOVO 18/08/2026 (mesmo pedido do usuário replicado do painel privado — cor sólida no mês
  // reconfirmado por fatura real, opacidade reduzida no resto, que ainda é só a estimativa histórica).
  const corBarraConsumoEsperadoIrma = (corBase) => (ctx) => CONSUMO_IRMA_MESES_RECONFIRMADOS[MESES_ABREV_RATEIO[ctx.dataIndex]] ? corBase : corBase + '66';

  if(window.Chart){
    { const __chartExistente = Chart.getChart(document.getElementById('cRateioSolar')); if (__chartExistente) __chartExistente.destroy(); }
    new Chart(document.getElementById('cRateioSolar'), {
      type: 'bar',
      data: {
        labels: MESES_ABREV_RATEIO,
        datasets: [
          { label:'Crédito Wallace (gerado)', data: creditoWallacePorIdx, backgroundColor:'#34c98a', borderRadius:3 },
          { label:'Consumo esperado Wallace', data: consumoEsperadoWallaceAlinhado, backgroundColor:'#f0c94a', borderRadius:3 },
          { label:'Crédito Irmã (gerado)', data: creditoIrmaPorIdx, backgroundColor:'#14b8a6', borderRadius:3 },
          { label:'Consumo esperado Irmã', data: consumoEsperadoIrmaAlinhado, backgroundColor:corBarraConsumoEsperadoIrma('#a9861f'), borderRadius:3 },
        ],
      },
      options: {
        responsive: true, maintainAspectRatio: false,
        layout: { padding: { top: 18 } },
        plugins: {
          legend: { position:'bottom', labels:{boxWidth:8, padding:10, font:{size:9.5}} },
          tooltip: { callbacks: { label: c => c.raw==null ? c.dataset.label+': sem leitura ainda' : c.dataset.label+': '+c.raw.toLocaleString('pt-BR',{minimumFractionDigits:1,maximumFractionDigits:1})+' kWh' } },
        },
        scales: {
          x: { grid: { display: false }, ticks: { font: { size: 9.5 } }, categoryPercentage:0.9, barPercentage:0.35 },
          y: { grid: { color: '#2a2d31' }, ticks: { callback: v => v+' kWh', font: { size: 9.5 } } },
        },
      },
      plugins: [barValuePluginInteiro],
    });
  }
  const legRateioEl = document.getElementById('legRateioSolarCompartilhado');
  if(legRateioEl){
    const mesesComLeitura = creditoWallacePorIdx.filter(v=>v!=null).length;
    legRateioEl.textContent = mesesComLeitura
      ? mesesComLeitura+' de 12 meses já têm leitura de crédito confirmada; os demais ficam sem barra verde até a leitura chegar. Consumo esperado vem do histórico REAL dos últimos 12 meses de cada apartamento (fatura Energisa de cada um, Wallace e Wellida).'
      : 'Ainda sem nenhum ciclo fechado com crédito confirmado — as barras de crédito aparecem aqui assim que o primeiro ciclo fechar.';
  }

  } catch(errRender){
    console.error('solar-compartilhado: erro ao renderizar', errRender);
    renderErro('Erro ao montar a página: ' + (errRender && errRender.message ? errRender.message : String(errRender)) + (errRender && errRender.stack ? ('\n\n' + errRender.stack.split('\n').slice(0,5).join('\n')) : ''));
  }
  } finally {
    clearTimeout(abortTimer);
  }
}

carregar();
</script>
