const KWH_ANO_ANTERIOR_WALLACE = [321,262,279,297,405,265,211,273,330,343,323,304]; // Jul/26..Jun/27
const CONSUMO_MENSAL_IRMA = [90,74,70,82,103,127,122,138,142,172,140,100]; // Jul/26..Jun/27

const SOLAR_DATA_ATIVACAO = '2026-07-21'; // mesmo VARS.solarDataAtivacao (data real de ativação do sistema)
const DIA_LEITURA_GD = 8; // dia da leitura/fechamento da GD (Casa da Mãe, onde fica a usina)

function offsetMesesCicloGD(dataRef){
  const hoje = dataRef ? new Date(dataRef+'T00:00:00') : new Date();
  let ano = hoje.getFullYear(), mes = hoje.getMonth()+1;
  if(hoje.getDate() >= DIA_LEITURA_GD){ mes += 1; if(mes > 12){ mes = 1; ano += 1; } }
  return (ano-ANCHOR_ENERGIA_ANO)*12 + (mes-ANCHOR_ENERGIA_MES);
}
function calcularDiasRestantesGD(diaLeituraAlvo){
  const hj = new Date();
  const hojeSoData = new Date(hj.getFullYear(), hj.getMonth(), hj.getDate());
  let proxima = new Date(hj.getFullYear(), hj.getMonth(), diaLeituraAlvo);
  if(proxima <= hojeSoData) proxima = new Date(hj.getFullYear(), hj.getMonth()+1, diaLeituraAlvo);
  return { dias: Math.max(1, Math.round((proxima-hojeSoData)/86400000)), data: proxima };
}
function calcularStatusGD(mediaRealizada, mediaNecessaria){
  if(mediaNecessaria<=0 || mediaRealizada>=mediaNecessaria) return {emoji:'🟢', texto:'No ritmo', cor:'var(--green)'};
  const deficitPct = (mediaNecessaria-mediaRealizada)/mediaNecessaria;
  if(deficitPct < 0.10) return {emoji:'🟡', texto:'Atenção', cor:'var(--amber)'};
  return {emoji:'🔴', texto:'Atrasado', cor:'var(--red)'};
}

// Plugin Chart.js que escreve o valor numérico acima de cada barra — mesmo padrão visual do
// barValuePlugin em src/dashboard/charts/graficos-utilitarios.js (painel privado), reimplementado aqui
// sem dependências porque esta página é autocontida. Ignora datasets do tipo 'line' (ex.: a linha
// tracejada de consumo médio) — só rotula barras.
const barValuePlugin = {
  id: 'barValuePlugin',
  afterDatasetsDraw(chart){
    const { ctx } = chart;
    ctx.save();
    ctx.fillStyle = '#e8e6df';
    ctx.font = "600 9.5px -apple-system, 'Segoe UI', Roboto, sans-serif";
    ctx.textAlign = 'center';
    ctx.textBaseline = 'bottom';
    chart.data.datasets.forEach((ds, di) => {
      if(ds.type === 'line') return;
      const meta = chart.getDatasetMeta(di);
      if(meta.hidden) return;
      meta.data.forEach((bar, i) => {
        const v = ds.data[i];
        if(v==null) return;
        ctx.fillText(Number(v).toLocaleString('pt-BR',{minimumFractionDigits:1,maximumFractionDigits:1}), bar.x, bar.y - 4);
      });
    });
    ctx.restore();
  }
};

const CLIMA_DIAS_SEMANA = ['Dom','Seg','Ter','Qua','Qui','Sex','Sáb'];

async function carregarClima(){
  const box = document.getElementById('climaCard');
  if(!box) return;
  try {
    const url = `https://api.open-meteo.com/v1/forecast?latitude=${CLIMA_LAT}&longitude=${CLIMA_LON}&current=temperature_2m,weather_code,is_day&daily=weather_code,temperature_2m_max,temperature_2m_min&timezone=America%2FSao_Paulo&forecast_days=5`;
    const resp = await fetch(url);
    if(!resp.ok) throw new Error(`Open-Meteo respondeu ${resp.status}`);
    const dado = await resp.json();
    const atual = dado.current;
    const diario = dado.daily;
    if(!atual || typeof atual.temperature_2m !== 'number' || !diario) throw new Error('resposta incompleta');

    const infoAtual = CLIMA_CODIGOS[atual.weather_code] || { emoji: '🌡️', texto: 'Sem descrição' };
    const emojiAtual = (atual.is_day === 0 && (atual.weather_code === 0 || atual.weather_code === 1)) ? '🌙' : infoAtual.emoji;
    const tempAtual = Math.round(atual.temperature_2m);

    // NOVO 12/08/2026 (pedido do usuário: "precisa de data e hora nesse menu do tempo, tanto no
    // compartilhamento como no site") - atual.time vem no fuso já pedido acima (America/Sao_Paulo).
    const [dataAtualIso, horaAtualIso] = (atual.time || '').split('T');
    const dataAtualFmt = dataAtualIso ? (() => { const [a,m,d] = dataAtualIso.split('-'); return `${d}/${m}`; })() : '';

    const diasHtml = diario.time.slice(1, 5).map((iso, i) => {
      const idx = i + 1;
      const info = CLIMA_CODIGOS[diario.weather_code[idx]] || { emoji: '🌡️', texto: '' };
      const diaSemana = CLIMA_DIAS_SEMANA[new Date(iso + 'T12:00:00').getDay()];
      const dataFmt = (() => { const [a,m,d] = iso.split('-'); return `${d}/${m}`; })();
      const max = Math.round(diario.temperature_2m_max[idx]);
      const min = Math.round(diario.temperature_2m_min[idx]);
      return `<div class="clima-dia"><div>${diaSemana} ${dataFmt}</div><span class="emoji">${info.emoji}</span><div><span class="max">${max}°</span> ${min}°</div></div>`;
    }).join('');

    box.innerHTML = `
      <div class="clima-agora">
        <span class="emoji">${emojiAtual}</span>
        <div><div class="temp">${tempAtual}°C</div><div class="desc">${infoAtual.texto} · Campina Grande/PB · ${dataAtualFmt} ${horaAtualIso || ''}</div></div>
      </div>
      <div class="clima-previsao">${diasHtml}</div>
    `;
    box.style.display = 'block';
  } catch(err){
    console.warn('carregarClima: falha ao buscar previsão da Open-Meteo — bloco fica oculto (nunca mostra dado antigo/inventado).', err);
  }
}
carregarClima();

async function carregar(){
  const token = new URLSearchParams(location.search).get('token');
  if(!token){ renderErro('link invalido'); return; }

  let resp, dados;
  try {
    resp = await fetch(`${SUPABASE_URL}/rest/v1/rpc/consultar_solar_compartilhado`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json', 'apikey': SUPABASE_ANON_KEY, 'Authorization': 'Bearer ' + SUPABASE_ANON_KEY },
      body: JSON.stringify({ p_token: token }),
    });
  } catch(e){
    document.getElementById('app').innerHTML = `<div class="msg"><h2>${ICONE_MARCA_INLINE} Sem conexão</h2><p>Não consegui buscar os dados agora. Confira sua internet e recarregue a página.</p></div>`;
    return;
  }
  if(!resp.ok){
    let corpo = null;
    try { corpo = await resp.json(); } catch(e){}
    renderErro((corpo && (corpo.message || corpo.hint)) || '');
    return;
  }
  dados = await resp.json();

  // NOVO 12/08/2026 (URL amigável) — se chegamos aqui via redirect de /solar/<token> (feito pelo
  // 404.html, truque padrão do GitHub Pages pra caminhos "bonitos" numa hospedagem sem rewrite de
  // servidor), troca a URL visível de volta pra /solar/<token> sem recarregar a página, pra quem olhar
  // a barra de endereço depois não ver o ?token= cru. Só roda em http(s) real, não em file:// local.
  if(location.protocol.indexOf('http') === 0){
    const urlBonita = '/solar/' + encodeURIComponent(token);
    if(location.pathname + location.search !== urlBonita) history.replaceState(null, '', urlBonita);
  }

  const leituras = dados.leituras || [];
  const geracaoDiaria = dados.geracaoDiaria || [];
  const ciclo = dados.cicloAberto || null;
  const ciclosFechados = dados.ciclosFechados || [];
  const ultima = leituras.length ? leituras[leituras.length - 1] : null;

  // NOVO 12/08/2026 (pedido do usuário: "precisa aparecer o card de geração do dia no compartilhado")
  // CORRIGIDO 14/08/2026 (achado do usuário: "após 00hs deveria mostrar outra coisa até o primeiro
  // dado do SAJ do dia" — o card mostrava o último registro do array como se fosse "hoje", mesmo
  // depois da virada do dia, quando na verdade ainda é a geração de ONTEM, só ainda não tem leitura
  // nova porque o robô só roda das 6h às 18h de Brasília). Mesmo truque de fuso já usado em
  // hydrate-onda5-qualidade-geracao.js (painel privado): desloca -3h e compara a data, só mostra o
  // registro se a data bater com "hoje" de Brasília de verdade.
  const hojeStrBrasilia = new Date(Date.now() - 3*3600*1000).toISOString().slice(0,10);
  const ultimoRegistroGeracao = geracaoDiaria.length ? geracaoDiaria[geracaoDiaria.length - 1] : null;
  const geracaoHojeReg = (ultimoRegistroGeracao && ultimoRegistroGeracao.data === hojeStrBrasilia) ? ultimoRegistroGeracao : null;

  const importadoAcum = ultima ? ultima.leitura03 : null;
  const exportadoAcum = ultima ? ultima.leitura103 : null;
  const geracaoAcum = ultima ? ultima.geracaoAcumulada : null;
  const temGeracao = geracaoAcum !== null && geracaoAcum !== undefined;
  const saldoLiquidoAcum = (importadoAcum!=null && exportadoAcum!=null) ? Math.round((exportadoAcum - importadoAcum)*100)/100 : null;

  let consumoDiretoAcum=null, consumoTotalCasa=null, autoconsumoPct=null, dependenciaPct=null, exportacaoDaGeracaoPct=null;
  let economiaEstimada=null, valorKwhGerado=null, paybackAnos=null;
  if(temGeracao && importadoAcum!=null && exportadoAcum!=null){
    // MESMA fórmula de graficos-cenarios-lazy.js (painel privado) — ver seção "Fluxo de energia"/
    // "Eficiência da unidade". importado = leitura03, exportado = leitura103.
    consumoDiretoAcum = Math.round((geracaoAcum - exportadoAcum) * 100) / 100;
    consumoTotalCasa = Math.round((consumoDiretoAcum + importadoAcum) * 100) / 100;
    autoconsumoPct = consumoTotalCasa > 0 ? Math.round((consumoDiretoAcum / consumoTotalCasa) * 1000) / 10 : 0;
    dependenciaPct = consumoTotalCasa > 0 ? Math.round((importadoAcum / consumoTotalCasa) * 1000) / 10 : 0;
    exportacaoDaGeracaoPct = geracaoAcum > 0 ? Math.round((exportadoAcum / geracaoAcum) * 1000) / 10 : 0;

    // CORRIGIDO 12/08/2026 (2ª correção, achado do usuário: "R$133,63 pra mim é muito mais") — a
    // versão anterior (min(geração, consumoTotalCasa) × tarifa) limitava a economia ao que a CASA
    // sozinha consumiu localmente, descartando por completo os kWh exportados — que na prática viram
    // crédito de compensação (net metering) e valem quase a tarifa cheia, só descontado o Fio B/"Ajuste
    // GD II" da Lei 14.300 (cobrado SÓ sobre o kWh compensado, nunca sobre o autoconsumo direto).
    // Agora: autoconsumo direto vale a tarifa cheia, exportado vale tarifa menos Fio B real (valor
    // tirado de faturas Energisa reais do usuário, ver FIO_B_RS_POR_KWH acima). Ainda é estimativa
    // simplificada (não projeta mês a mês, não é o simulador completo do painel privado) — deixado
    // claro na tela.
    economiaEstimada = Math.round((consumoDiretoAcum * TARIFA_RS_POR_KWH + exportadoAcum * (TARIFA_RS_POR_KWH - FIO_B_RS_POR_KWH)) * 100) / 100;
    valorKwhGerado = TARIFA_RS_POR_KWH;
    // CORRIGIDO 14/08/2026 (achado do usuário, "como vou pegar 14800 em 7 meses?" — bug real): usava
    // ciclo.data_inicio (início do ciclo GD ATUAL, só ~7-15 dias) em vez da data de ATIVAÇÃO do
    // sistema (2026-07-21, ~3-4 semanas) — "economiaEstimada" já é acumulada desde a ativação (soma
    // toda leitura desde o início, não só o ciclo aberto), então dividir por um número de dias muito
    // menor inflava a economia anualizada e encolhia o payback artificialmente.
    const diasDesdeAtivacao = Math.max(1, Math.round((Date.now() - new Date(SOLAR_DATA_ATIVACAO).getTime()) / 86400000));
    const economiaAnualEstimada = (economiaEstimada / diasDesdeAtivacao) * 365;
    paybackAnos = economiaAnualEstimada > 0 ? Math.round((INVESTIMENTO_PADRAO / economiaAnualEstimada) * 10) / 10 : null;
  }

  // NOVO 14/08/2026 (pedido do usuário: "acrescente na aba compartilhada o menu 03 Crédito garantido
  // vs. crédito em formação"). Fluxo 1 (fechado) — direto de ciclosFechados (RPC), congelado, não
  // recalcula nada. Fluxo 2 (em formação) — deriva do saldo líquido acumulado (leituras reais, já
  // calculado acima) menos o baseline_kwh do ciclo aberto, mesma fórmula do painel privado.
  const OFFSET_GD_HOJE = Math.max(0, Math.min(11, offsetMesesCicloGD()));
  const METAS_ABERTO = { wallace: KWH_ANO_ANTERIOR_WALLACE[OFFSET_GD_HOJE], wellida: CONSUMO_MENSAL_IRMA[OFFSET_GD_HOJE] };

  let fluxo2 = null;
  if(ciclo && saldoLiquidoAcum!=null && ciclo.baseline_kwh!=null && ciclo.rateio_wallace_pct!=null){
    const baselineKwh = Number(ciclo.baseline_kwh);
    const rateioWallace = Number(ciclo.rateio_wallace_pct);
    const rateioIrma = Number(ciclo.rateio_irma_pct);
    const creditoLiquidoCiclo = Math.round((saldoLiquidoAcum - baselineKwh) * 100) / 100;
    const creditoWallaceAtual = Math.round(creditoLiquidoCiclo * rateioWallace * 100) / 100;
    const creditoIrmaAtual = Math.round(creditoLiquidoCiclo * rateioIrma * 100) / 100;
    const diasDesdeInicioCiclo = Math.max(0, Math.round((Date.now() - new Date(ciclo.data_inicio).getTime()) / 86400000));
    const { dias: diasRestantesGD, data: proximoFechamentoGD } = calcularDiasRestantesGD(DIA_LEITURA_GD);
    const periodoTxt = fmtData(ciclo.data_inicio) + ' → ' + proximoFechamentoGD.toLocaleDateString('pt-BR');

    function montarPrevisao(meta, creditoAtual, corBarra, rateioTxt){
      const creditoRestante = Math.round((meta-creditoAtual)*100)/100;
      const mediaNecessaria = diasRestantesGD>0 ? Math.round((creditoRestante/diasRestantesGD)*10)/10 : 0;
      const mediaRealizada = diasDesdeInicioCiclo>0 ? Math.round((creditoAtual/diasDesdeInicioCiclo)*10)/10 : 0;
      const previsao = Math.round((creditoAtual + mediaRealizada*diasRestantesGD)*10)/10;
      const status = calcularStatusGD(mediaRealizada, mediaNecessaria);
      const pct = Math.min(100, Math.max(0, Math.round(creditoAtual/meta*100)));
      return { meta, creditoAtual, pct, corBarra, rateioTxt, periodoTxt, diasRestantesGD, mediaNecessaria, mediaRealizada, previsao, status };
    }
    fluxo2 = {
      periodoTxt,
      wallace: montarPrevisao(METAS_ABERTO.wallace, creditoWallaceAtual, '#34c98a', fmtPct(rateioWallace*100)),
      // CORRIGIDO 14/08/2026 (pedido do usuário: "a escala da minha irmã deve ser igual a minha verde
      // no fluxo em aberto") — cor da barra do Fluxo 2 (em formação) igual pras 2 casas; só o Fluxo 1
      // (fechado) mantém a distinção visual verde/âmbar (ali a cor tem significado: âmbar = ainda não
      // cobriu a meta, ver faltam>0 em montarFechado/montarBlocoCasa).
      wellida: montarPrevisao(METAS_ABERTO.wellida, creditoIrmaAtual, '#34c98a', fmtPct(rateioIrma*100)),
    };
  }

  // ciclosFechados vem ORDER BY data_inicio ASC (RPC) — o mais recente é o último elemento.
  const ultimoFechado = ciclosFechados.length ? ciclosFechados[ciclosFechados.length-1] : null;
  // Dia do mês em que a fatura de cada casa fecha (mesmo texto fixo já usado no painel privado,
  // legend-note da seção 03 — Wallace=apartamento dia 21, Wellida=casa da mãe dia 8, mesmo dia do
  // fechamento da GD). Não vem da RPC, é fato fixo do contrato de cada UC.
  const DIA_FATURA = { wallace: 21, wellida: 8 };
  let fluxo1 = null;
  if(ultimoFechado){
    const dataFimTxt = fmtData(ultimoFechado.dataFim);
    const offsetFechado = Math.max(0, Math.min(11, offsetMesesCicloGD(ultimoFechado.dataFim)));
    const metaWallaceFechado = KWH_ANO_ANTERIOR_WALLACE[offsetFechado];
    const metaWellidaFechado = CONSUMO_MENSAL_IRMA[offsetFechado];
    function montarFechado(meta, creditoFechado, diaFatura){
      const cobertura = meta>0 ? Math.round((creditoFechado/meta)*1000)/10 : 0;
      const faltam = Math.round((meta-creditoFechado)*10)/10;
      const pct = Math.min(100, Math.max(0, Math.round(cobertura)));
      return { meta, creditoFechado, cobertura, faltam, pct, dataFimTxt, diaFatura };
    }
    fluxo1 = {
      wallace: montarFechado(metaWallaceFechado, Number(ultimoFechado.creditoWallaceKwh), DIA_FATURA.wallace),
      wellida: montarFechado(metaWellidaFechado, Number(ultimoFechado.creditoIrmaKwh), DIA_FATURA.wellida),
    };
  }

  // NOVO/CORRIGIDO 14/08/2026 (pedido do usuário: "melhore as legendas, deixe mais parecida com o
  // site" + achado real: "Fechado em undefined" — dataFimTxt tinha ficado só no objeto fluxo1 pai,
  // nunca chegava no objeto por casa que o template lê). Estrutura reorganizada em mini-cards
  // (Fechado em/Meta/Faltam, Período/Rateio/Média, Dias restantes/Necessário/Previsão) — mesmo
  // agrupamento e mesmos rótulos da seção 03 do painel privado, só com a classe .grid já existente
  // nesta página no lugar do grid-3/.card aninhado do painel (mantém a densidade visual do resto
  // desta página, que já usa .stat-lbl/.stat-val pro mesmo tipo de mini-stat em outros cards).
  function montarBlocoCasa(nome, dadosFluxo1, dadosFluxo2){
    const f1 = dadosFluxo1 ? `
      <div class="credito-fluxo-lbl">🔒 Fluxo 1 — crédito fechado, garantido pra próxima conta</div>
      <div class="progress"><div class="progress-fill" style="width:${dadosFluxo1.pct}%;background:${dadosFluxo1.faltam<=0?'var(--green)':'var(--amber)'}"></div></div>
      <div class="credito-fracao"><span>${fmtKwh(dadosFluxo1.creditoFechado)} / ${fmtKwh(dadosFluxo1.meta)}</span><span>${fmtPct(dadosFluxo1.cobertura)}</span></div>
      <div class="stat-grid">
        <div class="stat-box"><div class="stat-lbl">Fechado em</div><div class="stat-val" style="font-size:0.92rem">${dadosFluxo1.dataFimTxt}</div></div>
        <div class="stat-box"><div class="stat-lbl">Meta</div><div class="stat-val" style="font-size:0.92rem">${fmtKwh(dadosFluxo1.meta)}</div></div>
        <div class="stat-box"><div class="stat-lbl">Faltam (se negativo)</div><div class="stat-val" style="font-size:0.92rem;color:${dadosFluxo1.faltam>0?'var(--amber)':'var(--green)'}">${dadosFluxo1.faltam>0 ? fmtKwh(dadosFluxo1.faltam) : 'Cobre com sobra de '+fmtKwh(Math.abs(dadosFluxo1.faltam))}</div></div>
      </div>
      <div class="stat-sub" style="margin-top:0.5rem">Este valor não muda mais — é o que a Energisa vai abater na fatura que fecha por volta do dia ${dadosFluxo1.diaFatura}.</div>
    ` : `<div class="stat-sub">Sem ciclo fechado ainda.</div>`;
    const f2 = dadosFluxo2 ? `
      <div class="credito-fluxo-lbl" style="margin-top:1.1rem">🌱 Fluxo 2 — GD atual, crédito em formação</div>
      <div class="progress"><div class="progress-fill" style="width:${dadosFluxo2.pct}%;background:${dadosFluxo2.corBarra}"></div></div>
      <div class="credito-fracao"><span>${fmtKwh(dadosFluxo2.creditoAtual)} / ${fmtKwh(dadosFluxo2.meta)} (meta do mês, referência)</span><span>${dadosFluxo2.pct}%</span></div>
      <div class="stat-grid">
        <div class="stat-box"><div class="stat-lbl">Período</div><div class="stat-val" style="font-size:0.8rem">${dadosFluxo2.periodoTxt}</div></div>
        <div class="stat-box"><div class="stat-lbl">Rateio ${nome}</div><div class="stat-val" style="font-size:0.92rem">${dadosFluxo2.rateioTxt}</div></div>
        <div class="stat-box"><div class="stat-lbl">Média atual</div><div class="stat-val" style="font-size:0.92rem">${fmtKwh(dadosFluxo2.mediaRealizada)}/dia</div></div>
        <div class="stat-box"><div class="stat-lbl">Dias restantes (GD)</div><div class="stat-val" style="font-size:0.92rem">${dadosFluxo2.diasRestantesGD} dias</div></div>
        <div class="stat-box"><div class="stat-lbl">Necessário/dia</div><div class="stat-val" style="font-size:0.92rem">${fmtKwh(dadosFluxo2.mediaNecessaria)}/dia</div></div>
        <div class="stat-box"><div class="stat-lbl">Previsão de fechamento</div><div class="stat-val" style="font-size:0.92rem">${fmtKwh(dadosFluxo2.previsao)}</div></div>
      </div>
      <div style="margin-top:0.6rem;font-weight:600;font-size:0.8rem;color:${dadosFluxo2.status.cor}">${dadosFluxo2.status.emoji} ${dadosFluxo2.status.texto} <span style="color:var(--text-dim);font-weight:400">(ritmo de geração desta GD)</span></div>
    ` : `<div class="stat-sub" style="margin-top:0.9rem">⚠ Sem ciclo aberto no momento.</div>`;
    return `<div class="credito-casa"><div style="font-weight:600;margin-bottom:0.4rem">⚡ ${nome}</div>${f1}${f2}</div>`;
  }

  const creditoGarantidoHtml = (fluxo1 || fluxo2) ? `
    <div class="card">
      <div class="stat-lbl" style="margin-bottom:0.3rem">📈 Crédito garantido vs. crédito em formação</div>
      <div class="stat-sub" style="margin-bottom:0.9rem">Dois créditos coexistem ao mesmo tempo, sem se misturar: o que já fechou (garantido, vai pra próxima fatura) e o que a usina está gerando agora (só fecha no próximo fechamento da GD${fluxo2 ? ', ' + fluxo2.periodoTxt : ''}).</div>
      ${montarBlocoCasa('Wallace', fluxo1 && fluxo1.wallace, fluxo2 && fluxo2.wallace)}
      <div style="border-top:1px solid var(--border);margin:1rem 0"></div>
      ${montarBlocoCasa('Wellida', fluxo1 && fluxo1.wellida, fluxo2 && fluxo2.wellida)}
      <div class="stat-sub" style="margin-top:0.9rem;padding-top:0.7rem;border-top:1px solid var(--border)">Leitura/fatura Wallace (apartamento): dia 21 do mês (janela 19-21). Leitura/fatura Wellida (casa da mãe): dia 8 do mês (janela 06-09) — mesmo dia do fechamento da GD. 🟢 no ritmo (média ≥ necessário pra fechar a meta) · 🟡 atenção (déficit menor que 10%) · 🔴 atrasado (déficit maior que 10%) — status do Fluxo 2 (em formação), não do Fluxo 1 (já fechado).</div>
    </div>
  ` : '';

  // NOVO 11/08/2026 (pedido do usuário: "coloque mais gráficos lá no link, se possível todos os
  // gráficos") - "Histórico mês a mês" (importado/consumo direto/exportado/saldo líquido), mesma
  // ideia do gráfico do painel privado (seção 02), recalculada aqui a partir do delta entre leituras
  // consecutivas (só dado solar, já devolvido pela RPC). Mês de cada intervalo = mês da leitura que
  // fecha o intervalo.
  const historicoMensal = {}; // 'YYYY-MM' -> {importado, exportado, consumoDireto, saldo}
  for(let i=1;i<leituras.length;i++){
    const ant = leituras[i-1], atu = leituras[i];
    if(atu.leitura03==null || ant.leitura03==null || atu.leitura103==null || ant.leitura103==null) continue;
    const mesKey = atu.data.slice(0,7);
    const dImportado = Math.round((atu.leitura03 - ant.leitura03)*100)/100;
    const dExportado = Math.round((atu.leitura103 - ant.leitura103)*100)/100;
    let dConsumoDireto = null;
    if(atu.geracaoAcumulada!=null && ant.geracaoAcumulada!=null){
      dConsumoDireto = Math.round(((atu.geracaoAcumulada - ant.geracaoAcumulada) - dExportado)*100)/100;
    }
    const dSaldo = Math.round((dExportado - dImportado)*100)/100;
    if(!historicoMensal[mesKey]) historicoMensal[mesKey] = {importado:0, exportado:0, consumoDireto:0, temConsumoDireto:false, saldo:0};
    historicoMensal[mesKey].importado += dImportado;
    historicoMensal[mesKey].exportado += dExportado;
    historicoMensal[mesKey].saldo += dSaldo;
    if(dConsumoDireto!=null){ historicoMensal[mesKey].consumoDireto += dConsumoDireto; historicoMensal[mesKey].temConsumoDireto = true; }
  }
  const mesesHistorico = Object.keys(historicoMensal).sort();
  const mesLbl = (chave)=>{ const [a,m] = chave.split('-'); return ['Jan','Fev','Mar','Abr','Mai','Jun','Jul','Ago','Set','Out','Nov','Dez'][parseInt(m,10)-1]+'/'+a.slice(2); };

  const expiraTxtEl = document.getElementById('expiraTxt');
  if(expiraTxtEl) expiraTxtEl.textContent = dados.expiraEm ? fmtData(dados.expiraEm) : '—';

  const app = document.getElementById('app');
  app.innerHTML = `
    <div class="card">
      <div class="grid">
        <div><div class="stat-lbl">Geração hoje</div><div class="stat-val" style="color:var(--amber)">${geracaoHojeReg ? fmtKwh(geracaoHojeReg.kwh) : '—'}</div><div class="stat-sub">${geracaoHojeReg ? fmtData(geracaoHojeReg.data) : 'aguardando leitura do robô'}</div></div>
        <div><div class="stat-lbl">Geração acumulada</div><div class="stat-val" style="color:var(--amber)">${temGeracao ? fmtKwh(geracaoAcum) : '—'}</div><div class="stat-sub">${temGeracao ? '' : 'aguardando leitura do inversor'}</div></div>
        <div><div class="stat-lbl">Autoconsumo</div><div class="stat-val" style="color:var(--green)">${fmtPct(autoconsumoPct)}</div><div class="stat-sub">${consumoDiretoAcum!=null ? fmtKwh(consumoDiretoAcum)+' direto das placas' : 'dados insuficientes'}</div></div>
        <div><div class="stat-lbl">Dependência da rede</div><div class="stat-val" style="color:var(--blue)">${fmtPct(dependenciaPct)}</div><div class="stat-sub">${importadoAcum!=null ? fmtKwh(importadoAcum)+' importados' : ''}</div></div>
        <div><div class="stat-lbl">Exportação da geração</div><div class="stat-val" style="color:var(--purple)">${fmtPct(exportacaoDaGeracaoPct)}</div><div class="stat-sub">${exportadoAcum!=null ? fmtKwh(exportadoAcum)+' exportados' : ''}</div></div>
      </div>
      ${saldoLiquidoAcum!=null ? `<div class="stat-sub" style="margin-top:0.9rem;padding-top:0.9rem;border-top:1px solid var(--border)">Saldo líquido: <strong style="color:${saldoLiquidoAcum>=0?'var(--green)':'var(--red)'}">${saldoLiquidoAcum>=0?'+':''}${fmtKwh(saldoLiquidoAcum)}</strong> ${saldoLiquidoAcum>=0 ? '— excedente (exportando mais do que importa)' : '— dependendo mais da rede do que exportando'}</div>` : ''}
    </div>

    ${creditoGarantidoHtml}

    <div class="card">
      <div class="stat-lbl" style="margin-bottom:0.6rem">Economia estimada (desde a ativação)</div>
      <div class="grid">
        <div><div class="stat-lbl">Economia acumulada</div><div class="stat-val" style="color:var(--green)">${fmt(economiaEstimada)}</div></div>
        <div><div class="stat-lbl">Valor do kWh gerado</div><div class="stat-val">${valorKwhGerado!=null ? fmt(valorKwhGerado) : '—'}</div></div>
        <div><div class="stat-lbl">Payback estimado</div><div class="stat-val">${paybackAnos!=null ? paybackAnos.toLocaleString('pt-BR',{maximumFractionDigits:1})+' anos' : '—'}</div><div class="stat-sub">investimento de ${fmt(INVESTIMENTO_PADRAO)} (padrão)</div></div>
      </div>
      <div class="stat-sub" style="margin-top:0.8rem">Autoconsumo direto à tarifa cheia, exportado à tarifa menos Fio B (crédito Lei 14.300) — estimativa simplificada, sem projeção mês a mês, não é a fatura real.</div>
    </div>

    <div class="card">
      <div class="stat-lbl" style="margin-bottom:0.8rem">Geração diária (kWh)</div>
      <div class="chart-wrap"><canvas id="cGeracaoDiaria"></canvas></div>
    </div>

    ${mesesHistorico.length ? `<div class="card">
      <div class="stat-lbl" style="margin-bottom:0.8rem">Histórico mês a mês (kWh)</div>
      <div class="chart-wrap"><canvas id="cHistoricoMensal"></canvas></div>
    </div>` : ''}

    ${ciclosFechados.length ? `<div class="card">
      <div class="stat-lbl" style="margin-bottom:0.8rem">Rateio Solar — crédito por casa, por ciclo fechado</div>
      <div class="chart-wrap"><canvas id="cRateioSolar"></canvas></div>
    </div>` : ''}

    <div class="footer-note">Sistema Wallace Lira — página de compartilhamento público, só leitura de dados solares.<br>Nenhum dado financeiro é exposto por este link.</div>
  `;

  if(geracaoDiaria.length && window.Chart){
    const ultimos = geracaoDiaria.slice(-30);
    // DEFENSIVO (11/08/2026, achado de auditoria): mesma proteção aplicada em todo new Chart() do repo.
    { const __chartExistente = Chart.getChart(document.getElementById('cGeracaoDiaria')); if (__chartExistente) __chartExistente.destroy(); }
    new Chart(document.getElementById('cGeracaoDiaria'), {
      type: 'bar',
      data: {
        labels: ultimos.map(r => fmtData(r.data)),
        datasets: [
          { data: ultimos.map(r => r.kwh), backgroundColor: '#e8a63a', borderRadius: 3 },
          // NOVO 12/08/2026 (pedido do usuário: "gráfico de geração diária precisa da linha de consumo
          // médio das 3 casas como aparece no meu site") — linha tracejada constante, mesma ideia do
          // painel privado (graficos-cenarios-lazy.js), aqui como dataset 'line' nativo do Chart.js
          // (mixed chart bar+line) por ser mais simples numa página autocontida sem plugin customizado.
          { type: 'line', label: `Consumo médio das 3 casas (${fmtKwh(CONSUMO_MEDIO_3_CASAS_KWH)}/dia)`, data: ultimos.map(()=>CONSUMO_MEDIO_3_CASAS_KWH), borderColor: 'rgba(226,85,79,0.85)', borderDash: [5,4], borderWidth: 2, pointRadius: 0, fill: false },
        ],
      },
      options: {
        responsive: true, maintainAspectRatio: false,
        layout: { padding: { top: 18 } },
        plugins: {
          legend: { display: true, position: 'bottom', labels: { boxWidth: 8, padding: 10, font: { size: 9.5 } } },
          tooltip: { callbacks: { label: c => c.dataset.type === 'line' ? c.dataset.label : c.raw + ' kWh' } },
        },
        scales: {
          x: { grid: { display: false }, ticks: { font: { size: 9 }, maxRotation: 60, minRotation: 60 } },
          y: { grid: { color: '#2a2d31' }, ticks: { callback: v => v, font: { size: 10 } } },
        },
      },
      plugins: [barValuePlugin],
    });
  }

  if(mesesHistorico.length && window.Chart){
    { const __chartExistente = Chart.getChart(document.getElementById('cHistoricoMensal')); if (__chartExistente) __chartExistente.destroy(); }
    // SIMPLIFICADO 12/08/2026 (achado do usuário: "Histórico mês a mês (kWh) - revise esse gráfico
    // está muito confuso") — a versão anterior tinha 4 barras por mês (importado, consumo direto
    // calculado, exportado, saldo líquido positivo/negativo misturados na mesma escala), difícil de
    // ler. Reduzido às 2 séries que realmente importam pra entender o fluxo com a rede: importado x
    // exportado (o saldo líquido acumulado já aparece no card de resumo, no topo da página).
    new Chart(document.getElementById('cHistoricoMensal'), {
      type: 'bar',
      data: {
        labels: mesesHistorico.map(mesLbl),
        datasets: [
          { label:'Importado da rede', data: mesesHistorico.map(m=>Math.round(historicoMensal[m].importado*10)/10), backgroundColor:'#e2554f', borderRadius:3 },
          { label:'Exportado para a rede', data: mesesHistorico.map(m=>Math.round(historicoMensal[m].exportado*10)/10), backgroundColor:'#3987e5', borderRadius:3 },
        ],
      },
      options: {
        responsive: true, maintainAspectRatio: false,
        layout: { padding: { top: 18 } },
        plugins: { legend: { position:'bottom', labels:{boxWidth:8, padding:10, font:{size:9.5}} }, tooltip: { callbacks: { label: c => c.dataset.label+': '+c.raw+' kWh' } } },
        scales: {
          x: { grid: { display: false }, ticks: { font: { size: 9.5 } }, categoryPercentage:0.8, barPercentage:0.7 },
          y: { grid: { color: '#2a2d31' }, ticks: { callback: v => v+' kWh', font: { size: 9.5 } } },
        },
      },
      plugins: [barValuePlugin],
    });
  }

  if(ciclosFechados.length && window.Chart){
    { const __chartExistente = Chart.getChart(document.getElementById('cRateioSolar')); if (__chartExistente) __chartExistente.destroy(); }
    new Chart(document.getElementById('cRateioSolar'), {
      type: 'bar',
      data: {
        labels: ciclosFechados.map(c => fmtData(c.dataFim)),
        datasets: [
          { label:'Crédito Wallace', data: ciclosFechados.map(c=>c.creditoWallaceKwh), backgroundColor:'#34c98a', borderRadius:3 },
          { label:'Crédito Wellida', data: ciclosFechados.map(c=>c.creditoIrmaKwh), backgroundColor:'#14b8a6', borderRadius:3 },
        ],
      },
      options: {
        responsive: true, maintainAspectRatio: false,
        layout: { padding: { top: 18 } },
        plugins: { legend: { position:'bottom', labels:{boxWidth:8, padding:10, font:{size:9.5}} }, tooltip: { callbacks: { label: c => c.dataset.label+': '+c.raw+' kWh' } } },
        scales: {
          x: { grid: { display: false }, ticks: { font: { size: 9.5 } } },
          y: { grid: { color: '#2a2d31' }, ticks: { callback: v => v+' kWh', font: { size: 9.5 } } },
        },
      },
      plugins: [barValuePlugin],
    });
  }
}

carregar();
</script>
</body>
</html>
